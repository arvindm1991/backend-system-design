  <h1>Stacks</h1>
  <p class="lede">After this lesson you will recognize the problems where "the most recent unfinished thing must be dealt with first": matching brackets, undo and backspace, and the monotonic stack trick behind "next greater element" and "how many days until a warmer day". You will be able to turn each of those O(n²) rescans into a single O(n) pass, and you will know when a queue is the right tool instead.</p>

  <h2>1. What a stack is</h2>
  <p>A <b>stack</b> is a pile where you only touch the top: you <b>push</b> a new item onto the top, and you <b>pop</b> the top item off. The last thing in is the first thing out, called <b>LIFO</b> (last in, first out). A pile of plates works this way, and so does the undo history in any editor: Ctrl+Z undoes the <i>most recent</i> change first.</p>
  <p>In JavaScript a plain array is a perfectly good stack:</p>
  <pre><code class="lang-js">const stack = [];
stack.push('a');                      // ['a']
stack.push('b');                      // ['a', 'b']
const top = stack[stack.length - 1];  // peek: 'b' (doesn't remove it)
stack.pop();                          // returns 'b'; stack is ['a']
stack.length === 0;                   // is it empty?</code></pre>
  <p><code>push</code>, <code>pop</code> and peeking at the last element are all <b>O(1)</b>: constant time, no matter how big the stack is (Big-O is introduced in the <code>dsa-approach</code> lesson; O(1) means "doesn't grow with n", O(n) means "grows in step with n"). Avoid <code>shift</code> and <code>unshift</code> for stacks: they work on the front of the array and have to move every other element.</p>

  <h2>2. The trigger: when to think "stack"</h2>
  <p>Ask yourself: <b>"When I see a new item, do I need to compare it with or resolve the most recent unfinished item?"</b> If yes, keep the unfinished items on a stack. Words that should set this off:</p>
  <ul>
    <li><b>"valid parentheses / brackets"</b>, <b>"balanced"</b>, <b>"nested"</b>, "matching tags".</li>
    <li><b>"undo"</b>, <b>"backspace"</b>, "remove adjacent duplicates", "simplify a path like <code>/a/./b/../c</code>", "evaluate an expression".</li>
    <li><b>"next greater / next smaller element"</b>, <b>"how many days until a warmer day"</b>, "stock span", "previous smaller": the <b>monotonic stack</b>.</li>
  </ul>
  <table class="tbl">
    <thead><tr><th>Shape</th><th>What lives on the stack</th><th>Pop when</th><th>Classic problems</th></tr></thead>
    <tbody>
      <tr><td>Matching</td><td>Openers waiting for their closer</td><td>A closer arrives (it must match the top)</td><td>Valid brackets, HTML tag matching</td></tr>
      <tr><td>Undo / cancel</td><td>The result built so far</td><td>An "undo" item arrives (<code>#</code>, <code>..</code>, a duplicate)</td><td>Backspace compare, simplify path, remove adjacent duplicates</td></tr>
      <tr><td>Monotonic</td><td>Indexes still waiting for an answer, values sorted bottom→top</td><td>A new value beats the top (it is the answer for the top)</td><td>Next greater element, daily temperatures, stock span</td></tr>
    </tbody>
  </table>

  <h2>3. Worked problem: valid brackets</h2>
  <p>PageTurn's quiz builder lets teachers type math expressions like <code>{[(2+3)*4]-1}</code>. Before saving, the app should reject unbalanced ones like <code>([)]</code> or <code>((2+3)</code>. <b>Problem:</b> given a string of the characters <code>()[]{}</code> (ignore anything else), return whether every opener is closed by the matching closer in the right order.</p>
  <p><b>Brute force.</b> Keep deleting adjacent pairs <code>()</code>, <code>[]</code>, <code>{}</code> until nothing changes; valid means you end with an empty string.</p>
  <pre><code class="lang-js">// Brute force. In TypeScript you'd just add types.
function isBalancedBrute(text) {
  let s = text.replace(/[^()[\]{}]/g, '');   // keep only brackets
  let previous = null;
  while (s !== previous) {
    previous = s;
    s = s.replace('()', '').replace('[]', '').replace('{}', '');
  }
  return s.length === 0;
}</code></pre>
  <p>Each pass scans the whole string, and deeply nested input like <code>((((...))))</code> removes only one pair per bracket type per pass, so you need up to n/2 passes: <b>O(n²)</b>. The repeated work: rescanning the entire string to find the next pair, when the next pair is always "the newest opener plus the next closer".</p>
  <p><b>With a stack.</b> Walk left to right. Push every opener. When a closer arrives, the <i>most recent</i> unclosed opener must be its partner: pop it and check. At the end, nothing may be left open.</p>
  <pre><code class="lang-js">function isBalanced(text) {
  const partner = { ')': '(', ']': '[', '}': '{' };
  const open = [];                          // stack of openers waiting for a closer
  for (const ch of text) {
    if (ch === '(' || ch === '[' || ch === '{') {
      open.push(ch);
    } else if (ch in partner) {
      if (open.length === 0) return false;  // closer with nothing to close
      if (open.pop() !== partner[ch]) return false;
    }
    // any other character: ignore
  }
  return open.length === 0;                 // leftovers were never closed
}</code></pre>

  <h2>4. Worked problem: undo with backspace</h2>
  <p>Young students type short answers in PageTurn, and the input log records a backspace as <code>#</code>. Two different logs can produce the same final text: <code>"cat#r"</code> deletes the <code>t</code> and becomes <code>"car"</code>, and <code>"cax#r"</code> deletes the <code>x</code> and also becomes <code>"car"</code>. <b>Problem:</b> given two logs, return whether they produce the same final text. A backspace on empty text does nothing.</p>
  <p><b>Brute force.</b> Find the first <code>#</code>, delete it and the character before it (rebuilding the string), and repeat. Each deletion copies the string: <b>O(n²)</b> for many backspaces. The repeated work: rebuilding the whole string for every single backspace.</p>
  <p><b>With a stack.</b> A backspace undoes the most recent character, so the characters typed so far are a stack: push letters, pop on <code>#</code>.</p>
  <pre><code class="lang-js">function finalText(log) {
  const typed = [];
  for (const ch of log) {
    if (ch === '#') {
      if (typed.length &gt; 0) typed.pop();   // undo the most recent character
    } else {
      typed.push(ch);
    }
  }
  return typed.join('');
}

function sameFinalText(logA, logB) {
  return finalText(logA) === finalText(logB);
}</code></pre>
  <div class="trace">

      <li><code>a</code>, <code>b</code>: push, push. Stack <code>[a, b]</code>.</li>
      <li><code>#</code>: pop <code>b</code>. <code>#</code>: pop <code>a</code>. Stack <code>[]</code>.</li>
      <li><code>c</code>: push. <code>#</code>: pop. Stack <code>[]</code>.</li>
      <li><code>d</code>: push. Stack <code>[d]</code>. <span class="yes">Result "d"</span>.</li>
    </ol>
  </div>

  <h2>5. The monotonic stack: "next greater"</h2>
  <p>PageTurn shows each student a nudge: "for each day, how many days until you read <b>more</b> than you did that day?" Maya's minutes:</p>
  <pre><code class="lang-js">const minutes = [30, 20, 25, 40, 10, 15, 50];
// answer:     [ 3,  1,  1,  3,  1,  1,  0]   (0 = never)</code></pre>
  <p>This is the classic <b>daily temperatures</b> problem (and its sibling, <b>next greater element</b>).</p>
  <p><b>Brute force:</b> for each day, scan forward until you find a bigger value.</p>
  <pre><code class="lang-js">function daysUntilMoreBrute(minutes) {
  const answer = new Array(minutes.length).fill(0);
  for (let i = 0; i &lt; minutes.length; i++) {
    for (let j = i + 1; j &lt; minutes.length; j++) {
      if (minutes[j] &gt; minutes[i]) {
        answer[i] = j - i;
        break;
      }
    }
  }
  return answer;
}</code></pre>
  <p>If the values go down for a long time and then jump (100, 99, 98, ..., 1, 200), every day scans almost to the end: <b>O(n²)</b>. The repeated work: the same future days are rescanned by every earlier day.</p>
  <p><b>The insight.</b> Flip the question around. Instead of each day looking forward for its answer, let each <i>new</i> day ask: "which earlier days am I the answer for?" Keep a stack of the days that are <b>still waiting</b> for a bigger day. That stack is always in decreasing order from bottom to top (if a smaller day were below a bigger one, the bigger one would already have answered it). That's why it's called a <b>monotonic</b> stack: its values only go one direction.</p>
  <p>When a new day arrives, it pops every waiting day smaller than itself, and it is their answer. Then it waits too.</p>

  <p>Variations are tiny edits: <b>next greater element</b> stores <code>minutes[today]</code> instead of the distance; <b>next smaller</b> flips <code>&gt;</code> to <code>&lt;</code> (the stack becomes increasing); <b>previous greater</b> reads the top of the stack <i>after</i> popping, before pushing.</p>

  <h2>6. The templates</h2>
  <p>Two shapes cover almost every stack problem. (In TypeScript you would just add types, e.g. <code>const stack: string[] = []</code>.)</p>
  <pre><code class="lang-js">// Shape 1: matching / undo. The stack holds the "unfinished" items.
function matchingTemplate(items) {
  const stack = [];
  for (const item of items) {
    if (startsSomething(item)) {
      stack.push(item);
    } else if (endsSomething(item)) {
      if (stack.length === 0) return false;   // nothing to close / undo
      const top = stack.pop();
      if (!matches(top, item)) return false;
    }
  }
  return stack.length === 0;                  // or: build the result from the stack
}

// Shape 2: monotonic stack. The stack holds indexes still waiting for an answer.
function nextGreaterTemplate(values) {
  const answer = new Array(values.length).fill(-1);
  const waiting = [];
  for (let i = 0; i &lt; values.length; i++) {
    while (waiting.length &gt; 0 &amp;&amp; values[i] &gt; values[waiting[waiting.length - 1]]) {
      const j = waiting.pop();
      answer[j] = values[i];                  // or i, or i - j
    }
    waiting.push(i);
  }
  return answer;
}</code></pre>

  <h2>7. Queues, briefly</h2>
  <p>A <b>queue</b> is the opposite order: first in, first out (<b>FIFO</b>), like the line at the school library checkout. You add at the back (<i>enqueue</i>) and remove from the front (<i>dequeue</i>). You will use queues for breadth-first search over trees and graphs (the <code>dsa-trees</code> and <code>dsa-graphs</code> lessons), for "process things in the order they arrived", and for a running window of recent events.</p>
  <table class="tbl">
    <thead><tr><th></th><th>Stack</th><th>Queue</th></tr></thead>
    <tbody>
      <tr><td>Order</td><td>Last in, first out</td><td>First in, first out</td></tr>
      <tr><td>Reach for it when</td><td>The newest unfinished thing must be handled first (nesting, undo, next greater)</td><td>Things must be handled in arrival order (BFS, task lines)</td></tr>
      <tr><td>JS</td><td><code>push</code> / <code>pop</code>: O(1)</td><td><code>push</code> + read at a head index: O(1)</td></tr>
    </tbody>
  </table>
  <p>The JavaScript catch: <code>array.shift()</code> removes the first element and, in general, shifts every other element down, so it can cost O(n) per call. Engines optimize some cases, but don't rely on it in an interview. Use a moving head index instead:</p>
  <pre><code class="lang-js">const queue = [firstItem];
let head = 0;                          // index of the next item to process
while (head &lt; queue.length) {
  const item = queue[head];
  head++;                              // "dequeue" in O(1)
  for (const next of neighboursOf(item)) {
    queue.push(next);                  // enqueue
  }
}</code></pre>

  <h2>8. Common mistakes</h2>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Forgetting the two edge checks in bracket matching. A closer with an empty stack (<code>")("</code>): <code>[].pop()</code> returns <code>undefined</code> instead of throwing, so if you don't check <code>stack.length === 0</code> the bug is silent. And leftovers at the end (<code>"(("</code>): if you return <code>true</code> instead of <code>stack.length === 0</code>, unclosed openers pass.</p></div>
  <ul>
    <li><b>Storing values instead of indexes</b> in a monotonic stack when you need a distance ("how many days"). Push the index; you can always look up the value.</li>
    <li><b><code>&gt;</code> vs <code>&gt;=</code></b> in the monotonic pop condition. "Strictly warmer" means equal values must <i>not</i> pop each other. Read the problem for "greater" vs "greater or equal".</li>
    <li><b>Counting instead of stacking.</b> A counter of open brackets works for one bracket type only; with <code>()[]{}</code> it accepts <code>([)]</code>.</li>
    <li><b>Using <code>shift()</code> in a hot loop</b> for a queue. Use a head index.</li>
  </ul>

  <h2>Recap</h2>
  <ul>
    <li>A stack is LIFO: <code>push</code>/<code>pop</code>/peek at the end of a JS array, all O(1).</li>
    <li>Trigger: <b>the newest unfinished item must be resolved first</b>. Brackets, nesting, undo/backspace, simplify path.</li>
    <li>Monotonic stack: keep <b>indexes still waiting</b> for an answer; a new value pops everything it beats. "Next greater", "days until warmer": O(n) instead of O(n²).</li>
    <li>Each item is pushed once and popped at most once, which is why a <code>while</code> inside a <code>for</code> is still O(n).</li>
    <li>Queues are FIFO (arrival order, BFS). In JS use a head index instead of <code>shift()</code>.</li>
  </ul>
