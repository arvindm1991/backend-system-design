  <p class="eyebrow">A course for full-stack builders</p>
  <h1>Backend &amp; System Design</h1>
  <p class="lede">You already ship products and talk to engineers every day. This course gives you the layer underneath: how requests, data, queues and failures really behave, so you can design a system on a whiteboard, defend every box you draw, and build the thing afterwards.</p>
  <div data-continue></div>

  <h2>1. How this course works</h2>
  <p>There are five parts: Parts 1–4 are the backend and system design course, and <b>Part 5</b> is a coding patterns (DSA) track for LeetCode-style interview problems. Each lesson is one page you can finish in about an hour. Every lesson follows the same shape, so you always know where you are:</p>
  <div class="cards">
    <div class="card"><span class="card-k">Scenario first</span><h3>A real product, real numbers</h3><p>Each lesson follows one running example (a reading app for schools, a Claude-like chat app, a ticket site) and starts with what actually happens to it.</p></div>
    <div class="card"><span class="card-k">Traces</span><h3>Step by step, with values</h3><p>Numbered walkthroughs show the exact requests, rows and timings. Read them slowly. They are the lesson.</p></div>
    <div class="card"><span class="card-k">Say it</span><h3>Interview-ready sentences</h3><p>Blue callouts give you the one or two sentences to say in a design discussion. Amber ones flag the classic mistakes.</p></div>
    <div class="card"><span class="card-k">Labs</span><h3>Build the mechanism</h3><p>Small JavaScript exercises that run right here in the page: a paginator, an index, a permission check, a rate limiter, a queue.</p></div>
  </div>

  <h3>Labs, in 30 seconds</h3>
  <p>A lab gives you a short prompt, a starter file and a set of tests. You edit the code in the page and press <b>Run tests</b> (or <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd>). Each test shows a tick or a cross with the reason. Stuck? <b>Hint</b> reveals one nudge at a time. <b>Show solution</b> is there, behind a confirm, for when you have really tried. When every test passes you get a short note on how the mechanism shows up in real systems and what to say about it.</p>
  <p>The backend labs are plain JavaScript, no frameworks, and they are deliberately small (15 to 30 minutes). Anything that depends on time takes a fake clock, so tests are repeatable. That is also how real backend code is tested.</p>
  <div class="callout tip"><span class="callout-label">Part 5 is how you pass the coding round</span><p>Most interview problems are one of about 13 patterns in disguise. Part 5 starts from zero (what O(n) actually means, and how the input size tells you how fast you need to be), then teaches each pattern by its <b>trigger words</b>, a step-by-step trace and 2–3 classic problems you solve right here. Start with <a href="#dsa-approach">How to attack any problem</a>.</p></div>

  <h3>Your progress</h3>
  <p>Lessons you mark as read and labs you pass are saved in this browser only. The bar at the top shows both. Use <b>Mark as read</b> at the bottom of a lesson, or just click <b>Done · next</b>. Nothing is sent anywhere.</p>

  <div class="callout key"><span class="callout-label">The one habit that matters</span><p>After each lesson, close the page and explain the main idea out loud in two minutes, as if a colleague asked "why didn't we just…?". If you stumble, that is the part to reread. System design interviews reward people who can reason out loud, not people who memorised diagrams.</p></div>

  <h2>2. A 6-week plan, about an hour a day</h2>
  <p>Five sessions a week, one lighter review day. A <b>coding patterns track</b> (Part 5) runs alongside all six weeks: two or three pattern lessons a week, each with LeetCode-style problems you solve in the browser. Do them as a second short block on Mon/Wed/Fri, or on the weekend. By week 6 you can recognize the ~13 patterns behind most interview problems and know how to attack one you have never seen.</p>
  <p> A good hour looks like this: <b>10 minutes</b> redoing yesterday's quiz from memory, <b>35 minutes</b> reading with a notepad (redraw the diagram, follow the trace), and <b>15 minutes</b> on the lab or on saying the interview callouts out loud. Lessons with labs may spill into a second day. That is fine.</p>

  <h2>4. What "good" sounds like</h2>
  <p>You are not trying to sound like a textbook. You are trying to sound like the person in the room who has thought about what happens at 8:05am when 40,000 students open the app at once. Every trade-off in this course is phrased the same way, and you should borrow the phrasing:</p>
  <div class="callout"><span class="callout-label">The trade-off sentence</span><p><b>X gives you A at the cost of B. I'd choose it here because C.</b> For example: "Cursor pagination gives us stable pages while new posts arrive, at the cost of not being able to jump to page 37. Our feed only scrolls forward, so I'd use cursors."</p></div>
  <p>Ready? Start with how a single request travels from a browser to a database and back.</p>
