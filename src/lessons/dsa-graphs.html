  <h1>Graphs: BFS, DFS and topological sort</h1>
  <p class="lede">After this lesson you will spot a graph hiding inside a problem (friend groups, a grid map, prerequisites), store it as an adjacency list, and walk it with the right tool: DFS to explore and count groups, BFS for the fewest steps, and topological sort for &quot;what order can I do these in?&quot;. All three run in O(V + E), and you will know what that means and how to say it.</p>

  <h2>1. The trigger: when is it a graph?</h2>
  <p>A <b>graph</b> is just <b>things</b> and <b>connections between things</b>. The things are called <b>nodes</b> (or vertices). The connections are called <b>edges</b>. That&#39;s it. If a problem talks about items that link to other items, you have a graph, even if the word &quot;graph&quot; never appears.</p>
  <p>Our running example for the whole lesson is <b>Lincoln Middle School</b>, which is full of graphs:</p>
  <ul>
    <li><b>Friendships</b>: students are nodes, &quot;are friends&quot; is an edge. Friendship goes both ways, so the edges are <b>undirected</b>.</li>
    <li><b>The floor plan</b>: a grid of squares, some open hallway, some walls. Each open square is a node, and it has an edge to each open neighbour (up, down, left, right). A grid is a graph in disguise.</li>
    <li><b>The course catalog</b>: &quot;Algebra must come before Geometry&quot;. Courses are nodes, and each prerequisite is a <b>directed</b> edge (an arrow) from Algebra to Geometry.</li>
  </ul>
  <p>Words in a problem statement that should make you think &quot;graph&quot;:</p>
  <table class="tbl">
    <thead><tr><th>You read...</th><th>Think...</th></tr></thead>
    <tbody>
      <tr><td>&quot;connected&quot;, &quot;groups&quot;, &quot;islands&quot;, &quot;regions&quot;, &quot;provinces&quot;, &quot;friend circles&quot;</td><td>Count connected components with DFS (or BFS)</td></tr>
      <tr><td>a 2D grid where you move up/down/left/right</td><td>Grid = graph; each cell has up to 4 neighbours</td></tr>
      <tr><td>&quot;shortest path&quot;, &quot;fewest moves/steps/hops&quot;, &quot;minimum number of transformations&quot; (all moves cost the same)</td><td>BFS</td></tr>
      <tr><td>&quot;prerequisites&quot;, &quot;dependencies&quot;, &quot;must come before&quot;, &quot;build order&quot;, &quot;is there a cycle?&quot;</td><td>Topological sort</td></tr>
      <tr><td>&quot;can you reach X from Y?&quot;, &quot;is there a path?&quot;</td><td>DFS or BFS with a visited set</td></tr>
    </tbody>
  </table>

  <h2>2. Storing a graph: the adjacency list</h2>
  <p>Six students. Friendships: Ana–Ben, Ana–Cam, Ben–Dev, Cam–Dev, Dev–Eli. Fay has no friends listed yet.</p>
  <p>Problems usually hand you the edges as a flat list of pairs: <code>[[&quot;Ana&quot;,&quot;Ben&quot;], [&quot;Ana&quot;,&quot;Cam&quot;], ...]</code>. To answer &quot;who are Dev&#39;s friends?&quot; from that list, you would scan every pair: O(E) per question, where <b>E</b> is the number of edges. Do that inside a loop and you have the slow nested-loop shape from the approach lesson.</p>
  <p>The fix is the #1 speed-up move again: <b>turn it into a hash map</b>. An <b>adjacency list</b> is a map from each node to the list of its neighbours. Building it costs one pass over the edges; after that, &quot;who are Dev&#39;s friends?&quot; is one lookup.</p>

  <pre><code class="lang-js">// In TypeScript you&#39;d type this as Map&lt;string, string[]&gt;.
function buildGraph(nodes, edges) {
  const graph = new Map();
  for (const node of nodes) graph.set(node, []);   // include nodes with no edges (Fay!)
  for (const [a, b] of edges) {
    graph.get(a).push(b);
    graph.get(b).push(a);    // undirected: add both directions. For directed edges, skip this line.
  }
  return graph;
}</code></pre>
  <p>Two letters you&#39;ll see everywhere: <b>V</b> = number of vertices (nodes), <b>E</b> = number of edges. Here V = 6 and E = 5. The adjacency list uses O(V + E) memory.</p>
  <p>For a <b>grid</b> you usually don&#39;t build an adjacency list at all. The neighbours of cell <code>(row, col)</code> are computed on the fly: <code>(row+1, col)</code>, <code>(row-1, col)</code>, <code>(row, col+1)</code>, <code>(row, col-1)</code>, as long as they are inside the grid and not walls.</p>

  <h2>3. The two ways to walk a graph</h2>
  <p>Picture a rumour starting with Ana.</p>
  <ul>
    <li><b>DFS (depth-first search)</b> is one curious student following a single trail as far as it goes: Ana tells Ben, Ben tells Dev, Dev tells Eli; dead end, so back up to Dev and try his other friends. It goes <i>deep</i> first. It uses a <b>stack</b> (or recursion, which is a stack the language keeps for you).</li>
    <li><b>BFS (breadth-first search)</b> is the rumour spreading in waves: first everyone 1 handshake from Ana, then everyone 2 handshakes away, then 3. It goes <i>wide</i> first. It uses a <b>queue</b> (first in, first out).</li>
  </ul>
  <p>Both need one more thing: a <b>visited set</b>. Graphs have loops (Ana → Ben → Dev → Cam → Ana). Without remembering who you&#39;ve already seen, you walk in circles forever.</p>
  <p>Here is BFS from Ana, step by step. Watch the queue: we always take from the front and add to the back.</p>
  <div class="trace">
    <p><b>Trace: BFS from Ana, recording each student&#39;s distance (handshakes)</b></p>
    <ol>
      <li><b>Start.</b> queue = [Ana], visited = {Ana}, dist = {Ana: 0}.</li>
      <li><b>Take Ana</b> (dist 0). Neighbours Ben, Cam are new: add them with dist 1. queue = [Ben, Cam], visited = {Ana, Ben, Cam}.</li>
      <li><b>Take Ben</b> (dist 1). Neighbours: Ana (visited, skip), Dev (new, dist 2). queue = [Cam, Dev].</li>
      <li><b>Take Cam</b> (dist 1). Neighbours: Ana (skip), Dev (<i>already visited</i> when Ben found him, skip). queue = [Dev].</li>
      <li><b>Take Dev</b> (dist 2). Neighbours: Ben, Cam (skip), Eli (new, dist 3). queue = [Eli].</li>
      <li><b>Take Eli</b> (dist 3). Neighbour Dev is visited. queue = []. Done.</li>
      <li><b>Result:</b> dist = {Ana: 0, Ben: 1, Cam: 1, Dev: 2, Eli: 3}. Fay never appears: she is not reachable from Ana.</li>
    </ol>
  </div>
  <p>Notice step 4: Dev was marked visited the moment he was <i>added</i> to the queue (step 3), so Cam didn&#39;t add him a second time. That small detail keeps BFS at O(V + E).</p>
  <p><b>Why BFS gives shortest paths.</b> The queue holds everyone at distance 1 before anyone at distance 2, and everyone at distance 2 before anyone at distance 3. So the first time BFS reaches a node, it has used the fewest possible edges. DFS has no such guarantee: it might reach Dev via a long detour first.</p>
  <p><b>Why it&#39;s O(V + E).</b> Every node goes into the queue at most once (V), and for each node we look at each of its edges once (E in total, 2E for undirected, which is still O(E)). For the grid version, V = rows × cols and each cell has at most 4 edges, so it&#39;s O(rows × cols).</p>

  <h2>4. The templates</h2>
  <p>Learn these two shapes. Almost every graph problem at the easy/medium level is one of them with a small twist.</p>
  <pre><code class="lang-js">// BFS template: fewest steps from start. (In TypeScript, add types: Map&lt;string, string[]&gt; etc.)
function bfs(graph, start) {
  const dist = new Map([[start, 0]]);     // doubles as the visited set
  const queue = [start];
  let head = 0;                           // read position; avoids queue.shift(), which is O(n)
  while (head &lt; queue.length) {
    const node = queue[head];
    head += 1;
    for (const next of graph.get(node)) {
      if (dist.has(next)) continue;       // already seen
      dist.set(next, dist.get(node) + 1); // mark visited WHEN ENQUEUING
      queue.push(next);
    }
  }
  return dist;
}

// DFS template: visit everything reachable from start (recursive version).
function dfs(graph, node, visited) {
  visited.add(node);
  for (const next of graph.get(node)) {
    if (!visited.has(next)) dfs(graph, next, visited);
  }
}</code></pre>
  <p>Recursion is the shortest way to write DFS, but each call uses a frame on the JavaScript call stack, and very deep recursion (a long snake through a 300×300 grid could be 90,000 deep) can overflow it. Browsers allow roughly ten thousand frames, give or take a lot. If the input can be big, use an explicit stack: same loop as BFS, but <code>stack.pop()</code> instead of reading from the front.</p>

  <h2>5. Worked problem: count the friend groups</h2>
  <p><b>Problem.</b> Given the students and friendships, how many separate friend groups are there? (Same problem as &quot;number of provinces&quot; and, on a grid, &quot;number of islands&quot;.) In our school: {Ana, Ben, Cam, Dev, Eli} and {Fay}, so 2.</p>
  <p><b>Brute force.</b> Give every student their own group label. Then repeat: scan all edges, and for each edge whose two ends have different labels, relabel one whole group to match the other (scanning all students to find them). Keep going until a full pass changes nothing. Each relabel scans V students, and you can need about V of them, each found by scanning E edges. That&#39;s roughly O(V × (V + E)): for 10,000 students and 50,000 friendships, about 600 million steps. The repeated work: <b>we keep rediscovering the same connections</b>.</p>
  <p><b>With the pattern.</b> Loop over students. When you find one not yet visited, that is a new group: add 1, then DFS from them to mark their whole group visited. Every later member of that group is skipped instantly.</p>
  <pre><code class="lang-js">function countGroups(nodes, edges) {
  const graph = buildGraph(nodes, edges);
  const visited = new Set();
  let groups = 0;
  for (const student of nodes) {
    if (visited.has(student)) continue;
    groups += 1;                      // first member of a group we haven&#39;t seen
    dfs(graph, student, visited);     // mark the whole group
  }
  return groups;
}
// countGroups([&quot;Ana&quot;,&quot;Ben&quot;,&quot;Cam&quot;,&quot;Dev&quot;,&quot;Eli&quot;,&quot;Fay&quot;], friendships) → 2</code></pre>
  <p>Each student is visited once and each edge is looked at once: <b>O(V + E)</b>. For 10,000 students and 50,000 friendships, that&#39;s around 60,000 steps instead of 600 million. What removed the repeated work: the <b>visited set</b> means each node is processed exactly once.</p>
  <p>On a grid this is <b>Number of Islands</b>: scan every cell; when you find unvisited land, count it and flood-fill its neighbours. You&#39;ll build it in the first lab below.</p>

  <p><b>Brute force.</b> DFS every possible route (never revisiting a square on the current route) and keep the shortest. The number of simple routes through a grid explodes: on an open 6×6 grid there are already over a million. The repeated work: <b>every route re-walks the same squares</b>, and we compare full routes instead of reusing &quot;I already know the fastest way to this square&quot;.</p>
  <p><b>With the pattern.</b> BFS from the door. Each square is reached first by its shortest route, gets its distance, and is never processed again. <b>O(rows × cols)</b> time and space. On a 100×100 floor that is at most 10,000 squares, each looked at once.</p>
  <p>You&#39;ll write it in the second lab. The only difference from the friend-graph BFS is how you find neighbours: four directions, with a bounds check and a wall check.</p>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Marking a node visited when you <b>take it out</b> of the queue instead of when you <b>put it in</b>. It still gives the right answer, but the same square can be added to the queue several times (once by each neighbour that sees it before it is processed). On a big open grid that multiplies the work. Mark on enqueue. The other classic: forgetting the bounds check (<code>row &lt; 0 || row &gt;= rows</code>), which in JS quietly reads <code>undefined</code> instead of crashing, so the bug hides.</p></div>

  <h2>7. Worked problem: what order can I take these courses?</h2>
  <p><b>Problem.</b> Lincoln&#39;s math track has 5 courses, numbered to keep it short: 0 = Pre-Algebra, 1 = Algebra, 2 = Statistics, 3 = Geometry, 4 = Calculus. Prerequisites as <code>[course, mustComeFirst]</code>: <code>[1,0], [2,0], [3,1], [4,1], [4,3]</code>. Give any valid order, or say it&#39;s impossible.</p>
  <p>This is a <b>directed graph</b>: an arrow from each prerequisite to the course it unlocks. A valid order where every arrow points forward is called a <b>topological sort</b>. It exists exactly when there is no <b>cycle</b> (A needs B, B needs C, C needs A: nobody can start).</p>
  <p><b>Brute force.</b> Repeat: scan all courses and find one whose prerequisites are all done (checking each by scanning the prerequisite list); take it. Each round scans everything, and there are V rounds: O(V × (V + E)). The repeated work: <b>re-checking the same prerequisites every round</b>.</p>
  <p><b>With the pattern (Kahn&#39;s algorithm).</b> Keep a counter per course: how many prerequisites it is still waiting on (its <b>in-degree</b>). Courses at 0 go into a queue. When you take a course, decrement the counter of every course it unlocks; any that hit 0 join the queue.</p>
  <div class="trace">
    <p><b>Trace: Kahn&#39;s algorithm on the math track</b></p>
    <ol>
      <li><b>Build.</b> unlocks: 0 → [1, 2], 1 → [3, 4], 3 → [4]. waiting = [0, 1, 1, 1, 2] (Calculus waits on Algebra and Geometry).</li>
      <li><b>Start.</b> Only course 0 waits on nothing. queue = [0].</li>
      <li><b>Take 0.</b> order = [0]. Unlock 1 (waiting 1→0, enqueue) and 2 (1→0, enqueue). queue = [1, 2].</li>
      <li><b>Take 1.</b> order = [0, 1]. Unlock 3 (1→0, enqueue) and 4 (2→1, not yet). queue = [2, 3].</li>
      <li><b>Take 2.</b> order = [0, 1, 2]. Unlocks nothing. queue = [3].</li>
      <li><b>Take 3.</b> order = [0, 1, 2, 3]. Unlock 4 (1→0, enqueue). queue = [4].</li>
      <li><b>Take 4.</b> order = [0, 1, 2, 3, 4]. All 5 taken, so it&#39;s valid.</li>
      <li><b>With a cycle</b>, add <code>[1, 4]</code> (Algebra needs Calculus). Now 1 waits on 0 and 4, 4 waits on 1 and 3. After taking 0 and 2 the queue empties with only 2 of 5 taken. Leftovers mean a cycle: return <code>[]</code>.</li>
    </ol>
  </div>
  <pre><code class="lang-js">function findOrder(numCourses, prerequisites) {
  const unlocks = Array.from({ length: numCourses }, () =&gt; []);
  const waiting = new Array(numCourses).fill(0);         // in-degree
  for (const [course, first] of prerequisites) {
    unlocks[first].push(course);
    waiting[course] += 1;
  }
  const queue = [];
  for (let c = 0; c &lt; numCourses; c++) if (waiting[c] === 0) queue.push(c);
  const order = [];
  let head = 0;
  while (head &lt; queue.length) {
    const course = queue[head];
    head += 1;
    order.push(course);
    for (const next of unlocks[course]) {
      waiting[next] -= 1;
      if (waiting[next] === 0) queue.push(next);
    }
  }
  return order.length === numCourses ? order : [];       // fewer means a cycle
}</code></pre>
  <p><b>O(V + E)</b> time and space: each course is queued once, each prerequisite edge decremented once. What removed the repeated work: <b>counters remember progress</b> so nothing is re-checked. You&#39;ll build this in the third lab. (There is also a DFS-based topological sort that uses three colours: unvisited, in progress, done. Kahn&#39;s is easier to explain out loud and detects cycles for free.)</p>

  <h2>8. DFS or BFS? A quick decision table</h2>
  <table class="tbl">
    <thead><tr><th>Question</th><th>Use</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td>Fewest steps / shortest path, every step costs the same</td><td>BFS</td><td>Visits in order of distance; first arrival is shortest</td></tr>
      <tr><td>Count groups / islands, flood fill, &quot;is it reachable?&quot;</td><td>Either (DFS is shorter to write)</td><td>You only need to touch everything once</td></tr>
      <tr><td>Order with dependencies, detect a cycle in a directed graph</td><td>Topological sort (Kahn&#39;s, BFS-style)</td><td>In-degree counters tell you what is ready</td></tr>
      <tr><td>Shortest path where edges have different weights (travel times)</td><td>Dijkstra (BFS with a min-heap)</td><td>Beyond most easy/mediums; know the name</td></tr>
      <tr><td>Explore all paths / all arrangements</td><td>Backtracking (next lesson)</td><td>Need every option, not just reachability</td></tr>
    </tbody>
  </table>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Forgetting nodes with no edges. If you build the adjacency list only from the edge list, Fay never appears in it, so &quot;count the groups&quot; returns 1 instead of 2. Seed the map with every node first. The directed-graph version of this mistake: adding both directions for a prerequisite edge, which turns every prerequisite into a fake 2-node cycle.</p></div>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>&quot;This is a graph problem: the cells are nodes and adjacent open cells are edges. Since every move costs the same, I&#39;ll use BFS from the start with a visited set, marking cells when I enqueue them, and the first time I reach the target is the shortest distance. Each cell is processed once, so it&#39;s O(rows times cols) time and space.&quot; For dependencies: &quot;Prerequisites form a directed graph, so I&#39;ll do a topological sort with in-degree counts; if I can&#39;t take every course, there&#39;s a cycle.&quot;</p></div>

  <p>Three classics, in order of difficulty: count groups on a grid (DFS), fewest moves on a grid (BFS), and an order with dependencies (topological sort).</p>

  <h2>Recap</h2>
  <ul>
    <li>A graph is nodes plus edges. Friend lists, grids, and prerequisites are all graphs, even when the problem never says &quot;graph&quot;.</li>
    <li>Store it as an adjacency list (<code>Map</code> from node to neighbours), seeded with every node. On a grid, compute the 4 neighbours on the fly with a bounds check.</li>
    <li>Always keep a visited set, and mark nodes when you add them to the queue or stack.</li>
    <li>DFS (stack/recursion) to explore and count connected groups; BFS (queue) for fewest steps when every step costs the same.</li>
    <li>Dependencies or &quot;must come before&quot; means topological sort: in-degree counters plus a queue; leftovers mean a cycle.</li>
    <li>All three run in O(V + E) (O(rows × cols) on a grid), because each node and edge is handled once.</li>
  </ul>
