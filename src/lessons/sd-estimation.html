  <h1>Estimation drill</h1>
  <p class="lede">Back-of-envelope estimation is a skill you build with reps, not by reading. This lesson gives you the dozen numbers worth memorizing, a four-line method you can run on any prompt in about three minutes, and then 15 graded drills, from a URL shortener to the token bill of an LLM chat product. Answers within 3× count as right, because the interview cares about the order of magnitude and, above all, about what the number makes you decide.</p>

  <h2>1. The numbers to memorize</h2>
  <p>You need very few facts. Almost every estimate is &quot;some users do some things some number of times a day&quot;, converted to per second, multiplied by a size. These are the conversions and sizes that make that fast. Capacities are rough ranges that vary 10× with hardware and workload; say the assumption out loud when you use one.</p>
  <table class="tbl">
    <thead><tr><th>Fact</th><th>Use it as</th></tr></thead>
    <tbody>
      <tr><td>Seconds in a day</td><td><b>≈ 100,000</b> (really 86,400). Dividing by 10<sup>5</sup> is just moving the decimal point.</td></tr>
      <tr><td>1 million per day</td><td><b>≈ 12 per second</b> (10 if you divide by 100,000; both are fine)</td></tr>
      <tr><td>100 million per day</td><td>≈ 1,200 per second</td></tr>
      <tr><td>1 billion per day</td><td>≈ 12,000 per second</td></tr>
      <tr><td>Peak vs average</td><td><b>2–3×</b> for normal daily curves; <b>5–10×</b> (or more) for bursty events: school bells, ticket on-sales, breaking news</td></tr>
      <tr><td>Text row / message / post with metadata</td><td>~1 KB</td></tr>
      <tr><td>Photo (compressed)</td><td>~200 KB – 1 MB (phone originals are a few MB)</td></tr>
      <tr><td>1 minute of HD video</td><td>~50–100 MB</td></tr>
      <tr><td>Unit ladder</td><td>KB → MB → GB → TB → PB, each step <b>×1,000</b></td></tr>
      <tr><td>One app server</td><td>~1,000s of requests/s doing real work</td></tr>
      <tr><td>One Postgres primary</td><td>~5,000–10,000 simple queries/s (more for cached reads, fewer for heavy writes)</td></tr>
      <tr><td>One Redis node</td><td>~100,000 simple ops/s</td></tr>
      <tr><td>One SSD</td><td>a few TB; one big database server holds single-digit to tens of TB comfortably</td></tr>
    </tbody>
  </table>
  <p>Two shortcuts make the arithmetic painless. <b>Per day to per second:</b> drop five zeros (400,000,000/day → 4,000/s). <b>Count × size:</b> multiply the leading digits and add the units on the ladder (50 million × 1 MB = 50 million MB = 50 TB, because million × MB = TB).</p>

  <h2>2. The four-line method</h2>
  <p>Every estimate in an interview fits in four lines on the whiteboard. The first three are arithmetic. The fourth is the one that gets scored.</p>

  <ol>
    <li><b>Users → actions per day.</b> Start from daily active users (DAU) and how many times each one does the thing.</li>
    <li><b>Per second, then peak.</b> Divide by 100,000; multiply by the peak factor. The peak is what you size for.</li>
    <li><b>Storage.</b> Writes per day × size of each × how long you keep it. Convert per day to per year (× 365, call it × 400 if you like round numbers).</li>
    <li><b>So what?</b> Name the design decision the numbers force: &quot;that is too many writes for one database, so I&#39;ll partition&quot;, or &quot;that fits on one Redis node, so I won&#39;t shard&quot;.</li>
  </ol>

  <h3>Worked example: a chat app</h3>
  <div class="trace">
    <b>Chat app, 10M DAU</b>
    <ol>
      <li><b>Assume out loud:</b> &quot;I&#39;ll assume 10 million DAU, each sending 40 messages a day, about 1 KB per message with metadata, and a 3× peak.&quot;</li>
      <li><b>Per day:</b> 10M × 40 = <b>400M messages/day</b>.</li>
      <li><b>Per second:</b> 400M ÷ 100,000 = <b>~4,000 writes/s</b> on average; × 3 = <b>~12,000 writes/s</b> at peak.</li>
      <li><b>So what (writes):</b> 12,000 writes/s is more than one Postgres primary handles comfortably, so messages go in a <b>partitioned, write-friendly store</b> (sharded by conversation id; Cassandra-style wide-column stores are built for this shape).</li>
      <li><b>Storage:</b> 400M × 1 KB = <b>400 GB/day</b>; × 365 ≈ <b>150 TB/year</b>. So what: no single machine holds that, so <b>shard</b>, and move messages older than a few months to <b>cheaper tiered storage</b> since almost nobody scrolls back that far.</li>
      <li><b>Reads:</b> people read more than they write, say ~5× (scrolling, opening conversations): ~20,000 reads/s average, ~60,000 at peak. So what: <b>cache</b> recent messages per conversation so most reads never touch the store.</li>
    </ol>
  </div>
  <p>Notice that every number led to a sentence that starts with &quot;so&quot;. That is the whole skill.</p>

  <h2>3. Five tricks that make it fast and safe</h2>
  <ul>
    <li><b>Round aggressively, and say so.</b> &quot;86,400 seconds, call it 100,000.&quot; &quot;365 days, call it 400.&quot; One significant figure is enough. Saying you rounded shows it was a choice, not a mistake.</li>
    <li><b>Write it down.</b> Put each line on the board as you go. The interviewer can follow, you won&#39;t lose a factor of 1,000 in your head, and you can point back at it later (&quot;remember, 12,000 writes/s, that&#39;s why I sharded&quot;).</li>
    <li><b>Only estimate what changes the design.</b> If bandwidth is obviously trivial, say &quot;bandwidth is small here, I&#39;ll skip it&quot; and move on. Three minutes, not ten.</li>
    <li><b>Sanity-check against one machine.</b> Compare each number with what one box does: one app server (~1,000s req/s), one Postgres (~5–10k queries/s), one Redis (~100k ops/s), one disk (a few TB). The comparison <i>is</i> line 4.</li>
    <li><b>State the assumption first.</b> &quot;I&#39;ll assume 10M DAU.&quot; If the interviewer has a different number in mind, they&#39;ll correct you now rather than after five minutes of math.</li>
  </ul>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>&quot;Let me size this quickly. I&#39;ll assume 10 million daily users sending 40 messages each: 400 million a day, which is about 4,000 writes a second, 12,000 at peak. That&#39;s more than one Postgres primary wants, so I&#39;ll plan to partition the message store. Storage is about 400 GB a day, 150 TB a year, so it&#39;s sharded with old data tiered off. Reads are maybe 5× writes, so recent messages get cached. Good enough to design against; I&#39;ll revisit if the numbers change.&quot;</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Doing careful arithmetic and then never using it. &quot;So that&#39;s 4,630 writes per second&quot; followed by drawing the same diagram you would have drawn anyway scores almost nothing. The opposite mistake is just as common: false precision (86,400, 4,629.6) that burns minutes. Round, finish in three minutes, and end every number with the decision it forces.</p></div>

  <h2>4. The drills</h2>
  <p>Fifteen scenarios, easiest first. Each gives you the assumptions, so the math is gradable. For each one: write the numbers in the boxes (shorthand like <code>4k</code>, <code>1.2M</code>, <code>3B</code> or <code>400GB</code> works), then write line 4 in your own words <i>before</i> you check. A box turns green if you are within 3× of the model answer. Use 1 day = 100,000 s, as the worked answers do.</p>
  <p>Do three or four a day rather than all fifteen at once. Coming back to a drill a week later and getting it right without the worked answer is the real test.</p>
  <div data-estimate-progress></div>
  <div data-estimate='{"title":"URL shortener redirects","level":"Warm-up","prompt":"<p>A public URL shortener. Assume <b>500 million redirects per day</b> and <b>5 million new short links per day</b>. Each link row (short code, long URL, owner, timestamps) is about <b>500 bytes</b>. Peak traffic is <b>3×</b> the average. Links are kept for <b>5 years</b>.</p>","fields":[{"key":"avgQps","label":"Average redirects per second","unit":"/s","answer":5000},{"key":"peakQps","label":"Peak redirects per second (3×)","unit":"/s","answer":15000},{"key":"storageDay","label":"New link storage per day","unit":"GB","answer":2.5},{"key":"storage5y","label":"Total link storage after 5 years","unit":"TB","answer":4.6}],"soWhat":"<p><b>Read-heavy, small data.</b> 5,000 redirects/s against about 50 link creations/s is a 100:1 read:write ratio, so the design is about serving reads fast: put a cache (Redis) in front of the store. 15,000 reads/s at peak is a handful of app servers and well under one Redis node.</p><p><b>Storage is modest.</b> 4.6 TB after 5 years fits a single big Postgres, but a key-value store partitioned by short code (DynamoDB, Cassandra) is the simplest home because every lookup is by one key.</p><p><b>Key length falls out too:</b> 5M/day × 1,825 days ≈ 9 billion links, so 7 base62 characters (62<sup>7</sup> ≈ 3.5 trillion) is plenty.</p>","worked":"<p><b>1. Per day:</b> 500M redirects, 5M new links (given).</p><p><b>2. Per second:</b> 500M ÷ 100,000 = <b>5,000/s</b> average (exact: 5,790). Peak 3× = <b>15,000/s</b>. Writes: 5M ÷ 100,000 = 50/s.</p><p><b>3. Storage:</b> 5M × 500 B = 2,500 MB = <b>2.5 GB/day</b>. × 365 ≈ 900 GB/year. × 5 years ≈ 4,560 GB ≈ <b>4.6 TB</b>.</p><p><b>4. So what:</b> reads dominate, cache them; the data is small enough that the store choice is about access pattern (lookup by key), not size.</p>"}'></div>
  <div data-estimate='{"title":"Game leaderboard updates","level":"Warm-up","prompt":"<p>A mobile game with a global leaderboard. Assume <b>10 million DAU</b>, each playing <b>20 matches a day</b>; every match end updates the player&#39;s score once. Evenings and events make the peak <b>5×</b> average. Each player opens the leaderboard <b>10 times a day</b>. <b>50 million</b> players are ranked in total, and each entry in a Redis sorted set costs about <b>100 bytes</b>.</p>","fields":[{"key":"avgWrites","label":"Average score updates per second","unit":"/s","answer":2000},{"key":"peakWrites","label":"Peak score updates per second (5×)","unit":"/s","answer":10000},{"key":"avgReads","label":"Average leaderboard reads per second","unit":"/s","answer":1000},{"key":"memory","label":"Memory for the whole ranked set","unit":"GB","answer":5}],"soWhat":"<p><b>This is a one-box problem, and saying so scores.</b> Peak load is about 10,000 updates/s plus 5,000 reads/s = 15,000 ops/s, and one Redis node does roughly 100,000 simple ops/s. 5 GB fits comfortably in RAM.</p><p>So: one Redis sorted set (<code>ZINCRBY</code> to update, <code>ZREVRANK</code> for &amp;quot;your rank&amp;quot;, <code>ZREVRANGE</code> for the top 100), a replica for failover, and scores also written to the main database as the source of truth so the sorted set can be rebuilt. No sharding until you have 10× the players or need many separate boards.</p>","worked":"<p><b>1. Per day:</b> 10M × 20 = 200M score updates. 10M × 10 = 100M leaderboard reads.</p><p><b>2. Per second:</b> 200M ÷ 100,000 = <b>2,000/s</b> average; peak 5× = <b>10,000/s</b>. Reads: 100M ÷ 100,000 = <b>1,000/s</b> (5,000/s at peak).</p><p><b>3. Memory:</b> 50M × 100 B = 5,000 MB = <b>5 GB</b>.</p><p><b>4. So what:</b> about 15,000 ops/s at peak and 5 GB: one Redis node with a replica. Don&#39;t shard what fits.</p>"}'></div>
  <div data-estimate='{"title":"Slack messages","level":"Core","prompt":"<p>A team chat product. Assume <b>10 million DAU</b>, each sending <b>20 messages a day</b>. A stored message with metadata is about <b>1 KB</b>. Peak is <b>3×</b> average. Each message is pushed to about <b>10 channel members who are online</b> at that moment.</p>","fields":[{"key":"perDay","label":"Messages per day","unit":"messages","answer":200000000.0},{"key":"avgQps","label":"Average message writes per second","unit":"/s","answer":2000},{"key":"peakQps","label":"Peak message writes per second (3×)","unit":"/s","answer":6000},{"key":"peakDeliveries","label":"Peak deliveries (pushes) per second","unit":"/s","answer":60000},{"key":"storageDay","label":"New message storage per day","unit":"GB","answer":200}],"soWhat":"<p><b>Writes:</b> 6,000 writes/s at peak is at the upper edge of what one Postgres primary handles comfortably, and it only grows. Partition messages by workspace or channel so each shard takes a slice of the writes and a channel&#39;s history stays together for ordered reads.</p><p><b>Fan-out:</b> 60,000 pushes/s go out over long-lived WebSocket connections, so you need a fleet of connection (gateway) servers plus a pub/sub layer that routes each message to the gateways holding that channel&#39;s members.</p><p><b>Storage:</b> 200 GB/day ≈ 73 TB/year: sharded storage, with old messages tiered to cheaper storage and search in a separate index.</p>","worked":"<p><b>1. Per day:</b> 10M × 20 = <b>200M messages/day</b>.</p><p><b>2. Per second:</b> 200M ÷ 100,000 = <b>2,000/s</b>; peak 3× = <b>6,000/s</b>. Each reaches 10 online members: 6,000 × 10 = <b>60,000 deliveries/s</b> at peak.</p><p><b>3. Storage:</b> 200M × 1 KB = <b>200 GB/day</b>, × 365 ≈ 73 TB/year.</p><p><b>4. So what:</b> shard the message store by workspace/channel; a gateway fleet + pub/sub for delivery; tier old data.</p>"}'></div>
  <div data-estimate='{"title":"Instagram photo uploads","level":"Core","prompt":"<p>A photo-sharing app. Assume <b>500 million DAU</b>. <b>1 in 10</b> users posts <b>one photo a day</b>. Each upload stores about <b>1 MB</b> in total (compressed original plus resized versions). Each DAU views <b>100 photos a day</b>.</p>","fields":[{"key":"uploadsDay","label":"Uploads per day","unit":"uploads","answer":50000000.0},{"key":"uploadsQps","label":"Average uploads per second","unit":"/s","answer":500},{"key":"viewsQps","label":"Average photo views per second","unit":"/s","answer":500000},{"key":"storageDay","label":"New photo storage per day","unit":"TB","answer":50},{"key":"storageYear","label":"New photo storage per year","unit":"PB","answer":18}],"soWhat":"<p><b>Uploads are not the hard part</b> (500/s, 1,500 at peak). Bytes and reads are.</p><p><b>18 PB a year</b> means object storage (S3-style), never the database. Clients upload straight to it with presigned URLs so app servers never carry the bytes.</p><p><b>500,000 views/s</b> (1,000:1 read:write) means a CDN serves the images, and feeds are precomputed and cached. The metadata is small by comparison (50M × ~1 KB = 50 GB/day) and lives in a database sharded by user id.</p>","worked":"<p><b>1. Per day:</b> 500M ÷ 10 = <b>50M uploads/day</b>; 500M × 100 = 50B views/day.</p><p><b>2. Per second:</b> 50M ÷ 100,000 = <b>500/s</b> uploads. 50B ÷ 100,000 = <b>500,000/s</b> views.</p><p><b>3. Storage:</b> 50M × 1 MB = 50M MB = <b>50 TB/day</b>. × 365 = 18,250 TB ≈ <b>18 PB/year</b>.</p><p><b>4. So what:</b> object storage + presigned uploads + CDN; the database only holds metadata.</p>"}'></div>
  <div data-estimate='{"title":"K-12 reading app: the 8:05am spike","level":"Core","prompt":"<p>A reading app used by <b>800,000 students</b> in one time zone. On a school day <b>70%</b> of them use it. <b>Half of those</b> log in within the same <b>2 minutes</b> around 8:05am when first period starts. Each login costs about <b>10 API requests</b> (SSO handshake + loading the home screen). Across the whole day, each active student makes about <b>200 requests</b>.</p>","fields":[{"key":"spikeLogins","label":"Logins per second during the spike","unit":"/s","answer":2300},{"key":"spikeQps","label":"API requests per second during the spike","unit":"/s","answer":23000},{"key":"avgQps","label":"Average API requests per second over the day","unit":"/s","answer":1100},{"key":"ratio","label":"Spike ÷ daily average","unit":"×","answer":20}],"soWhat":"<p><b>Size for the spike, not the average:</b> it is about 20× the daily average, so an average-sized fleet falls over at 8:05 every morning.</p><p><b>Reactive autoscaling is too slow:</b> new servers take minutes and the spike is over in two. Pre-scale on a schedule (7:45 on school days) to handle ~23,000 req/s with headroom.</p><p><b>Make each login cheap:</b> cache rosters and the home-screen payload, issue a session after SSO so later requests don&#39;t repeat the handshake, serve the app shell from a CDN, push non-essential writes (analytics) to a queue, and make clients retry with backoff and jitter so failures don&#39;t snowball. Load test at 2× the spike before back-to-school.</p>","worked":"<p><b>1. Who:</b> 800,000 × 70% = 560,000 active students; half = 280,000 log in within 120 s.</p><p><b>2. Spike rate:</b> 280,000 ÷ 120 ≈ <b>2,300 logins/s</b>. × 10 requests = <b>23,000 req/s</b>.</p><p><b>Daily average:</b> 560,000 × 200 = 112M requests/day ÷ 100,000 ≈ <b>1,100 req/s</b>.</p><p><b>Ratio:</b> 23,000 ÷ 1,100 ≈ <b>20×</b>.</p><p><b>4. So what:</b> scheduled pre-scaling, caching and cheap sessions; the average number would have sized the system wrong by 20×.</p>"}'></div>
  <div data-estimate='{"title":"Twitter home timeline","level":"Core","prompt":"<p>A Twitter-like home timeline using <b>fan-out on write</b> (each new tweet&#39;s id is pushed into every follower&#39;s cached timeline). Assume <b>200 million DAU</b>, each loading their timeline <b>10 times a day</b>. <b>1 in 2</b> users tweets once a day. The average account has <b>200 followers</b>. Peak is <b>3×</b>. The cache keeps the latest <b>800 tweet ids</b> (8 bytes each) per DAU.</p>","fields":[{"key":"readsAvg","label":"Average timeline reads per second","unit":"/s","answer":20000},{"key":"readsPeak","label":"Peak timeline reads per second (3×)","unit":"/s","answer":60000},{"key":"tweetsQps","label":"Average new tweets per second","unit":"/s","answer":1000},{"key":"fanout","label":"Average fan-out inserts per second","unit":"/s","answer":200000},{"key":"cacheTB","label":"Memory for all cached timelines","unit":"TB","answer":1.3}],"soWhat":"<p><b>Reads win, so precompute:</b> 60,000 timeline loads/s at peak can&#39;t each run a join over everyone you follow, so timelines are prebuilt in a cache and a read is one lookup.</p><p><b>The cost moves to writes:</b> 1,000 tweets/s becomes 200,000 cache inserts/s. Fine for a Redis cluster, and 1.3 TB of timelines means a cluster of a few dozen nodes sharded by user id (only active users are cached).</p><p><b>The number that breaks it:</b> a celebrity with 50M followers turns one tweet into 50M inserts. Use a hybrid: fan-out on write for normal accounts, merge celebrity tweets in at read time.</p>","worked":"<p><b>1. Per day:</b> 200M × 10 = 2B timeline reads; 200M ÷ 2 = 100M tweets; 100M × 200 = 20B fan-out inserts.</p><p><b>2. Per second:</b> 2B ÷ 100,000 = <b>20,000/s</b> reads, peak <b>60,000/s</b>. 100M ÷ 100,000 = <b>1,000/s</b> tweets. 20B ÷ 100,000 = <b>200,000/s</b> inserts.</p><p><b>3. Memory:</b> 200M × 800 × 8 B = 1,280 GB ≈ <b>1.3 TB</b>.</p><p><b>4. So what:</b> precomputed timelines in a sharded cache; hybrid fan-out for celebrities.</p>"}'></div>
  <div data-estimate='{"title":"Uber driver location pings","level":"Stretch","prompt":"<p>A ride-hailing app. At peak <b>2 million drivers</b> are online, each sending its location <b>every 4 seconds</b>. A ping is about <b>200 bytes on the wire</b> and <b>100 bytes</b> if stored. Averaged over the day, <b>1 million drivers</b> are online.</p>","fields":[{"key":"peakPings","label":"Peak location pings per second","unit":"/s","answer":500000},{"key":"ingressMB","label":"Peak inbound bandwidth","unit":"MB/s","answer":100},{"key":"pingsDay","label":"Pings per day","unit":"pings","answer":25000000000.0},{"key":"storageDay","label":"Raw storage per day if you keep every ping","unit":"TB","answer":2.5}],"soWhat":"<p><b>Don&#39;t write each ping to a database.</b> 500,000 writes/s is about 100× what a relational primary takes. The matching service only needs each driver&#39;s <i>latest</i> position, so keep it in memory: an in-memory geo index (Redis GEO or a custom grid) sharded by city or geohash cell. At ~100,000 ops/s per node that is roughly 5–10 nodes.</p><p><b>History is a separate, cheap path:</b> stream raw pings through Kafka to object storage (2.5 TB/day ≈ 900 TB/year) for trip receipts and ETA models.</p><p><b>Connections:</b> 100 MB/s (under 1 Gbps) is easy across a gateway fleet, but use long-lived connections so 500,000 pings/s don&#39;t each pay a TLS handshake.</p>","worked":"<p><b>1. Peak rate:</b> 2M drivers ÷ 4 s = <b>500,000 pings/s</b>.</p><p><b>2. Bandwidth:</b> 500,000 × 200 B = 100,000,000 B/s = <b>100 MB/s</b> (≈ 0.8 Gbps).</p><p><b>3. Per day:</b> 1M ÷ 4 = 250,000 pings/s average × 100,000 s = <b>25B pings/day</b>. × 100 B = <b>2.5 TB/day</b>.</p><p><b>4. So what:</b> latest location in a sharded in-memory geo index; raw history to a stream and object storage.</p>"}'></div>
  <div data-estimate='{"title":"Breaking-news push fan-out","level":"Stretch","prompt":"<p>A news app sends a breaking-news push to <b>50 million subscribers</b>, and it must reach all of them within <b>5 minutes</b>. One sender worker can make about <b>1,000 sends per second</b> to the push providers (APNs/FCM). Each send writes a <b>200-byte</b> log row. The job is split into chunks of <b>1,000 users</b>.</p>","fields":[{"key":"sendRate","label":"Sends per second needed","unit":"/s","answer":170000},{"key":"workers","label":"Sender workers needed","unit":"workers","answer":170},{"key":"chunks","label":"Chunk jobs per alert","unit":"jobs","answer":50000},{"key":"logGB","label":"Log data per alert","unit":"GB","answer":10}],"soWhat":"<p><b>This is a burst, not steady traffic.</b> 170,000 sends/s for 5 minutes, then near zero. Enqueue 50,000 chunk jobs and let a horizontally scaled worker pool drain them: about 170 workers at full speed, so provision ~2× for headroom or accept a slower tail.</p><p><b>Feed the workers cheaply:</b> read device tokens as a pre-built audience segment (a sequential scan), not 50M point lookups.</p><p><b>Be a good client and be idempotent:</b> respect APNs/FCM rate limits with backoff, and dedupe on <code>(alert_id, user_id)</code> so a retried chunk never double-notifies. Batch the 10 GB of logs into a write-optimized store, not row-by-row inserts into the primary DB.</p>","worked":"<p><b>1. Rate:</b> 5 minutes = 300 s. 50M ÷ 300 ≈ 166,667 ≈ <b>170,000 sends/s</b>.</p><p><b>2. Workers:</b> 170,000 ÷ 1,000 per worker = <b>170 workers</b>.</p><p><b>3. Jobs and logs:</b> 50M ÷ 1,000 = <b>50,000 chunk jobs</b>. 50M × 200 B = 10,000 MB = <b>10 GB</b> of logs.</p><p><b>4. So what:</b> a queue of chunk jobs, an elastic worker pool, provider-aware rate limiting, and idempotent sends.</p>"}'></div>
  <div data-estimate='{"title":"Ticketmaster flash sale","level":"Stretch","prompt":"<p>A stadium tour goes on sale at 10:00. <b>2 million fans</b> are on the page, each browser refreshing or polling <b>every 2 seconds</b>. There are <b>50,000 seats</b> and they sell out in <b>10 minutes</b>. One app server handles about <b>5,000 req/s</b>. On a normal day this event page gets about <b>200 req/s</b>.</p>","fields":[{"key":"reqRate","label":"Requests per second at 10:00","unit":"/s","answer":1000000.0},{"key":"servers","label":"App servers to serve that directly","unit":"servers","answer":200},{"key":"bookings","label":"Seat bookings per second","unit":"/s","answer":80},{"key":"fansPerSeat","label":"Fans per seat","unit":"fans","answer":40}],"soWhat":"<p><b>The write path is tiny:</b> ~80 bookings/s fits one Postgres with a conditional <code>UPDATE ... WHERE status = &#39;available&#39;</code> (or a hold row with an expiry). Correctness there is about no double booking, not scale.</p><p><b>The read storm is the problem:</b> 1M req/s is 5,000× normal traffic. Don&#39;t build 200 servers for 10 minutes; put a virtual waiting room in front: a static page on the CDN that polls a lightweight token service, admitting a few thousand people per minute into the purchase flow. Serve the seat map from cache with a short TTL, and rate-limit bots per account and IP.</p><p><b>Product honesty:</b> 40 fans per seat means 39 of 40 leave empty-handed, so show queue position early.</p>","worked":"<p><b>1. Reads:</b> 2M fans ÷ 2 s = <b>1,000,000 req/s</b> (1M/s), 5,000× the normal 200/s.</p><p><b>2. Servers:</b> 1,000,000 ÷ 5,000 = <b>200 servers</b>.</p><p><b>3. Writes:</b> 50,000 seats ÷ 600 s ≈ 83 ≈ <b>80 bookings/s</b>.</p><p><b>Demand:</b> 2,000,000 ÷ 50,000 = <b>40 fans</b> per seat.</p><p><b>4. So what:</b> a waiting room absorbs the read storm; a single strongly consistent database handles the bookings.</p>"}'></div>
  <div data-estimate='{"title":"Web crawler","level":"Stretch","prompt":"<p>A search engine re-crawls <b>10 billion pages every 30 days</b>. The average page is <b>100 KB</b>. Each fetch takes about <b>1 second</b> end to end (DNS, connect, download). Stored HTML compresses about <b>5×</b>.</p>","fields":[{"key":"pagesDay","label":"Pages per day","unit":"pages","answer":330000000.0},{"key":"pagesQps","label":"Pages per second","unit":"/s","answer":3300},{"key":"gbps","label":"Download bandwidth","unit":"Gbps","answer":2.7},{"key":"concurrent","label":"Fetches in flight at any moment","unit":"fetches","answer":3300},{"key":"storeTB","label":"Compressed storage per 30-day crawl","unit":"TB","answer":200}],"soWhat":"<p><b>Not a CPU problem, a waiting problem.</b> By Little&#39;s Law (in flight = rate × time each takes) you have about 3,300 fetches open at once, so use async I/O: a few machines with ~1,000 open connections each, not 3,300 threads.</p><p><b>Politeness shapes the design:</b> you must not hit one site 100 times a second, so the URL frontier keeps a queue per host with a per-host delay. Cache DNS. Dedupe URLs with a hash set or Bloom filter (10B × 8-byte hashes ≈ 80 GB).</p><p><b>Bytes:</b> 2.7 Gbps is fine for a small cluster; 200 TB per crawl goes to object storage, keeping the latest version (plus diffs if needed).</p>","worked":"<p><b>1. Per day:</b> 10B ÷ 30 ≈ <b>330M pages/day</b>.</p><p><b>2. Per second:</b> 330M ÷ 100,000 = <b>3,300 pages/s</b>. In flight: 3,300/s × 1 s = <b>3,300 fetches</b>.</p><p><b>Bandwidth:</b> 3,300 × 100 KB = 330 MB/s × 8 bits = <b>2.7 Gbps</b>.</p><p><b>3. Storage:</b> 10B × 100 KB = 1,000 TB (1 PB) raw ÷ 5 = <b>200 TB</b> compressed per crawl.</p><p><b>4. So what:</b> async fetchers, a per-host polite frontier, URL dedupe, compressed object storage.</p>"}'></div>
  <div data-estimate='{"title":"Ad-click aggregation","level":"Stretch","prompt":"<p>An ad network counts clicks per ad per minute for billing and dashboards. Assume <b>1 billion clicks per day</b>, peak <b>5×</b> average. A raw click event is about <b>500 bytes</b>. There are <b>2 million active ads</b>; budget for one aggregate row per ad per minute. Raw events are kept <b>30 days</b> for audits.</p>","fields":[{"key":"avgQps","label":"Average clicks per second","unit":"/s","answer":10000},{"key":"peakQps","label":"Peak clicks per second (5×)","unit":"/s","answer":50000},{"key":"rawGB","label":"Raw click data per day","unit":"GB","answer":500},{"key":"aggRows","label":"Aggregate rows per day","unit":"rows","answer":2900000000.0},{"key":"raw30","label":"Raw data kept for 30 days","unit":"TB","answer":15}],"soWhat":"<p><b>Stream, don&#39;t insert:</b> 50,000 events/s at peak is easy for Kafka (partitioned by ad id) but too many for row-by-row database inserts. A stream processor (Flink, Spark Streaming) counts per ad in 1-minute windows.</p><p><b>Aggregates need an analytics store:</b> 2.9B rows/day (worst case; only ads with clicks emit rows) is about 30,000 rows/s, which belongs in a column store built for this (ClickHouse, Druid, BigQuery), with minute rows rolled up to hours after a week.</p><p><b>Billing correctness:</b> delivery is at-least-once, so dedupe by click id; keep the 15 TB of raw events in object storage so you can replay and reconcile the streaming counts with a nightly batch job.</p>","worked":"<p><b>1. Per second:</b> 1B ÷ 100,000 = <b>10,000/s</b> average; peak 5× = <b>50,000/s</b>.</p><p><b>2. Raw bytes:</b> 1B × 500 B = <b>500 GB/day</b>; × 30 days = <b>15 TB</b>.</p><p><b>3. Aggregates:</b> 2M ads × 1,440 minutes = 2.88B ≈ <b>2.9B rows/day</b>.</p><p><b>4. So what:</b> Kafka + windowed stream aggregation into a column store; raw events kept for replay; dedupe for billing.</p>"}'></div>
  <div data-estimate='{"title":"Metrics ingestion","level":"Stretch","prompt":"<p>An observability platform. <b>50,000 hosts</b> each report <b>500 metrics every 10 seconds</b>. A data point is <b>16 bytes</b> raw (8-byte timestamp + 8-byte value); a time-series database compresses it to about <b>2 bytes</b>.</p>","fields":[{"key":"series","label":"Active time series","unit":"series","answer":25000000.0},{"key":"pointsQps","label":"Data points per second","unit":"/s","answer":2500000.0},{"key":"pointsDay","label":"Data points per day","unit":"points","answer":250000000000.0},{"key":"rawTB","label":"Raw (uncompressed) bytes per day","unit":"TB","answer":4},{"key":"compGB","label":"Compressed bytes per day","unit":"GB","answer":500}],"soWhat":"<p><b>2.5M points/s needs a purpose-built time-series database</b> (Prometheus-style, M3, VictoriaMetrics), sharded by series id, with Kafka in front to absorb bursts.</p><p><b>Compression is the design:</b> delta-of-delta timestamps and XOR-encoded values (the Gorilla technique) turn 4 TB/day into 500 GB/day. Keep 15 days at full resolution (~7.5 TB), then downsample to 1-minute and 1-hour rollups for long-term.</p><p><b>The real limit is cardinality:</b> 25M active series. One careless label like <code>user_id</code> multiplies that by millions, so the platform rejects high-cardinality labels.</p>","worked":"<p><b>1. Series:</b> 50,000 × 500 = <b>25M series</b>.</p><p><b>2. Per second:</b> 25M ÷ 10 s = <b>2.5M points/s</b>. Per day: 2.5M × 100,000 = <b>250B points</b>.</p><p><b>3. Bytes:</b> 250B × 16 B = <b>4 TB/day</b> raw; 250B × 2 B = <b>500 GB/day</b> compressed.</p><p><b>4. So what:</b> a sharded TSDB, compression and downsampling, and a cardinality budget.</p>"}'></div>
  <div data-estimate='{"title":"Dropbox storage growth","level":"Expert","prompt":"<p>A file-sync product. <b>20 million users</b> upload each day, <b>5 new files</b> each, average <b>1 MB</b> per file. The storage layer uses erasure coding with <b>1.5×</b> overhead (raw disk = 1.5 × logical data). Disks are <b>20 TB</b> each.</p>","fields":[{"key":"filesQps","label":"Average file uploads per second","unit":"/s","answer":1000},{"key":"tbDay","label":"New logical data per day","unit":"TB","answer":100},{"key":"pbYear","label":"New logical data per year","unit":"PB","answer":37},{"key":"rawPb","label":"New raw disk per year (1.5×)","unit":"PB","answer":55},{"key":"drives","label":"New 20 TB drives per year","unit":"drives","answer":2700}],"soWhat":"<p><b>The upload rate is easy</b> (1,000/s, ~3,000 at peak). <b>Storage growth drives cost and operations:</b> about 2,700 new drives a year, roughly 7 a day, before replacing failed ones. Hardware has to be ordered months ahead, so capacity planning is a real job.</p><p><b>Decisions it forces:</b> split files into ~4 MB blocks addressed by their content hash, which gives dedupe across users and resumable uploads; erasure coding instead of 3× replication (3× would need ~110 PB and ~5,500 drives a year); tier cold files to cheaper storage; and keep file metadata (the folder tree) in a sharded database separate from the block store.</p>","worked":"<p><b>1. Per day:</b> 20M × 5 = 100M files/day.</p><p><b>2. Per second:</b> 100M ÷ 100,000 = <b>1,000/s</b>.</p><p><b>3. Storage:</b> 100M × 1 MB = <b>100 TB/day</b>. × 365 = 36,500 TB ≈ <b>37 PB/year</b> logical. × 1.5 ≈ <b>55 PB</b> raw. 55,000 TB ÷ 20 TB ≈ <b>2,700 drives</b>.</p><p><b>4. So what:</b> content-addressed blocks with dedupe, erasure coding, tiering, metadata split from blocks, and hardware planning.</p>"}'></div>
  <div data-estimate='{"title":"YouTube views and upload storage","level":"Expert","prompt":"<p>A video platform. Assume <b>1 billion views per day</b>. The average view lasts <b>5 minutes</b> at <b>5 Mbps</b>. Creators upload <b>500,000 videos a day</b>, averaging <b>4 minutes</b> long, and each minute of video costs about <b>100 MB</b> stored across all transcoded resolutions.</p>","fields":[{"key":"viewsQps","label":"Average view starts per second","unit":"/s","answer":10000},{"key":"concurrent","label":"Average concurrent viewers","unit":"viewers","answer":3000000.0},{"key":"egress","label":"Average video egress bandwidth","unit":"Tbps","answer":15},{"key":"storeDay","label":"New video storage per day","unit":"TB","answer":200},{"key":"storeYear","label":"New video storage per year","unit":"PB","answer":73}],"soWhat":"<p><b>Egress dominates everything.</b> 15 Tbps on average (more at peak) is only possible with a CDN and edge caches placed inside ISPs: popular videos are served from the edge, the long tail from origin.</p><p><b>73 PB a year</b> goes to tiered object storage; rarely watched videos move to colder, cheaper tiers (and may keep fewer resolutions).</p><p><b>Uploads are only ~5/s</b>, but each needs heavy transcoding, so uploads land in object storage and a job queue feeds a transcoding fleet. Even the view counter needs care: 10,000 increments/s are aggregated in memory and flushed in batches, not one row update per view.</p>","worked":"<p><b>1. Per second:</b> 1B ÷ 100,000 = <b>10,000 view starts/s</b>.</p><p><b>2. Concurrency (Little&#39;s Law):</b> 10,000/s × 300 s = <b>3M concurrent viewers</b>. Bandwidth: 3M × 5 Mbps = 15M Mbps = <b>15 Tbps</b>.</p><p><b>3. Storage:</b> 500,000 × 4 min × 100 MB = 200M MB = <b>200 TB/day</b>. × 365 = 73,000 TB = <b>73 PB/year</b>.</p><p><b>4. So what:</b> CDN and edge caches for egress, tiered object storage, an async transcoding pipeline.</p>"}'></div>
  <div data-estimate='{"title":"LLM chat: tokens and cost","level":"Expert","prompt":"<p>A Claude-style chat product. Assume <b>5 million DAU</b> sending <b>10 messages a day</b>. Each request sends about <b>2,000 input tokens</b> (system prompt + conversation history) and streams back <b>500 output tokens</b> at <b>50 tokens/s</b>. Peak is <b>3×</b>. Use made-up round prices for the exercise: <b>$3 per million input tokens</b> and <b>$15 per million output tokens</b>.</p>","fields":[{"key":"msgQps","label":"Average messages per second","unit":"/s","answer":500},{"key":"streams","label":"Concurrent streaming responses at peak","unit":"streams","answer":15000},{"key":"inTok","label":"Input tokens per day","unit":"tokens","answer":100000000000.0},{"key":"outTok","label":"Output tokens per day","unit":"tokens","answer":25000000000.0},{"key":"cost","label":"Model cost per day","unit":"$","answer":675000}],"soWhat":"<p><b>Small request rate, long and expensive requests.</b> 500 messages/s is nothing for a web tier, but each holds a stream open for ~10 s, so you need about 15,000 concurrent SSE connections at peak (a handful of async streaming servers; never a thread per stream).</p><p><b>Cost is the headline:</b> $675,000/day ≈ $0.14 per DAU per day ≈ $4 per user per month, which shapes pricing and free-tier limits. Input is 4× the output token count and repeats every turn, so prompt caching of the system prompt and history prefix is the biggest lever; trim or summarize long histories; route easy requests to a smaller model.</p><p><b>Capacity is a rate limit:</b> 250,000 output tokens/s on average must fit within your model provider&#39;s token-per-minute limits, so per-user token budgets (429 + Retry-After) protect everyone.</p>","worked":"<p><b>1. Per day:</b> 5M × 10 = 50M messages. Input: 50M × 2,000 = <b>100B tokens</b>. Output: 50M × 500 = <b>25B tokens</b>.</p><p><b>2. Per second:</b> 50M ÷ 100,000 = <b>500/s</b>; peak 1,500/s. Each stream lasts 500 ÷ 50 = 10 s, so 1,500 × 10 = <b>15,000 streams</b> open at peak.</p><p><b>3. Cost:</b> 100,000M input × $3/M = $300,000; 25,000M output × $15/M = $375,000; total <b>$675,000/day</b>.</p><p><b>4. So what:</b> async streaming servers, prompt caching and history trimming for cost, per-user token budgets.</p>"}'></div>
  <h2>5. Check yourself</h2>
  <div data-quiz='[{"q":"You estimate 300 million events per day. Roughly how many per second on average?","o":["About 300","About 3,000","About 30,000","About 300,000"],"a":1,"why":"Divide by 100,000 (one day is about 10^5 seconds): 300,000,000 ÷ 100,000 = 3,000/s. Using 86,400 gives about 3,500; either is fine."},{"q":"50 million uploads a day at 1 MB each is how much new storage per day?","o":["50 GB","500 GB","50 TB","50 PB"],"a":2,"why":"50 million × 1 MB = 50 million MB. Million × MB = TB, so 50 TB."},{"q":"Your estimate says 1,500 writes/s at peak and 20 GB of data after a year. What is the strongest line 4?","o":["We need Cassandra because it scales","This fits one Postgres primary with a replica, so I won&#39;t shard; I&#39;ll revisit at 10× growth","We should shard from day one to be safe","Estimates don&#39;t matter for a system this small"],"a":1,"why":"The point of the estimate is the decision. Small numbers justify a simple design, and saying when you would revisit shows judgment."},{"q":"Why size a K-12 app for the 8:05am spike instead of the daily average?","o":["Averages are always wrong","The spike can be 10–20× the average, and a system sized for the average falls over exactly when every class starts","Schools require it by law","Peaks only matter for writes"],"a":1,"why":"Bursty events have peaks far above the 2–3× of a normal daily curve. Capacity has to meet the peak, ideally pre-scaled because reactive autoscaling is slower than the spike."},{"q":"Which habit most improves an estimate in an interview?","o":["Using 86,400 exactly","Computing to three decimal places","Stating the assumption first and rounding out loud","Skipping storage every time"],"a":2,"why":"An upfront assumption lets the interviewer correct you early, and announced rounding keeps it fast without looking careless."}]'></div>

  <h2>Recap</h2>
  <ul>
    <li>One day ≈ 100,000 seconds, so per day → per second is &quot;drop five zeros&quot;; 1M/day ≈ 12/s.</li>
    <li>Peak is 2–3× average for normal curves and 5–10× or more for bursty events; size for the peak.</li>
    <li>Four lines: users → per day, per second × peak, storage = writes × size × retention, and <b>so what</b>.</li>
    <li>Compare every number with one machine (app server ~1,000s/s, Postgres ~5–10k/s, Redis ~100k/s, disk a few TB); that comparison is your design decision.</li>
    <li>State assumptions first, round out loud, write it down, skip what doesn&#39;t change the design.</li>
  </ul>
