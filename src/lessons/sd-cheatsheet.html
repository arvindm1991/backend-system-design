  <h1>System design cheatsheet</h1>

  <table class="tbl">
    <thead><tr><th>Operation</th><th>Rough time</th><th>What it means for design</th></tr></thead>
    <tbody>
      <tr><td>Main memory read</td><td>~100 ns</td><td>In-process caches are effectively free</td></tr>
      <tr><td>NVMe SSD random read</td><td>~20–100 µs</td><td>An indexed lookup that misses RAM is still sub-millisecond</td></tr>
      <tr><td>Network round trip, same datacenter</td><td>~0.1–0.5 ms</td><td>Each service hop costs this; 10 sequential hops add up</td></tr>
      <tr><td>Redis GET over the network</td><td>~0.2–1 ms</td><td>Fine once per request; not 200 times in a loop</td></tr>
      <tr><td>Simple indexed SQL query</td><td>~1–5 ms</td><td>N+1 queries (one per item in a list) turn 5 ms into 500 ms</td></tr>
      <tr><td>Cross-availability-zone round trip</td><td>~0.5–2 ms</td><td>Synchronous replication across zones is affordable</td></tr>
      <tr><td>US coast to coast round trip</td><td>~60–80 ms</td><td>Synchronous cross-region writes hurt; replicate async</td></tr>
      <tr><td>US East ↔ Europe round trip</td><td>~70–100 ms</td><td>Serve users from a nearby region or CDN</td></tr>
      <tr><td>TLS + TCP setup on a new connection</td><td>~1–2 round trips</td><td>Reuse connections (keep-alive, HTTP/2)</td></tr>
      <tr><td>LLM time to first token</td><td>~0.3–2 s</td><td>Stream; show progress; never block a page on it</td></tr>
      <tr><td>Human perception</td><td>~100 ms feels instant; ~1 s keeps flow; ~10 s loses attention</td><td>Budget backward from what the user feels</td></tr>
    </tbody>
  </table>

  <h2>2. Conversions that make estimates fast</h2>
  <table class="tbl">
    <thead><tr><th>Fact</th><th>Use it as</th></tr></thead>
    <tbody>
      <tr><td>1 day = 86,400 s</td><td>≈ 10<sup>5</sup> s (round down to be conservative on peaks)</td></tr>
      <tr><td>1 million per day</td><td>≈ 12 per second</td></tr>
      <tr><td>1 billion per day</td><td>≈ 12,000 per second</td></tr>
      <tr><td>1 month</td><td>≈ 2.6 million seconds</td></tr>
      <tr><td>Peak vs average</td><td>2–5× for smooth consumer traffic; 10×+ for spiky (school bells, on-sales, launches)</td></tr>
      <tr><td>2<sup>10</sup>, 2<sup>20</sup>, 2<sup>30</sup>, 2<sup>40</sup></td><td>≈ thousand (KB), million (MB), billion (GB), trillion (TB)</td></tr>
      <tr><td>1 Gbps</td><td>≈ 125 MB/s (divide bits by 8)</td></tr>
      <tr><td>Little's Law</td><td>things in flight = arrival rate × time each takes (1,000 req/s × 0.2 s = 200 concurrent)</td></tr>
      <tr><td>Read:write ratio</td><td>Most products are 10:1 to 100:1 read-heavy; chat and logging are write-heavy</td></tr>
    </tbody>
  </table>

  <h2>3. Sizes worth remembering</h2>
  <table class="tbl">
    <thead><tr><th>Thing</th><th>Rough size</th></tr></thead>
    <tbody>
      <tr><td>ASCII character / UTF-8 character</td><td>1 byte / 1–4 bytes</td></tr>
      <tr><td>Integer / bigint / timestamp</td><td>4 / 8 / 8 bytes</td></tr>
      <tr><td>UUID</td><td>16 bytes binary, 36 characters as text</td></tr>
      <tr><td>Typical DB row with indexes</td><td>100 bytes – 1 KB</td></tr>
      <tr><td>Short post or chat message with metadata</td><td>~300 bytes – 1 KB</td></tr>
      <tr><td>Page of text (~500 words)</td><td>~3 KB, ~650 LLM tokens</td></tr>
      <tr><td>LLM token (English)</td><td>~4 characters, ~0.75 words</td></tr>
      <tr><td>Phone photo (compressed)</td><td>~1–5 MB; thumbnail ~10–50 KB</td></tr>
      <tr><td>1 minute of speech audio (Opus/AAC)</td><td>~150 KB – 1 MB</td></tr>
      <tr><td>1 minute of 1080p video</td><td>~40–100 MB (5–12 Mbps)</td></tr>
    </tbody>
  </table>

  <h2>4. Rough capacity per box (honest ranges)</h2>
  <p>These vary by 10× with hardware, payload and code quality. Say the range and the assumption: "assuming simple indexed reads on a large instance".</p>
  <table class="tbl">
    <thead><tr><th>Component</th><th>Rough capacity</th><th>Notes</th></tr></thead>
    <tbody>
      <tr><td>Stateless app server</td><td>~1,000–10,000 req/s doing real work</td><td>Much more for trivial endpoints; scale horizontally behind a load balancer</td></tr>
      <tr><td>Postgres / MySQL primary: reads</td><td>~10,000–50,000+ simple indexed queries/s</td><td>Add read replicas and caches before sharding</td></tr>
      <tr><td>Postgres / MySQL primary: writes</td><td>~1,000–10,000+ transactions/s</td><td>Batching and commit settings matter a lot; sharding is the big step</td></tr>
      <tr><td>Single SQL database size</td><td>Comfortable into the low TBs; many run 10+ TB</td><td>Backups, migrations and index builds get slow first</td></tr>
      <tr><td>Redis node</td><td>~100,000–200,000 simple ops/s; more with pipelining</td><td>Bounded by RAM (tens to hundreds of GB); single-threaded command execution</td></tr>
      <tr><td>Kafka cluster</td><td>Hundreds of thousands to millions of messages/s</td><td>Throughput scales with partitions; ordering is per partition</td></tr>
      <tr><td>WebSocket / SSE server</td><td>~10,000–100,000 open connections comfortably</td><td>Hundreds of thousands with tuning; memory per connection is the limit</td></tr>
      <tr><td>Object storage (S3-style)</td><td>Effectively unlimited capacity</td><td>Request rates are per key prefix (S3 documents thousands of requests/s per prefix); latency tens of ms</td></tr>
      <tr><td>Search node (Elasticsearch/OpenSearch)</td><td>Hundreds to thousands of queries/s</td><td>Depends heavily on query complexity and index size</td></tr>
      <tr><td>CDN</td><td>Serves most static traffic at the edge</td><td>90%+ hit ratio for static assets is normal</td></tr>
    </tbody>
  </table>

  <h2>5. A 60-second estimate, worked</h2>
  <div class="trace">
    <ol>
      <li>Prompt: "photo sharing app, 20 million daily users".</li>
      <li><b>Writes:</b> 1 in 10 users uploads 2 photos/day = 4 M uploads/day ≈ 4 × 12 = <b>~50 uploads/s</b>, peak ~150–250.</li>
      <li><b>Reads:</b> each user views ~50 photos/day = 1 B views/day ≈ <b>12,000/s</b>, peak ~40,000. Read-heavy 250:1, so cache and CDN matter most.</li>
      <li><b>Storage:</b> 4 M × 3 MB = 12 TB/day ≈ <b>4 PB/year</b> (plus thumbnails). Object storage, not a database.</li>
      <li><b>Bandwidth:</b> 40,000 views/s × 200 KB (sized-down images) = 8 GB/s ≈ 64 Gbps at peak. That's a CDN's job.</li>
      <li><b>Metadata:</b> 4 M rows/day × 500 B = 2 GB/day ≈ 0.7 TB/year: one SQL database with replicas for years.</li>
      <li><b>Say:</b> "So the hard parts are blob storage and delivery, not the database."</li>
    </ol>
  </div>

  <h2 id="building-blocks">6. The 15 building blocks</h2>
  <p>Here's a secret that makes HLD less scary: almost every design you'll draw is built from the same fifteen or so components. A URL shortener, a chat app and a booking site use mostly the same boxes, wired differently. You don't need to know a hundred technologies. You need to know these few well: what each one is, the number or requirement that makes it worth adding, and the trap it brings.</p>
  <p>The picture below is the "default architecture" most designs start from. Read it top to bottom as a request's journey: the user looks up the address (DNS), static files come from the CDN, everything else goes through the load balancer and gateway to stateless app servers, which read and write the data stores, hand slow work to a queue, and push live updates out through the realtime gateway. The numbers match the table under it.</p>

    <figcaption>The default web architecture with the building blocks numbered. Most designs use a subset of these boxes; the interesting part is which ones THIS problem needs and why.</figcaption>
  </figure>
  <table class="tbl">
    <thead><tr><th>#</th><th>Block</th><th>What it is</th><th>Earns its place when</th><th>Cost / trap</th><th>Seen in</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>DNS</td><td>Turns a name (<code>app.example.com</code>) into an IP address</td><td>Always there; becomes a design tool for geo-routing users to the nearest region and for failover</td><td>Answers are cached for the TTL, so a failover can take minutes to reach everyone</td><td>Multi-region LLM chat: route each user to the nearest healthy region</td></tr>
      <tr><td>2</td><td>CDN</td><td>Servers near users that cache and serve static files and media</td><td>Static assets, images, video, global users; anything read far more than written</td><td>Stale copies until invalidated; never cache personalized responses publicly</td><td>Upload: thumbnails and files served from the edge; video segments</td></tr>
      <tr><td>3</td><td>Load balancer</td><td>Spreads requests across many app servers, skips unhealthy ones</td><td>More than one app server (so: always, for availability)</td><td>Sticky sessions quietly make servers stateful; long-lived connections need special handling</td><td>Every case study; chat needs it to spread WebSocket connections</td></tr>
      <tr><td>4</td><td>API gateway</td><td>One front door for the API: auth, routing to services, request limits</td><td>Several backend services, or shared auth and rate limits for public APIs</td><td>Another hop and another thing to keep up; don't put business logic in it</td><td>Rate limiter case study: limits enforced at the gateway</td></tr>
      <tr><td>5</td><td>App servers (stateless)</td><td>Your code; keeps no user data in memory between requests</td><td>Always; stateless means you add servers to scale (roughly 1,000–10,000 req/s each)</td><td>Any state you sneak in (sessions, uploads on local disk) breaks scaling and deploys</td><td>Every case study</td></tr>
      <tr><td>6</td><td>Cache (Redis)</td><td>In-memory key-value store; ~1 ms reads</td><td>Read-heavy hot data (10:1 reads or more), counters, sessions, rate-limit buckets</td><td>Stale data, invalidation bugs, stampedes when a hot key expires</td><td>Shortener: the redirect path is a cache lookup</td></tr>
      <tr><td>7</td><td>Relational DB (+ read replicas)</td><td>Postgres/MySQL: tables, joins, transactions, constraints; replicas copy it for reads</td><td>The default home for core data. Replicas when reads outgrow one primary</td><td>Replication lag: a user may not see their own write on a replica; read it from the primary</td><td>Booking: the seat row and its conditional update are the source of truth</td></tr>
      <tr><td>8</td><td>Sharding / partitioning</td><td>Splitting one dataset across many databases by a key</td><td>Data or write rate no longer fits one primary (think multiple TB, or ~10,000+ writes/s)</td><td>Cross-shard queries and transactions get hard; a bad shard key creates hot shards</td><td>Chat: messages partitioned by conversation ID</td></tr>
      <tr><td>9</td><td>NoSQL (wide-column / KV)</td><td>Cassandra, DynamoDB: huge scale for queries you design up front</td><td>Very high write rates with simple, known access patterns (by ID, by ID + time)</td><td>Only the queries you designed for are fast; weaker transactions</td><td>Chat message history keyed by conversation, sorted by time</td></tr>
      <tr><td>10</td><td>Object storage (S3)</td><td>Cheap, durable storage for files of any size, addressed by key</td><td>Anything bigger than a few KB: photos, video, PDFs, backups, exports</td><td>Not a database: no queries, tens of ms latency. Keep metadata in SQL</td><td>Upload: clients send bytes straight to S3 with presigned URLs</td></tr>
      <tr><td>11</td><td>Message queue / log</td><td>SQS (jobs, deleted when done) or Kafka (an event log many readers can replay)</td><td>Slow or retryable work, absorbing spikes, several consumers of one event</td><td>At-least-once delivery means duplicates: consumers must be idempotent</td><td>Notifications: separate queues so a campaign can't delay a login code</td></tr>
      <tr><td>12</td><td>Background workers</td><td>Processes that pull jobs from the queue and do them</td><td>Anything that doesn't need to finish before the response: email, thumbnails, LLM jobs</td><td>Stuck or poison jobs; need retries with backoff and a dead-letter queue</td><td>Upload: scan and resize after the file lands</td></tr>
      <tr><td>13</td><td>Search index</td><td>Elasticsearch/OpenSearch: an inverted index for full-text search and filters</td><td>Users type words and expect ranked results, facets, typo tolerance</td><td>It's a copy: keep it in sync from the database, expect seconds of lag</td><td>Autocomplete's bigger cousin; product or docs search</td></tr>
      <tr><td>14</td><td>Realtime gateway</td><td>Servers that hold WebSocket/SSE connections open and push to clients</td><td>Users must see changes within a second without refreshing</td><td>Stateful connections: reconnect storms, a registry of who is connected where</td><td>Chat delivery; streaming LLM tokens; collaborative editing</td></tr>
      <tr><td>15</td><td>Rate limiter</td><td>Counts requests per user/tenant and rejects the excess with 429</td><td>Public APIs, login, anything expensive (LLM calls), protecting from abuse and spikes</td><td>Must be atomic across servers; decide fail-open vs fail-closed</td><td>Rate limiter case study; per-tenant token budgets in LLM chat</td></tr>
      <tr><td>16</td><td>Observability</td><td>Logs (what happened), metrics (how much, how fast), traces (where the time went)</td><td>Always; you can't fix what you can't see. Mention alerts on the one or two numbers that matter</td><td>Cost and noise: high-cardinality labels, alert fatigue</td><td>Every case study's "how do you know it's working?"</td></tr>
    </tbody>
  </table>
  <p><b>Less common, but real.</b> These show up when a specific requirement calls for them. Name them only when it does.</p>
  <ul>
    <li><b>Coordination service</b> (ZooKeeper, etcd): leader election, distributed locks with fencing, cluster config. When one node must be "the" scheduler or owner (see <a href="#consensus">consensus</a>).</li>
    <li><b>Stream processor</b> (Flink, Kafka Streams): continuous computations over events, like "views per video in the last 5 minutes" or trending queries.</li>
    <li><b>Vector database</b> (pgvector, Pinecone): "find things similar to this" for semantic search and RAG in LLM products.</li>
    <li><b>Time-series database</b> (Prometheus, InfluxDB): metrics and sensor data with heavy compression and rollups.</li>
    <li><b>Blob processing pipeline</b>: object-created event → queue → workers (scan, transcode, thumbnail), as in upload and video.</li>
  </ul>
  <div class="callout key"><span class="callout-label">The point</span><p>The components are few, and every candidate knows them. You don't score by naming more boxes. You score with the parts that are specific to <i>this</i> problem: the requirements you pinned down, the estimates that tell you which box is under pressure (<a href="#sd-estimation">estimation</a>), the data model and its keys, and the one trade-off you name and defend ("conditional update on the seat row, not a distributed lock, because…"). The <a href="#sd-archetypes">archetypes lesson</a> shows where that problem-specific part lives for twenty common prompts.</p></div>

  <h2>7. More blocks: quick lookup</h2>
  <p>A denser reference that also covers document stores, pub/sub, workflow engines, warehouses and vector indexes.</p>
  <table class="tbl">
    <thead><tr><th>Block</th><th>Reach for it when</th><th>Watch out for</th></tr></thead>
    <tbody>
      <tr><td>Load balancer</td><td>More than one app server; health checks; TLS termination</td><td>Sticky sessions undo statelessness; long-lived connections need special timeouts</td></tr>
      <tr><td>CDN</td><td>Static assets, media, cacheable GETs, global users</td><td>Invalidation lag; never cache personalized responses publicly</td></tr>
      <tr><td>Cache (Redis/Memcached)</td><td>Read-heavy hot data; counters; sessions; rate limits</td><td>Staleness, invalidation, stampedes on expiry, hot keys</td></tr>
      <tr><td>Relational DB (Postgres/MySQL)</td><td>Default for core data: relations, transactions, constraints</td><td>Write scaling needs sharding; schema migrations at size</td></tr>
      <tr><td>Read replicas</td><td>Read load exceeds one primary</td><td>Replication lag breaks read-your-writes; route those reads to the primary</td></tr>
      <tr><td>Sharding / partitioning</td><td>Data or writes exceed one primary</td><td>Cross-shard queries and transactions; choose the shard key by access pattern</td></tr>
      <tr><td>Key-value / wide-column (DynamoDB, Cassandra)</td><td>Massive scale, known access patterns, high write rates</td><td>Limited queries; design tables per query; eventual consistency options</td></tr>
      <tr><td>Document store (MongoDB)</td><td>Nested, flexible records read as a whole</td><td>Cross-document joins and transactions are weaker or costlier</td></tr>
      <tr><td>Search index (Elasticsearch/OpenSearch)</td><td>Full-text search, filters, facets, relevance ranking</td><td>It's a derived copy: sync it from the source of truth; not a primary store</td></tr>
      <tr><td>Object storage (S3)</td><td>Files, media, backups, data lake, large blobs</td><td>Not for small, frequently updated records; use presigned URLs for uploads</td></tr>
      <tr><td>Queue (SQS, RabbitMQ)</td><td>Background jobs, smoothing spikes, retries</td><td>At-least-once delivery: consumers must be idempotent; dead-letter queues</td></tr>
      <tr><td>Log / stream (Kafka, Kinesis)</td><td>Event streams, many consumers, replay, analytics pipelines</td><td>Ordering only within a partition; operational weight</td></tr>
      <tr><td>Pub/sub</td><td>Fan out messages to many subscribers (realtime, invalidations)</td><td>Fire-and-forget variants drop messages when subscribers are down</td></tr>
      <tr><td>WebSocket / SSE gateway</td><td>Server push: chat, live dashboards, streaming LLM output</td><td>Stateful connections, reconnect storms, proxies and filters</td></tr>
      <tr><td>Workflow / scheduler</td><td>Multi-step jobs, retries over hours, cron-like schedules</td><td>Idempotent steps; visibility into stuck jobs</td></tr>
      <tr><td>Data warehouse (BigQuery, Snowflake, ClickHouse)</td><td>Analytics and reports over large history</td><td>Not for per-request reads; data arrives with some delay</td></tr>
      <tr><td>Vector database / index</td><td>Semantic search, retrieval for LLMs (RAG)</td><td>Approximate results; keep metadata filters and permissions in sync</td></tr>
    </tbody>
  </table>

  <h2>8. Trade-off phrasebook</h2>
  <p>Fill in the numbers from your design. Each one follows "X gives A at the cost of B; choose it when C".</p>
  <ul>
    <li><b>Cache:</b> "A cache gives us ~1 ms reads and takes load off the database, at the cost of serving data up to TTL seconds stale; fine here because [requirement]."</li>
    <li><b>Sync vs async:</b> "Doing this in a background job makes the request fast and lets us retry, at the cost of the result not being visible immediately; I'd show a 'processing' state."</li>
    <li><b>Consistency:</b> "Strong consistency here costs us latency and some availability during failures; I'll spend it on [money, inventory, permissions] and use eventual consistency for [feeds, counts, analytics]."</li>
    <li><b>Read replicas:</b> "Replicas scale reads at the cost of replication lag, so right after a user writes, I'll read their own data from the primary."</li>
    <li><b>Denormalize:</b> "Storing the author's name on each post saves a join on every read, at the cost of updating many rows if the name changes, which is rare."</li>
    <li><b>Precompute vs on demand:</b> "Precomputing makes reads a lookup at the cost of storage and freshness; computing on demand is always fresh but slower. Reads outnumber writes 100:1, so precompute."</li>
    <li><b>Push vs pull:</b> "Fan-out on write makes reads cheap at the cost of write amplification for large audiences; I'll pull for the few huge accounts."</li>
    <li><b>SQL vs NoSQL:</b> "Postgres gives us transactions and flexible queries; a wide-column store gives easier horizontal write scaling but only the queries we design for. At [N] writes/s, Postgres is enough."</li>
    <li><b>Fail open vs closed:</b> "If the limiter is down we fail open, trading a brief window of abuse for keeping the product up; for login and costly operations we fail closed."</li>
    <li><b>At-least-once:</b> "The queue delivers at least once, so I'll make the consumer idempotent with a dedupe key rather than chase exactly-once."</li>
    <li><b>Monolith vs services:</b> "One deployable keeps the team fast at the cost of coupling; I'd split out only the parts with very different scaling or reliability needs, like the WebSocket gateway."</li>
    <li><b>Build vs buy:</b> "A managed service costs more per unit but saves on-call and months of work; I'd buy until scale or a hard requirement says otherwise."</li>
    <li><b>Multi-region:</b> "Active-active across regions improves latency and survives a region outage, at the cost of conflict handling; I'd start active-passive with async replication and a tested failover."</li>
  </ul>

  <h2>9. Questions to ask, and failure prompts to ask yourself</h2>
  <ul>
    <li><b>Requirements:</b> Who are the users? Top 3 actions? How many users, how fast growing? Read or write heavy? How fresh must data be? What must never happen (double charge, data leak)? Any compliance or privacy rules? Mobile, web, or both?</li>
    <li><b>Failure prompts for each arrow in your diagram:</b> What if this call is slow? Fails? Happens twice? Happens out of order? What if this box is down for 5 minutes? What's the first thing to break at 10× traffic?</li>
  </ul>

  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"Let me do rough numbers so we know what kind of problem this is: 20 million daily users, about 50 uploads a second but 12,000 views a second, roughly 4 petabytes a year of photos. That tells me the database is the easy part; the design is really about object storage and CDN delivery. I'll treat these as within a factor of a few; tell me if your numbers differ."</p></div>

  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Unit slips and false precision. Mixing up bits and bytes (a "1 Gbps" link moves ~125 MB/s, not 1 GB/s), forgetting to convert per-day to per-second, or quoting "Postgres does 47,000 QPS" as if it were a law of nature. Round aggressively, label units on every number, give ranges for hardware-dependent figures, and say what each number means for the design.</p></div>

  <div data-quiz='[{"q":"About how many requests per second is 1 billion requests per day?","o":["About 1,200","About 12,000","About 120,000","About 1.2 million"],"a":1,"why":"1 billion divided by roughly 86,400 seconds is about 11,600."},{"q":"A 1 Gbps network link moves roughly how much data per second?","o":["1 GB","125 MB","8 GB","10 MB"],"a":1,"why":"Divide bits by 8: 1,000 Mbps is about 125 MB per second."},{"q":"Which is the slowest?","o":["Main memory read","Redis GET in the same datacenter","SSD random read","Round trip from the US East Coast to Europe"],"a":3,"why":"Crossing an ocean is tens of milliseconds; the others are nanoseconds to about a millisecond."},{"q":"Using Little Law, 2,000 requests per second that each take 0.5 seconds means about how many in flight?","o":["4","1,000","2,000","4,000"],"a":1,"why":"Concurrency equals rate times duration: 2,000 times 0.5 equals 1,000."},{"q":"You need full-text search over product descriptions stored in Postgres. What is the usual building block?","o":["Make the search index the only copy of the data","A search index kept in sync from the database as a derived copy","A message queue","Object storage"],"a":1,"why":"Search engines are great at relevance and filtering but should be fed from the source of truth."}]'></div>

  <h2>Recap</h2>
  <ul>
    <li>Memory ≈ 100 ns, same-datacenter hop ≈ 0.5 ms, cross-continent ≈ 70–100 ms: count your hops.</li>
    <li>1 M/day ≈ 12/s; peaks are 2–5× average, 10×+ for event-driven spikes; Little's Law sizes concurrency.</li>
    <li>Per-box capacities are ranges: say the range and the assumption.</li>
    <li>HLD remixes about fifteen building blocks; each earns its place with a requirement and brings a known trap. The score comes from requirements, estimates, the data model and the trade-off you name for this problem.</li>
    <li>Speak trade-offs as "X gives A at the cost of B; choose it when C", with numbers.</li>
  </ul>
