  <h1>The 20 system design archetypes</h1>
  <p class="lede">"Design Uber." "Design a web crawler." "Design Stripe." There seem to be hundreds of system design questions, but most of them are about twenty problems in different costumes. Each problem has one or two nuances that make it hard, and that nuance is the deep dive the interviewer is waiting for. After this lesson you can hear a prompt, name its archetype within two minutes, and steer straight to the part that matters: the celebrity fan-out in a feed, the double-entry ledger in a wallet, the politeness queue in a crawler, the microVM in a code runner.</p>

  <h2>1. Same twenty problems, different costumes</h2>
  <p>You asked whether the ten case studies are the only systems with nuances, or whether the rest follow similar patterns. The honest answer: almost every system has nuances, but they repeat. "Design Instagram", "design Twitter" and "design LinkedIn's feed" are the same problem: lots of people post, each reader sees a merged list of the people they follow, and one account with 50 million followers breaks the naive design. Change the nouns and the hard part stays.</p>
  <p>An <b>archetype</b> here means a family of systems that share the same hard part. The boring 70% of every design is identical: stateless app servers behind a load balancer, a database, a cache, a queue for slow work, a CDN for static bytes. You already know that part from Part 2. What separates a strong answer is the remaining 30%, and that 30% is decided by the archetype.</p>
  <p>Two warnings before the catalogue:</p>
  <ul>
    <li><b>The archetype is a hypothesis, not an answer.</b> You still clarify requirements first (step 1 of <a href="#sd-framework">the framework</a>). "Design Yelp" is a location archetype if they care about "restaurants near me", and a search archetype if they care about "vegan ramen open late". Ask.</li>
    <li><b>Real prompts mix two or three archetypes.</b> "Design DoorDash" is location + a booking-style state machine + notifications + payments. Section 15 shows how to decompose ten famous prompts.</li>
  </ul>

  <h2>2. Recognize the archetype in the first two minutes</h2>
  <p>While you clarify requirements, you're quietly asking yourself seven questions. Each one points at an archetype. You don't need to say them as a checklist; weave them into your clarifying questions.</p>
  <div class="cards">
    <div class="card"><span class="card-k">Read or write heavy?</span><h3>What's the ratio?</h3><p>100 reads per write points to caching and precomputation (shortener, feed, autocomplete). Writes far above reads points to ingestion pipelines (metrics, counting, location pings).</p></div>
    <div class="card"><span class="card-k">Realtime?</span><h3>Does the server push?</h3><p>If users must see changes within a second without refreshing: persistent connections (chat, collab, live location, streaming LLM replies).</p></div>
    <div class="card"><span class="card-k">Money or scarcity?</span><h3>Is a mistake unforgivable?</h3><p>Money, seats or inventory mean strong consistency, idempotency and an audit trail (booking, payments). Everything else can usually be eventually consistent.</p></div>
    <div class="card"><span class="card-k">Fan-out?</span><h3>Does one action touch millions?</h3><p>One post to 50 M followers, one campaign to 20 M inboxes: the fan-out cost and the skew (celebrities, hot keys) is the deep dive.</p></div>
    <div class="card"><span class="card-k">Geospatial?</span><h3>"Near me"?</h3><p>Anything with a map and "nearby" needs a spatial index; if the things move, the write rate of location updates is the hard part.</p></div>
    <div class="card"><span class="card-k">Untrusted input?</span><h3>Do users send code, files or URLs?</h3><p>Uploaded files, user code, crawled pages: isolation, scanning, limits and abuse become first-class design concerns.</p></div>
    <div class="card"><span class="card-k">Bursty or scheduled?</span><h3>Does traffic arrive all at once?</h3><p>On-sales, 9:00am cron jobs, back-to-school: admission control, queues, jitter. Time itself (schedules, windows, time zones) may be the problem.</p></div>
  </div>

  <div class="callout key"><span class="callout-label">How to use the first two minutes</span><p>Clarify, then say the archetype out loud as a hypothesis: "So this is mostly a contended-inventory problem, like ticket booking: the thing we can never get wrong is selling the same room twice. I'll keep the rest standard and spend the deep dive there. Sound right?" The interviewer either confirms (you've shown judgment) or redirects you (you've saved 20 minutes).</p></div>

  <h2>3. Part A: the ten you have already designed</h2>
  <p>Each of these has a full case study in this course. Here is the compressed version: what it really is, where it shows up in disguise, the one or two nuances that make it hard, what transfers to its cousins, and the deep-dive question you'll almost certainly get.</p>

  <h3>A1. Key lookup: the URL shortener</h3>
  <p><b>Essence.</b> Create a short key for a value once; read it back millions of times, fast, forever.</p>
  <p><b>In costume.</b> bit.ly, TinyURL, Pastebin (the value is a blob in object storage), share/invite links, QR-code menus, "design a unique ID generator" (Twitter's Snowflake).</p>
  <p><b>What makes it hard.</b> (1) Generating short codes that never collide, without every write coordinating with every other server. (2) The redirect path is 100× hotter than creation and must stay up even when the database is down, so it is a caching and availability problem, not a storage problem (the whole dataset fits in a few TB).</p>
  <p><b>Transfers to cousins.</b> Any read-mostly lookup by ID: cache the hot path, push slow side effects (click analytics) onto a queue so they can never slow the read. Unique ID generation (counter blocks, Snowflake-style time + machine + sequence) reappears in chat message IDs and payments.</p>
  <div class="callout key"><span class="callout-label">Deep dive you'll get</span><p><b>"How do two servers never hand out the same code?"</b> Each app server leases a block of 1,000 numbers from a central counter, so a write is one insert with no collision check; numbers are base62-encoded and scrambled so codes aren't guessable. Seven base62 characters give 62<sup>7</sup> ≈ 3.5 trillion codes, which is plenty.</p></div>
  <p><a href="#sd-shortener">Full case study →</a></p>
  <div data-videos="arch-shortener"></div>

  <h3>A2. Feed: many writers, merged reads</h3>
  <p><b>Essence.</b> Each user sees a merged, ordered list of what the people they follow posted.</p>
  <p><b>In costume.</b> Twitter/X home timeline, Instagram, LinkedIn, Facebook News Feed, Reddit's home page, Strava or GitHub activity feeds, a teacher's class stream.</p>
  <p><b>What makes it hard.</b> (1) Where to do the merge: at write time (push the post ID into every follower's timeline, cheap reads) or at read time (pull from everyone you follow, cheap writes). (2) Skew: one account with 50 million followers turns one post into 50 million timeline writes.</p>
  <p><b>Transfers to cousins.</b> The <b>hybrid</b> (push for normal accounts, pull for celebrities at read time) is the general answer to any fan-out with heavy skew: group notifications, Slack channels with 100,000 members, follower counts. "Store IDs, hydrate on read" transfers to any cached list.</p>
  <div class="callout key"><span class="callout-label">Deep dive you'll get</span><p><b>"What about someone with 50 million followers?"</b> Accounts above a threshold (say 100,000 followers) are not fanned out; their recent posts are fetched at read time and merged into the precomputed timeline. That turns a 50-million-write post into one write plus a cheap merge for each reader who follows a few celebrities.</p></div>
  <p><a href="#sd-feed">Full case study →</a></p>
  <div data-videos="arch-feed"></div>

  <h3>A3. Chat: ordered, durable, realtime messaging</h3>
  <p><b>Essence.</b> Deliver messages in real time over persistent connections, in the same order for everyone, without losing or duplicating any, even across offline devices.</p>
  <p><b>In costume.</b> WhatsApp, Slack, Messenger, Discord, in-app support chat, live comments on a stream, multiplayer game lobbies.</p>
  <p><b>What makes it hard.</b> (1) "Sent" must mean durable: assign a per-conversation sequence number and persist before acking; dedupe client retries by client message ID. (2) Devices go offline, so delivery is really sync by cursor ("give me everything after seq 1047"); the push is only a wake-up hint. Presence is a hidden scale trap (500,000 heartbeats/s).</p>
  <p><b>Transfers to cousins.</b> Gateways that only hold connections plus a session registry ("user → gateway") is the shape of every push-based realtime system: live sports scores, ride status updates, collaborative cursors, streaming results from a code runner.</p>
  <div class="callout key"><span class="callout-label">Deep dive you'll get</span><p><b>"A gateway with 80,000 connections crashes. What happens?"</b> Nothing is lost, because messages were stored before the ack. Clients reconnect (with jittered backoff so they don't stampede) to other gateways, re-register, and sync from their last cursor; anything unacked is resent with the same client ID and deduped.</p></div>
  <p><a href="#sd-chat">Full case study →</a></p>
  <div data-videos="arch-chat"></div>

  <h3>A4. Notifications: reliable delivery through third parties</h3>
  <p><b>Essence.</b> Turn product events into the right messages on the right channels, delivered through providers you don't control.</p>
  <p><b>In costume.</b> Email/SMS/push platforms, one-time-code senders, marketing campaigns, reminder services, and (less obviously) <b>webhook delivery</b> like Stripe's, where the "provider" is a customer's HTTP endpoint.</p>
  <p><b>What makes it hard.</b> (1) Priority isolation: a 20-million-email campaign must never delay a login code, so separate queues and worker pools. (2) Exactly-once delivery to a third party is impossible over a network; you choose, per category, whether a duplicate or a miss is worse, and dedupe at intake and in the worker.</p>
  <p><b>Transfers to cousins.</b> Webhook delivery is the same design with per-endpoint backoff and a circuit breaker per customer, so one dead endpoint can't clog the queue. Preferences, quiet hours and unsubscribe show up in any user-facing messaging.</p>
  <div class="callout key"><span class="callout-label">Deep dive you'll get</span><p><b>"Can you guarantee exactly once?"</b> Not to an external provider: if the provider times out, you can't know whether it sent. So the producer's idempotency key dedupes intake, the worker checks status before sending, and the retry rule depends on the category: a login code is retried (a duplicate is harmless), a "your payment failed" email is not retried blindly.</p></div>
  <p><a href="#sd-notifications">Full case study →</a></p>
  <div data-videos="arch-notifications"></div>

  <h3>A5. Rate limiter: shared counters on the hot path</h3>
  <p><b>Essence.</b> Decide in under a millisecond, across dozens of servers, whether this request is within its budget.</p>
  <p><b>In costume.</b> API throttling, an API gateway, login brute-force protection, LLM token quotas per tenant, anti-spam ("max 20 invites per hour"), and admission control like a waiting room.</p>
  <p><b>What makes it hard.</b> (1) Atomicity: read-compare-write from 50 gateways lets concurrent requests all slip through; the check-and-consume must be one atomic operation (Redis script or INCR). (2) The limiter sits on every request, so its failure mode is a product decision: fail open (keep serving) for most endpoints, fail closed for login and expensive LLM calls.</p>
  <p><b>Transfers to cousins.</b> The token bucket ("refill rate + burst size") is the vocabulary for any quota. Atomic counters in a shared store reappear in counting and booking. Batching tokens locally for hot tenants is the same trick as batching counter increments.</p>
  <div class="callout key"><span class="callout-label">Deep dive you'll get</span><p><b>"Which algorithm, and why?"</b> A token bucket per key: real clients are bursty, and the bucket allows a short burst up to its size while enforcing an average rate. It's two numbers per key (tokens, last refill time), updated in one atomic script using the store's clock so gateway clock skew doesn't matter.</p></div>
  <p><a href="#sd-ratelimiter">Full case study →</a></p>
  <div data-videos="arch-ratelimiter"></div>

  <h3>A6. Blob upload and storage</h3>
  <p><b>Essence.</b> Get big, untrusted files from flaky clients into durable storage, process them, and serve them cheaply.</p>
  <p><b>In costume.</b> Dropbox, Google Drive, Box, image hosting, profile photos, attachments in Slack or email, the upload half of YouTube.</p>
  <p><b>What makes it hard.</b> (1) App servers shouldn't move bytes: hand out presigned URLs so clients upload directly to object storage, in parts, resumable. (2) Every file is hostile until proven otherwise: server-generated keys, type checks by content, scanning before anyone else can download it.</p>
  <p><b>Transfers to cousins.</b> Dropbox adds a sync twist: split files into chunks (a few MB), address each chunk by its content hash, and upload only chunks the server hasn't seen. Editing one paragraph of a 100 MB file re-uploads one chunk, and identical files across users are stored once (dedupe). The "event on object created → idempotent pipeline" shape is reused by video transcoding.</p>
  <div class="callout key"><span class="callout-label">Deep dive you'll get</span><p><b>"A 5 GB upload on hotel Wi-Fi fails at 80%. Then what?"</b> It was a multipart upload of, say, 8 MB parts, each with its own presigned URL. The client asks which parts the store already has and re-sends only the missing ones; nothing restarts from zero. Unfinished uploads are cleaned up by a lifecycle rule after a day or so.</p></div>
  <p><a href="#sd-upload">Full case study →</a></p>
  <div data-videos="arch-upload"></div>

  <h3>A7. Typeahead: precompute because the budget is tiny</h3>
  <p><b>Essence.</b> Return the best 10 completions for a prefix within roughly 50–100 ms, on every keystroke.</p>
  <p><b>In costume.</b> The Google search box, Amazon's search suggestions, @mention and hashtag pickers, address autocomplete, command palettes.</p>
  <p><b>What makes it hard.</b> (1) You can't rank thousands of matches per keystroke at 20,000 requests/s, so the ranked top-k for every prefix is precomputed offline from query logs and served from memory. (2) The client is half the system: debounce, cancel stale requests, ignore out-of-order responses.</p>
  <p><b>Transfers to cousins.</b> "Move the work offline and serve a precomputed answer" is the move for recommendations ("people you may know"), trending lists and leaderboards. The offline index plus a small realtime layer merged at read time reappears in search (B10).</p>
  <div class="callout key"><span class="callout-label">Deep dive you'll get</span><p><b>"Breaking news: a new query is trending. Your index is hourly."</b> Add a small realtime layer: a stream job counts queries in the last few minutes and keeps a short list of fast-rising ones per prefix; the suggest server merges it with the hourly snapshot. The snapshot stays the stable base, the realtime layer handles freshness.</p></div>
  <p><a href="#sd-autocomplete">Full case study →</a></p>
  <div data-videos="arch-autocomplete"></div>

  <h3>A8. LLM chat: long, expensive, streamed responses</h3>
  <p><b>Essence.</b> Each request takes 10–30 seconds, is streamed token by token, runs on scarce GPU capacity, and costs more the longer the conversation gets.</p>
  <p><b>In costume.</b> ChatGPT, Claude.ai, coding assistants, an AI tutor in a reading app, support bots, "add an AI assistant to our product".</p>
  <p><b>What makes it hard.</b> (1) Streaming that survives disconnects: decouple generation from the connection by buffering tokens with event IDs, so a dropped tab resumes instead of losing a paid-for reply. (2) Capacity and cost: GPUs can't autoscale in seconds, so you need admission control and per-tenant token budgets, and because history is resent every turn, input tokens dominate cost (prompt caching, trimming, summarizing).</p>
  <p><b>Transfers to cousins.</b> Any long-running job with progressive output (code execution results, video processing progress, AI agents) uses the same "job runs independently, client subscribes to its event stream by ID" shape.</p>
  <div class="callout key"><span class="callout-label">Deep dive you'll get</span><p><b>"The user closes the tab halfway through a reply."</b> Generation keeps running into a per-reply buffer (or is cancelled after a grace period to save cost, a product choice). When the tab comes back, the client reconnects with Last-Event-ID and the server replays from there; the finished reply is saved to the conversation either way.</p></div>
  <p><a href="#sd-llm-chat">Full case study →</a></p>
  <div data-videos="arch-llm-chat"></div>

  <h3>A9. Contended inventory: booking</h3>
  <p><b>Essence.</b> Many people compete for a finite set of specific things, and selling one twice is unforgivable.</p>
  <p><b>In costume.</b> Ticketmaster, Airbnb and hotels, flights, doctor appointments, restaurant reservations, flash sales and sneaker drops, limited class sign-ups, a coupon with 1,000 redemptions.</p>
  <p><b>What makes it hard.</b> (1) Never double-sell: the check and the claim must be one atomic conditional write on the source of truth (<code>UPDATE … WHERE status = 'available'</code>), with holds that expire. (2) Surges: 2 million people for 50,000 seats, so a waiting room admits people at a rate the system can serve, and the seat map is a cached, slightly stale hint.</p>
  <p><b>Transfers to cousins.</b> A driver can't be dispatched to two riders (location, B1), a balance can't be spent twice (payments, B4), a job can't be run by two workers (scheduler, B6): all are the same atomic "claim if still available" move. Holds with expiry are leases.</p>
  <div class="callout key"><span class="callout-label">Deep dive you'll get</span><p><b>"Why not a distributed lock per seat?"</b> A lock is a second system that can disagree with the database (a lock expires while the holder is paused, and two writers proceed). A conditional update on the row that is the truth needs no extra moving part and is correct by construction; the database is already the lock.</p></div>
  <p><a href="#sd-booking">Full case study →</a></p>
  <div data-videos="arch-booking"></div>

  <h3>A10. Collaborative state: many editors, one document</h3>
  <p><b>Essence.</b> Several people change the same structure at the same time, and everyone must converge on the same result without losing anyone's work.</p>
  <p><b>In costume.</b> Google Docs, Figma, Notion, Miro whiteboards, a shared code pad in a pairing interview, a live kanban board.</p>
  <p><b>What makes it hard.</b> (1) Merging concurrent edits: send operations, not whole documents, and either transform them against each other (OT, with a central server ordering ops) or use data structures that merge automatically (CRDTs, better for offline and peer-to-peer). (2) One owner node per document orders operations; failover must not lose or reorder acked ops.</p>
  <p><b>Transfers to cousins.</b> Figma-style apps often use simpler rules per property (last writer wins on "this shape's color") because objects are independent; text needs the heavier machinery. "One owner per hot object" also shows up in chat (per conversation) and game servers (per match).</p>
  <div class="callout key"><span class="callout-label">Deep dive you'll get</span><p><b>"Alice edits offline for 20 minutes. What happens on reconnect?"</b> Her client sends its queued operations tagged with the last server version it saw; the server transforms them against everything committed since (OT) or merges them (CRDT). Both sides converge. For long offline periods CRDTs are the safer choice, which is why offline-first apps favor them.</p></div>
  <p><a href="#sd-collab">Full case study →</a></p>
  <div data-videos="arch-collab"></div>

  <p>One more case study in the course, the <a href="#sd-classroom">K-12 learning platform</a>, isn't an archetype of its own. It's a mix: multi-tenant auth, rostering pipelines, a scheduled-traffic spike and reporting (counting). That's typical of "design our product" questions.</p>

  <h2>4. Part B: how to read the next ten sections</h2>
  <p>These ten archetypes don't have their own case study yet, so each gets more depth here, always in the same order: <b>essence</b>, <b>requirements that matter</b>, <b>numbers</b> worked step by step, <b>core components</b> (usually with a diagram), the <b>nuances</b> that make it hard, <b>trade-offs</b>, the <b>deep-dive questions</b> with strong answers, and two callouts. The numbers are rough on purpose: the point is the order of magnitude and what it forces you to do.</p>

  <h2>5. B1 · Location: nearby drivers and places</h2>
  <p><b>Essence.</b> Answer "what's near this point?" fast. In the hard version (Uber, Lyft, DoorDash couriers) the things being searched move every few seconds, so the index is rewritten constantly. In the easy version (Yelp, "stores near me") the places rarely move and it's a read-heavy search problem.</p>
  <h3>Requirements that matter</h3>
  <ul>
    <li>Riders see nearby cars on a map and request a ride; the system offers the ride to a good driver within a few seconds.</li>
    <li>Drivers send their location every ~4 seconds while online. Positions may be a few seconds stale; that's fine.</li>
    <li>A driver must never be dispatched to two riders at once.</li>
    <li>Ask: static places or moving entities? One city or global? Is "near" straight-line distance or driving time?</li>
  </ul>
  <h3>Numbers</h3>
  <div class="trace">
    <ol>
      <li><b>Location writes.</b> Say 1 million drivers online at peak worldwide, each pinging every 4 s: 1,000,000 / 4 = <b>250,000 writes/second</b>. This is the number that shapes the design.</li>
      <li><b>Size of the live index.</b> Each driver's current position is ~100 bytes (driver ID, lat, lng, cell, timestamp, status). 1 M × 100 B = <b>100 MB</b>. The whole live index fits in the memory of one machine. Size is not the problem; churn is.</li>
      <li><b>Searches.</b> 20 million rides/day is ~230 ride requests/s on average, maybe 1,000/s at peak. But riders opening the app and watching cars on the map are more like 10–20× that: <b>~10,000–20,000 nearby queries/s</b>.</li>
      <li><b>History.</b> If you keep every ping for trip receipts and ETA models: 250,000 × 100 B = 25 MB/s ≈ <b>2 TB/day</b>. That goes to a log and cheap storage, never into the live index.</li>
    </ol>
  </div>
  <h3>Core components</h3>
  <p>The core trick is to turn 2D "near" into 1D "same bucket". A <b>geohash</b> encodes a latitude/longitude as a short string by repeatedly halving the world: each extra character splits a cell into 32 smaller ones, and points that share a prefix are in the same cell. So "drivers near me" becomes "drivers whose geohash starts with 9q9hv", which any key-value store or sorted set can answer.</p>

  <h3>The nuances</h3>
  <p><b>1. Choosing the spatial index.</b> Three families, intuition only:</p>
  <ul>
    <li><b>Geohash</b>: a fixed grid of rectangles with string prefixes. Simple and fits any key-value store (Redis's <code>GEOADD</code>/<code>GEOSEARCH</code> store geohash-based scores in a sorted set). Weakness: cells are the same size in Manhattan and in the desert, and neighbours across a boundary have unrelated prefixes.</li>
    <li><b>Quadtree</b>: start with one square; split any square holding more than, say, 100 points into four. Dense downtown gets tiny cells, empty areas stay big. Great for static places (Yelp). Awkward for moving drivers, because constant inserts and deletes keep forcing splits and merges.</li>
    <li><b>S2 (Google) and H3 (Uber)</b>: hierarchical cells over the whole sphere. S2 projects the earth onto a cube and numbers cells along a space-filling curve; H3 uses hexagons at 16 resolutions. Hexagons have the nice property that all 6 neighbours are the same distance away, which is why Uber uses H3 for things like surge-pricing zones.</li>
  </ul>
  <p><b>2. The write volume.</b> 250,000 updates/s into a disk database with secondary indexes would be painful and pointless: a position is worthless after 10 seconds. So the live index lives in memory, is sharded by region (a ping from Chicago only touches the Chicago shard), and entries expire if a driver goes silent for ~30 s. If a shard crashes, it rebuilds itself within one ping interval because every driver resends within 4 seconds. That is a lovely property to say out loud: <i>the state is self-healing because it's continuously re-sent</i>.</p>
  <p><b>3. Matching is a booking problem.</b> Search the rider's cell and neighbours, rank candidates by estimated driving time (road network, not straight line: a driver 300 m away across a river may be 10 minutes out), then offer to the best driver. The offer must claim the driver atomically: <code>UPDATE drivers SET status='offered', ride=42 WHERE id=7 AND status='available'</code>. If the driver doesn't accept within ~15 s, release and offer to the next one.</p>
  <h3>Trade-offs</h3>
  <ul>
    <li>A <b>fixed grid (geohash/H3)</b> gives you O(1) cell updates and trivial sharding at the cost of uneven cell occupancy; choose it when entities move constantly.</li>
    <li>A <b>quadtree</b> gives you cells that adapt to density at the cost of rebalancing work on every insert; choose it for mostly static places.</li>
    <li><b>Pinging every 4 s instead of every 1 s</b> gives you 4× less write load at the cost of positions up to 4 s stale (about 50 m at city speeds); choose it unless you're doing turn-by-turn navigation.</li>
  </ul>
  <h3>Deep-dive questions</h3>
  <p><b>"A concert ends and 30,000 people request rides from one stadium."</b> One cell becomes a hot key. Use finer cells there (a longer geohash or higher H3 resolution), so the load spreads across more keys, and batch matching: instead of greedily matching each request as it arrives, collect requests for a second or two and solve the assignment for the batch, which gives better overall pickup times.</p>
  <p><b>"How do you show cars moving smoothly on the rider's map?"</b> The rider subscribes (WebSocket) to updates for the cells around them; the server pushes positions every few seconds and the client animates between points. You don't query the index for each frame.</p>
  <p><b>"How is Yelp different?"</b> Places don't move, so writes are rare and you can precompute: a quadtree or geohash index built offline, cached heavily, combined with a search index for text ("vegan ramen") and ranking by distance, rating and open hours. It's a read-heavy search problem with a spatial filter.</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"One million drivers pinging every 4 seconds is 250,000 writes a second, but the live state is only about 100 MB, so I keep it in memory, sharded by city, keyed by geohash or H3 cell, with entries expiring after 30 seconds. A nearby search reads the rider's cell plus its 8 neighbours and filters by distance. Every ping also goes to Kafka for history. Dispatch is a compare-and-set on the driver's status, so one driver can never get two rides."</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Storing driver locations in a SQL table and querying <code>WHERE lat BETWEEN … AND lng BETWEEN …</code>. A normal index helps with one dimension only, so the database scans a whole stripe of the map, and you're rewriting that table 250,000 times a second. Name a spatial index and keep the live data in memory.</p></div>

  <h2>6. B2 · Video: upload, transcode, stream</h2>
  <p><b>Essence.</b> Turn one uploaded file into many versions that play smoothly on any device and any connection, and deliver an enormous number of bytes cheaply. The CDN isn't an optimization here; it is most of the system.</p>
  <h3>Requirements that matter</h3>
  <ul>
    <li>Creators upload large files (hundreds of MB to tens of GB); videos become watchable within minutes.</li>
    <li>Playback starts fast (under ~2 s) and doesn't stall when the viewer's bandwidth drops.</li>
    <li>Ask: video on demand (YouTube, Netflix) or live (Twitch)? Netflix has a small catalogue watched heavily; YouTube has a huge long tail.</li>
  </ul>
  <h3>Numbers</h3>
  <div class="trace">
    <ol>
      <li><b>Uploads.</b> YouTube reportedly receives on the order of 500 hours of video per minute. Use a smaller example: 100,000 uploads/day averaging 10 minutes. At 1080p (~5–10 Mbps), 10 minutes is roughly 0.5–1 GB raw: <b>~50–100 TB/day of raw uploads</b>.</li>
      <li><b>Renditions.</b> A typical bitrate ladder is 240p, 360p, 480p, 720p, 1080p at roughly 0.4, 0.8, 1.5, 3 and 6 Mbps: about 12 Mbps in total, so all renditions together are about the size of the original again, more if you also encode a second codec.</li>
      <li><b>Transcoding.</b> Encoding is CPU-heavy: one machine may encode 1080p at around real time. A 10-minute video encoded serially takes ~10 minutes per rendition. Split it into 10-second chunks and encode 60 chunks × 5 renditions = 300 small jobs in parallel: done in about a minute.</li>
      <li><b>Egress.</b> 5 million concurrent viewers × 3 Mbps average = <b>15 Tbps</b>. No origin serves that. It must come from CDN edges close to viewers, ideally inside ISPs.</li>
    </ol>
  </div>

  <p>The upload itself is A6 (presigned, multipart, resumable). An object-created event starts an <b>orchestrator</b> that runs a <b>DAG</b> (directed acyclic graph: jobs with dependencies): probe the file, split into chunks, transcode each chunk into each rendition, then package; in parallel run side jobs like thumbnails, captions (speech-to-text) and safety/copyright checks. Each job is idempotent and retried on its own, so one failed chunk doesn't redo the whole video.</p>
  <h3>The nuances</h3>
  <p><b>1. Adaptive bitrate (ABR).</b> The video isn't served as one file. The <b>packager</b> cuts every rendition into segments of 2–6 seconds and writes a <b>manifest</b> listing them (HLS uses <code>.m3u8</code> playlists, DASH uses an MPD file). The player downloads the manifest, starts with a low rendition to begin quickly, measures download speed and buffer, and switches rendition at the next segment boundary. Your train enters a tunnel: the player drops to 360p for a few segments instead of freezing. All of the intelligence is in the client; the server just serves static files.</p>
  <p><b>2. The CDN is the system.</b> Segments are immutable static files, the perfect thing to cache. Popular videos are served almost entirely from edge caches; Netflix goes further with its Open Connect appliances placed inside ISPs and filled overnight with what it predicts people will watch. The long tail (millions of videos with a few views each) is the hard part: those requests miss the edge and hit regional caches or origin, so you tier the storage and accept a slower first start for rare videos.</p>
  <p><b>3. Cost decides encoding.</b> Better codecs (VP9, AV1) cut bandwidth meaningfully at the same quality but cost much more CPU to encode. Spend that CPU only where it pays back: encode everything in H.264 first, and re-encode a video in AV1 once it becomes popular.</p>
  <h3>Trade-offs</h3>
  <ul>
    <li><b>Short segments (2 s)</b> give you faster quality switches and lower live latency at the cost of more requests and slightly worse compression; choose them for live. <b>Longer segments (6 s)</b> suit on-demand.</li>
    <li><b>Transcoding every rendition at upload</b> gives you instant playback at any quality at the cost of storage for videos nobody watches; choose it for the common renditions, and generate rare ones (4K, extra codecs) only for popular videos.</li>
  </ul>
  <h3>Deep-dive questions</h3>
  <p><b>"How is live streaming different?"</b> There's no time to transcode the whole file: the streamer sends a continuous stream (often RTMP or WebRTC), transcoders encode it in real time, and the packager publishes each new segment as it's ready. Latency is roughly segment length × the few segments the player buffers, so classic HLS lags 10–30 s; low-latency variants use smaller partial segments to get to a few seconds. Chat alongside the stream is A3.</p>
  <p><b>"How do you count views?"</b> Not with <code>UPDATE videos SET views = views + 1</code>: a viral video gets thousands of views a second on one row. Players send view events to a log and a stream job aggregates them, which is the counting archetype (B3).</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"I'll treat upload, processing and delivery as three systems. Upload is resumable and direct to object storage. Processing is a DAG of idempotent jobs: split into 10-second chunks and transcode chunk × rendition in parallel, so a 10-minute video is ready in about a minute. Delivery is HLS or DASH segments with adaptive bitrate on the client and a CDN in front, because 5 million viewers at 3 Mbps is 15 terabits a second and no origin can serve that."</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Serving the original MP4 from your servers, or describing "streaming" as a long-lived connection pushing video. Modern video delivery is plain HTTP requests for small static segment files, which is exactly why CDNs can cache it. Say "segments, manifest, adaptive bitrate, CDN".</p></div>
  <div data-videos="arch-video"></div>

  <h2>7. B3 · Counting: views, likes, trending, ad clicks</h2>
  <p><b>Essence.</b> Count huge numbers of small events, often concentrated on a few keys, and serve the totals fast. The nuance is that different counts deserve different accuracy: a like count can be approximate, an advertiser's invoice cannot.</p>
  <h3>Requirements that matter</h3>
  <ul>
    <li>Ask what is counted and who reads it: a public view count (approximate, a few seconds stale is fine), a "top 10 trending" list (approximate), unique visitors (approximate is standard), clicks you bill for (exact, auditable).</li>
    <li>Ask about time windows: all time, per minute, last hour, "trending now".</li>
  </ul>
  <h3>Numbers</h3>
  <div class="trace">
    <ol>
      <li><b>Ad clicks.</b> 1 billion clicks/day ÷ 86,400 s ≈ <b>11,600/s</b> average, peaks of maybe 50,000/s.</li>
      <li><b>Raw storage.</b> ~200 bytes per click event (click ID, ad ID, user, time, IP, device) × 1 B = <b>200 GB/day</b>. Keep it: it's the evidence for billing disputes.</li>
      <li><b>The hot key.</b> A viral video can take 50,000 views/s on one counter. A single database row handles maybe a few thousand updates a second before lock contention bites, and the whole load lands on one shard.</li>
      <li><b>After aggregation.</b> Counting per ad per minute collapses 50,000 events/s into one row per active ad per minute. If 500,000 ads get at least one click in a minute, that's ~8,000 row writes/s, spread over many keys.</li>
    </ol>
  </div>

  <h3>The nuances</h3>
  <p><b>1. Never increment one row per event.</b> Three tools, from simple to heavy:</p>
  <ul>
    <li><b>Batch in memory.</b> Each app server keeps a local map <code>{video_id: +n}</code> and flushes every 1–5 s. 50,000 views/s across 50 servers becomes 50 writes/s. Cost: a crash loses a few seconds of counts. Fine for views and likes.</li>
    <li><b>Sharded counters.</b> Store the counter as N sub-rows (<code>views:v42:0</code> … <code>views:v42:15</code>); each increment picks one at random; a read sums all N. Spreads one hot key over 16.</li>
    <li><b>Stream processing.</b> Events go to a log (Kafka, partitioned by ad ID); a stream processor (Flink, Spark Streaming, Kafka Streams) aggregates in <b>windows</b>, e.g. tumbling one-minute windows, and writes one row per key per window to an analytics (OLAP) store such as ClickHouse, Druid or Pinot. Events that arrive late (a phone was offline) are handled with a <b>watermark</b>: "wait up to N minutes for stragglers, then close the window".</li>
  </ul>
  <p><b>2. Top-K and trending.</b> For a leaderboard, a Redis <b>sorted set</b> is the tool: <code>ZINCRBY</code> to add points, <code>ZREVRANGE</code> for the top 10, <code>ZREVRANK</code> for "your rank" (exactly what <a href="#sd-framework">the framework lesson's</a> reading leaderboard used). "Trending" is not "most views": it's views in the last window compared with the usual rate, so a cat video with a steady 1 M/day doesn't trend but a new clip jumping from 100 to 50,000/hour does.</p>
  <p><b>3. Approximate counting, on purpose.</b> When exact answers would need enormous memory, sketches trade a small, known error for tiny memory:</p>
  <ul>
    <li><b>HyperLogLog</b> counts unique items (distinct visitors). Intuition: hash each visitor; in random hashes, a run of k leading zeros shows up about once in 2<sup>k</sup> items, so the longest run you've seen hints at how many distinct items there were. Average many such estimates and the error shrinks. Redis's HyperLogLog uses at most 12 KB per counter with about 0.81% standard error, whether you've seen a thousand visitors or a billion. An exact set of a billion user IDs would take gigabytes.</li>
    <li><b>Count-min sketch</b> estimates how often each item appears in a stream (heavy hitters, trending hashtags) using a small grid of counters and a few hash functions. It can overestimate (collisions add) but never underestimates, and its memory doesn't grow with the number of distinct items.</li>
  </ul>
  <p><b>4. Exactly-once-ish for billing.</b> Networks retry, so the same click can arrive twice. Give each click a unique ID at the source and dedupe on it within a window; use a stream processor that checkpoints state and output together so a crash replays from the last checkpoint without double counting. Then, because the bill is money, run a nightly batch job that recounts from the raw archive. The batch number is the number of record; the streaming number is for dashboards. Large ad systems run both paths for this reason.</p>
  <h3>Trade-offs</h3>
  <ul>
    <li><b>Batching in memory</b> gives you 1,000× fewer writes at the cost of losing a few seconds of counts on a crash; choose it for likes and views.</li>
    <li><b>Approximate sketches</b> give you fixed, tiny memory at the cost of ~1% error; choose them for unique counts and trending, never for invoices.</li>
    <li><b>Streaming plus batch</b> gives you fresh dashboards and exact bills at the cost of running and reconciling two pipelines; choose it when money depends on the count.</li>
  </ul>
  <h3>Deep-dive questions</h3>
  <p><b>"The stream job crashes. Do you double-count?"</b> It restarts from its last checkpoint, which stored both its Kafka offsets and its partial window state; output writes are keyed by (ad, window) as upserts, so replaying a minute overwrites the same row instead of adding to it. Idempotent output plus checkpointed input is how you get effectively-once.</p>
  <p><b>"How do you filter fraud clicks?"</b> Before counting for billing: dedupe by click ID, drop clicks from known bots and data-center IPs, and cap clicks per user per ad per window. The raw archive lets you re-run billing if a fraud rule changes.</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"First I'd ask how exact each count must be. Views and likes are batched in memory and flushed every few seconds. Unique viewers use HyperLogLog, 12 KB each with under 1% error. Ad clicks go to Kafka, a stream job counts them per ad per minute for dashboards, and a nightly batch recount from the raw archive is what we bill on, so a streaming bug can never overcharge anyone."</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p><code>UPDATE posts SET likes = likes + 1</code> per event. It works in the demo, then a viral post makes that one row the hottest lock in the database. And the opposite mistake: proposing approximate counting for billing. Match the tool to the accuracy the number needs.</p></div>

  <h2>8. B4 · Payments: wallets and ledgers</h2>
  <p><b>Essence.</b> Move money between accounts without ever creating or destroying any, even when calls to banks time out, clients retry and servers crash halfway. Scale is modest; correctness is everything.</p>
  <h3>Requirements that matter</h3>
  <ul>
    <li>Users top up a wallet with a card, pay each other, and withdraw. Every cent is accounted for, forever.</li>
    <li>Retries never double-charge. An unclear outcome is resolved, not guessed.</li>
    <li>A full audit trail: who moved what, when, and why. Nothing is ever edited or deleted.</li>
  </ul>
  <h3>Numbers</h3>
  <div class="trace">
    <ol>
      <li><b>Throughput.</b> 10 million payments/day ÷ 86,400 ≈ <b>115/s</b> average, maybe 1,000/s at peak. A single well-tuned relational primary handles this. This is not a scale problem.</li>
      <li><b>Ledger rows.</b> Each payment writes ~2–4 ledger entries (plus fees): 10 M × 4 × ~200 B ≈ <b>8 GB/day</b>, ~3 TB/year. Big but boring; partition by month.</li>
      <li><b>The real numbers.</b> PSP (payment service provider: Stripe, Adyen, Braintree) calls take hundreds of ms to seconds, and a small fraction time out with an unknown outcome. At 10 M/day, even 0.1% unknown is 10,000 payments a day you must resolve correctly.</li>
    </ol>
  </div>
  <h3>Core components</h3>
  <p>The heart is a <b>double-entry ledger</b>: every movement of money is recorded as entries that sum to zero. Alice pays Bob $20:</p>
  <table class="tbl">
    <thead><tr><th>txn_id</th><th>account</th><th>amount (cents)</th></tr></thead>
    <tbody>
      <tr><td>t_501</td><td>wallet:alice</td><td>−2,000</td></tr>
      <tr><td>t_501</td><td>wallet:bob</td><td>+2,000</td></tr>
    </tbody>
  </table>
  <p>Alice tops up $50 by card: <code>card_clearing</code> −5,000 (money the PSP owes us), <code>wallet:alice</code> +5,000. The sum of every transaction is zero, so money can only move, never appear. A balance is the sum of an account's entries (often cached in a balances table updated <i>in the same database transaction</i>). Amounts are integers in the smallest unit (cents), never floating point: 0.1 + 0.2 is not 0.3 in floating point.</p>

  <h3>The nuances</h3>
  <p><b>1. Idempotency keys end to end.</b> The client generates a key per payment attempt (<code>Idempotency-Key: 7f3a…</code>) and reuses it on retry. The server stores key → result in the same transaction as the ledger entries; a retry with the same key returns the stored result instead of paying again. And when the server calls the PSP, it passes <i>its own</i> idempotency key, so its retries don't double-charge either. (Stripe, for example, accepts an idempotency key header and remembers it for at least 24 hours.)</p>
  <p><b>2. The unknown outcome.</b> You call the PSP to charge $50 and the call times out. Did it charge? You don't know. Never assume. The payment sits in a <code>pending</code> state; you learn the truth from the PSP's webhook, or by querying the payment by your key, or by retrying with the same key (which returns the original result). Model it as a state machine: <code>created → pending → succeeded | failed</code>, with every transition recorded.</p>
  <p><b>3. Authorize, then capture.</b> Card payments are often two steps: <b>authorize</b> places a hold on the customer's card (the money is reserved, not moved), and <b>capture</b> actually takes it later, for example when the order ships or the ride ends. Holds expire (commonly around a week, varying by card network), so you capture or release in time. Uber authorizes an estimate when you request a ride and captures the final fare.</p>
  <p><b>4. Reconciliation.</b> Every day the PSP sends a settlement report of what actually moved. A reconciliation job matches it line by line against your ledger. Mismatches (a charge they have and you don't, an amount off by a fee) go to an exceptions queue for humans. This is how you find the bugs that idempotency didn't catch.</p>
  <p><b>5. Append-only audit trail.</b> Ledger entries are never updated or deleted. A mistake is fixed by a new <b>reversing entry</b>, so the history shows both the error and the correction.</p>
  <h3>Trade-offs</h3>
  <ul>
    <li>A <b>single relational database for the ledger</b> gives you ACID transactions across both sides of every transfer at the cost of a vertical scaling ceiling; choose it until you're truly huge, then shard by account with care (cross-shard transfers become sagas).</li>
    <li><b>Synchronous charge at checkout</b> gives the user an immediate answer at the cost of tying your latency to the PSP; <b>async with a pending state</b> is more robust when outcomes may be unknown. Most products do synchronous with an async fallback.</li>
  </ul>
  <h3>Deep-dive questions</h3>
  <p><b>"Your server crashes after the PSP charged the card but before you recorded it."</b> Write the payment row in <code>pending</code> with the idempotency key <i>before</i> calling the PSP. On restart, a sweeper finds old pending payments and asks the PSP for the status using that key; the webhook may arrive first anyway. Either way the ledger catches up, and nightly reconciliation is the final safety net.</p>
  <p><b>"How do you transfer between two services' databases?"</b> You can't have one transaction across them, so use a saga with the transactional outbox (<a href="#events">event-driven lesson</a>): debit and an outbox event in one transaction, the other side consumes it idempotently, and a failure triggers a compensating entry.</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"Payments are about a hundred per second, so scale isn't the issue; never losing or inventing money is. I'd use a double-entry ledger in one relational database with integer cents, append-only, corrections as reversing entries. Every request carries an idempotency key that's stored in the same transaction, and we pass our own key to the PSP. A timeout is an unknown, not a failure: the payment stays pending until a webhook or status query resolves it, and a daily reconciliation against the PSP's settlement file catches anything else."</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>A <code>balance</code> column updated with <code>balance = balance - 20</code> and no entries. When it's wrong (and one day it will be) you can't tell why. The second classic: treating a PSP timeout as a failure and letting the user retry with a new request, which charges them twice.</p></div>
  <div data-videos="arch-payments"></div>

  <h2>9. B5 · Web crawler</h2>
  <p><b>Essence.</b> Download a large part of the web, continuously, without hammering any single site, without fetching the same thing twice, and without getting stuck in infinite link mazes.</p>
  <h3>Requirements that matter</h3>
  <ul>
    <li>Crawl ~1 billion pages a month, storing the HTML for an indexer (search, AI training data, price monitoring).</li>
    <li><b>Politeness</b>: at most about one request per second per site (or what its <code>robots.txt</code> crawl-delay asks), and obey robots.txt rules.</li>
    <li>Re-crawl pages that change often more often. Survive worker crashes.</li>
  </ul>
  <h3>Numbers</h3>
  <div class="trace">
    <ol>
      <li><b>Fetch rate.</b> 1 B pages / 30 days ≈ 1,000,000,000 / 2,600,000 s ≈ <b>~400 pages/s</b>, so plan for ~1,000/s peak.</li>
      <li><b>Bandwidth.</b> ~100 KB per page × 400/s = 40 MB/s ≈ <b>320 Mbps</b>. Achievable with a modest fleet; the challenge is coordination, not bandwidth.</li>
      <li><b>Storage.</b> 1 B × 100 KB = <b>100 TB/month</b> raw, maybe 20–30 TB compressed. Object storage.</li>
      <li><b>The frontier.</b> The set of discovered-but-not-yet-crawled URLs grows far faster than you crawl: each page links to dozens more. 10 billion known URLs × ~100 bytes ≈ <b>1 TB</b>. It doesn't fit in memory, so it's disk-backed queues with in-memory buffers.</li>
      <li><b>Politeness math.</b> At 1 request/s per host, 400 pages/s means at least 400 different hosts in flight at any moment, really thousands, because most hosts have few pages queued.</li>
    </ol>
  </div>

  <h3>The nuances</h3>
  <p><b>1. The URL frontier is two layers of queues.</b> The classic design (from the Mercator crawler) separates <i>what's important</i> from <i>what's polite</i>. Front queues are by priority (a news homepage before a 2009 forum thread). Back queues are per host: each back queue holds URLs from exactly one host, and a min-heap records "the earliest time this host may be fetched again". A fetcher pops the host whose time has come, takes one URL, and after fetching pushes the host back with time = now + delay. Politeness is enforced by the data structure, not by hoping workers behave.</p>
  <p><b>2. Partition by host.</b> Distribute work across crawler nodes by <code>hash(hostname)</code>, so every URL for <code>example.com</code> goes to the same node. That node alone owns the host's queue, rate limit, robots.txt cache and DNS cache, with no cross-node coordination needed for politeness.</p>
  <p><b>3. Two kinds of dedupe.</b></p>
  <ul>
    <li><b>URL dedupe</b>: normalize first (lowercase the host, drop <code>#fragments</code>, remove default ports and tracking parameters like <code>utm_source</code>, sort query parameters), then check a "seen" set. At 10 B URLs a <b>Bloom filter</b> (a compact bit array that answers "definitely not seen" or "probably seen") fits in roughly 10–20 GB at a 1% false-positive rate; the cost is occasionally skipping a URL you never actually crawled, which is acceptable.</li>
    <li><b>Content dedupe</b>: different URLs often serve the same page (mirrors, <code>?sessionid=</code> variants). A hash of the content catches exact copies; a <b>SimHash</b>-style fingerprint catches near-duplicates (same article, different ads). A large fraction of the web, often estimated at a quarter or more, is duplicate or near-duplicate.</li>
  </ul>
  <p><b>4. Traps and robots.</b> A calendar page with a "next month" link generates infinite URLs. Defend with maximum depth, a cap on URLs per host, URL length limits, and detecting repeating path patterns. Fetch and cache each host's <code>robots.txt</code> (typically for about a day) before crawling it.</p>
  <p><b>5. Re-crawl scheduling.</b> Estimate each page's change rate from history: if it changed on 9 of the last 10 visits, come back sooner; if never, back off. Use conditional requests (<code>If-Modified-Since</code> or <code>ETag</code>): an unchanged page returns <code>304 Not Modified</code> with no body, which saves bandwidth for you and the site.</p>
  <h3>Trade-offs</h3>
  <ul>
    <li>A <b>Bloom filter</b> for seen URLs gives you ~10× less memory than an exact set at the cost of skipping ~1% of new URLs; choose it at web scale, an exact key-value store when completeness matters (crawling your own site).</li>
    <li><b>BFS by priority</b> gives you important pages first at the cost of reaching deep pages slowly; choose it for search. Focused crawlers (only product pages) use a classifier to prioritize instead.</li>
  </ul>
  <h3>Deep-dive questions</h3>
  <p><b>"A crawler node dies. What happens to its hosts?"</b> Frontier queues are persisted on disk (or in a durable log), so another node takes over that partition, reloads the queues and continues. URLs that were in flight are fetched again; that's harmless because storing a page is idempotent (keyed by URL and crawl time).</p>
  <p><b>"DNS is slow. Does that matter?"</b> Yes: a DNS lookup can take tens to hundreds of ms and public resolvers may throttle you. Each node runs a local caching resolver and resolves hosts ahead of when they're needed.</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"The scale is modest, about 400 pages a second. The hard parts are politeness, dedupe and traps. I'd partition by hostname so one node owns each host, and use a two-level frontier: priority queues feeding per-host queues with a heap of next-allowed-fetch times. URLs are normalized and checked against a Bloom filter; content is fingerprinted to skip duplicates. Depth and per-host caps stop traps, robots.txt is cached per host, and re-crawl frequency follows each page's observed change rate."</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>One big shared queue of URLs with many workers pulling from it. Popular sites have millions of links, so most of the queue is a few hosts, and 200 workers will fetch from the same site at once: you get blocked, or you take down a small site. Politeness has to be structural: per-host queues and per-host timing.</p></div>
  <div data-videos="arch-crawler"></div>

  <h2>10. B6 · Distributed job scheduler (cron at scale)</h2>
  <p><b>Essence.</b> Run millions of jobs at the right time ("every day at 9:00 in the user's time zone", "retry this webhook in 5 minutes", "send the reminder 3 days before the due date"), each one at least once, despite crashed machines, and without a stampede when everything is due at once.</p>
  <h3>Requirements that matter</h3>
  <ul>
    <li>One-off delayed jobs and recurring (cron-like) schedules, with time zones.</li>
    <li>A job fires within a few seconds of its time; it is never silently skipped; running it twice must be harmless.</li>
    <li>Clear policy for missed runs after an outage; pause, cancel, and see run history.</li>
  </ul>
  <h3>Numbers</h3>
  <div class="trace">
    <ol>
      <li><b>Volume.</b> 10 million active schedules (a reading app with daily reminders for every student, plus reports and retries). If they were spread evenly over the day: 10 M / 86,400 ≈ <b>115 jobs/s</b>. Trivial.</li>
      <li><b>The real shape.</b> People pick round times. If 2 million reminders are set for "9:00 local" in the Pacific time zone, they're all due in the same second: <b>2,000,000 jobs at 09:00:00</b>.</li>
      <li><b>What the workers can do.</b> If each reminder takes ~50 ms of work and you run 2,000 concurrent workers, that's 40,000 jobs/s, so the 9:00 burst drains in ~50 s. Fine for reminders, if the scheduler itself doesn't choke reading 2 million rows at once.</li>
      <li><b>Storage.</b> 10 M schedules × ~500 bytes = 5 GB. One relational database is plenty; run history is bigger and gets partitioned by date.</li>
    </ol>
  </div>

  <p>Separate <b>deciding when</b> from <b>doing the work</b>. The schedules table has <code>next_run_at</code> (in UTC) with an index. Pollers repeatedly claim due rows and put them on a work queue; ordinary queue workers execute them (the <a href="#queues">queues lesson</a> covers acks and retries). Claiming in Postgres looks like this:</p>
  <pre><code class="lang-sql">UPDATE schedules SET lease_owner = 'poller-3', lease_until = now() + interval '60 seconds'
WHERE id IN (
  SELECT id FROM schedules
  WHERE next_run_at &lt;= now() AND (lease_until IS NULL OR lease_until &lt; now())
  ORDER BY next_run_at LIMIT 500
  FOR UPDATE SKIP LOCKED      -- other pollers skip rows this one is claiming
)
RETURNING id, payload, next_run_at;</code></pre>
  <p>For short delays, a <b>delay queue</b> is simpler: a Redis sorted set scored by due time (poll with <code>ZRANGEBYSCORE</code>), or a queue with built-in delays (Amazon SQS allows delays up to 15 minutes). Long-range schedules live in the database; the database feeds the delay queue as their time approaches.</p>
  <h3>The nuances</h3>
  <p><b>1. Leases, not locks; at-least-once, not exactly-once.</b> A poller or worker can die after claiming a job. The lease expires, the job becomes due again, and someone else runs it. So a job can run twice, and every job must be <b>idempotent</b>. The standard trick: a <b>run ID</b> = <code>job_id + scheduled_time</code> (e.g. <code>reminder:alice:2026-10-19T09:00</code>), stored with a unique constraint in run history and passed downstream as an idempotency key, so the email service drops the second "run" of the same reminder.</p>
  <p><b>2. Missed runs.</b> The scheduler was down from 08:00 to 10:00. What about the 9:00 jobs? There's no universal answer, so make it a per-job policy: <b>fire once</b> (coalesce: send one daily report, not two), <b>catch up</b> (run every missed occurrence, right for billing jobs), or <b>skip</b> (a "good morning" push at 10:30 is pointless). Compute the next run from the schedule, not from "now + 24 h", or jobs slowly drift later after every delay.</p>
  <p><b>3. Time zones and DST.</b> Store the time zone name (<code>America/Los_Angeles</code>), not an offset (<code>-07:00</code>), because the offset changes twice a year. On the spring-forward day in the US, 2:30am doesn't exist; on the fall-back day, 1:30am happens twice. Pick and document a rule (run at the next valid time; run once on the first occurrence). Then convert to UTC for <code>next_run_at</code>.</p>
  <p><b>4. Thundering herds.</b> Add small jitter to non-urgent jobs ("9:00 ± 2 minutes"), give urgent jobs a separate queue, and let pollers claim in batches so the 9:00 burst is a few thousand queries, not two million.</p>
  <h3>Trade-offs</h3>
  <ul>
    <li><b>Database polling with SKIP LOCKED</b> gives you durability, easy querying and no new infrastructure at the cost of polling load and a throughput ceiling (often thousands to tens of thousands of claims/s); choose it for most products.</li>
    <li>A <b>single leader</b> (elected via a lease, see <a href="#consensus">consensus</a>) gives you simple reasoning about who fires what at the cost of a failover pause; <b>partitioned pollers</b> (each owns <code>hash(job_id) mod N</code>) scale out at the cost of rebalancing logic.</li>
  </ul>
  <h3>Deep-dive questions</h3>
  <p><b>"How do you guarantee a job runs exactly once?"</b> You can't, end to end: a worker can finish the work and crash before recording it. You get at-least-once from leases and effectively-once from idempotency: the run ID makes the second execution a no-op wherever it matters.</p>
  <p><b>"A job runs for 2 hours but the lease is 60 seconds."</b> The worker renews (heartbeats) its lease while it runs; if it dies, renewals stop and the lease expires. Long jobs should also checkpoint progress so a retry resumes rather than restarts.</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"I'd split deciding when from doing the work. Schedules live in a database with a UTC next_run_at index and the IANA time zone; pollers claim due rows with a lease using SKIP LOCKED and hand them to a normal work queue. Delivery is at-least-once, so every run has an ID of job plus scheduled time that downstream services use as an idempotency key. Each job declares a missed-run policy, and I jitter the round-hour herd."</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>"Each server runs cron." With three servers, every job runs three times; with one server, it's a single point of failure. The other classic is a scheduler that sleeps in memory until a job is due: a restart forgets everything. Schedules must be durable, and claims must be leases.</p></div>
  <div data-videos="arch-scheduler"></div>

  <h2>11. B7 · Metrics, logging and monitoring</h2>
  <p><b>Essence.</b> Ingest a firehose of tiny timestamped numbers (and a larger river of log lines), store them cheaply, answer "what happened in the last hour?" in a second, and wake someone up when something breaks. Writes vastly outnumber reads, and most data is never read.</p>
  <h3>Requirements that matter</h3>
  <ul>
    <li>Metrics like <code>http_requests_total{service="checkout", status="500"}</code> from every host, every 10 seconds.</li>
    <li>Dashboards over the last hour load in about a second; queries over a year are allowed to be coarser.</li>
    <li>Alerts fire within a minute or two of a problem, and don't flap.</li>
    <li>The monitoring system must keep working when the systems it watches are failing.</li>
  </ul>
  <h3>Numbers</h3>
  <div class="trace">
    <ol>
      <li><b>Series.</b> A <b>time series</b> is one metric name plus one exact combination of labels. 10,000 hosts × 1,000 series each = <b>10 million active series</b>.</li>
      <li><b>Ingest.</b> One sample per series every 10 s: 10 M / 10 = <b>1 million samples/s</b>.</li>
      <li><b>Raw size.</b> A sample is a timestamp (8 bytes) + a value (8 bytes) = 16 bytes. 1 M/s × 16 B × 86,400 ≈ <b>1.4 TB/day</b> uncompressed.</li>
      <li><b>Compressed.</b> Consecutive timestamps are evenly spaced and consecutive values are similar, so you store tiny differences. Facebook's Gorilla paper reported about 1.37 bytes per sample: ≈ <b>120 GB/day</b>, more than 10× smaller.</li>
      <li><b>Retention.</b> Keeping raw 10 s data for a year would be ~44 TB. With rollups (below), a year costs a small fraction of that.</li>
    </ol>
  </div>
  <h3>Core components</h3>
  <p>Agents on each host batch samples (or a server scrapes them: Prometheus <i>pulls</i>, Datadog's agent <i>pushes</i>) → a buffer such as Kafka to absorb bursts → <b>ingesters</b> sharded by series ID, which keep recent data in memory and write compressed blocks (Prometheus cuts a block every 2 hours) → object storage for old blocks → a query layer that fans out to ingesters and storage and merges results. An <b>inverted index</b> from label values to series IDs answers "all series where <code>service="checkout"</code>". A rule evaluator runs alert queries every 30–60 s.</p>
  <h3>The nuances</h3>
  <p><b>1. Cardinality explosions.</b> The number of series is the product of label values. <code>status</code> (10 values) × <code>endpoint</code> (200) × <code>host</code> (10,000) is already 20 million possible series. Now an engineer adds <code>user_id</code> with 5 million users. Every active series costs memory in the index (roughly kilobytes each in many systems), so this one label can multiply memory by orders of magnitude and take the cluster down. Rule: labels must have bounded values; per-user detail belongs in logs or traces, not metric labels. Real systems enforce per-tenant series limits.</p>
  <p><b>2. Rollups and retention tiers.</b> Nobody needs 10-second resolution from last March.</p>
  <table class="tbl">
    <thead><tr><th>Tier</th><th>Resolution</th><th>Kept for</th><th>Used for</th></tr></thead>
    <tbody>
      <tr><td>Raw</td><td>10 s</td><td>~15 days</td><td>Debugging today's incident</td></tr>
      <tr><td>Rollup 1</td><td>1 min</td><td>~90 days</td><td>Weekly reviews, comparisons</td></tr>
      <tr><td>Rollup 2</td><td>1 h</td><td>1–2 years</td><td>Capacity planning, trends</td></tr>
    </tbody>
  </table>
  <p>Store <b>min, max, sum and count</b> per rollup bucket, not just the average: averages of averages are wrong, and max is what shows the spike. Percentiles are trickier: you can't average two p99s. Record <b>histograms</b> (counts per latency bucket), which can be added together, and compute percentiles from the merged buckets.</p>
  <p><b>3. Logs are a different beast.</b> Log volume in bytes is often 10–100× metrics. Full-text indexing everything (Elasticsearch-style) is powerful but expensive; indexing only labels and scanning compressed chunks on query (the Grafana Loki approach) is much cheaper but slower to search. Tier logs: hot on SSD for days, then object storage for months; sample or drop debug logs.</p>
  <p><b>4. Alerting that people trust.</b> Alert on symptoms users feel (error rate, latency) rather than causes (CPU at 80%), require the condition to hold for a few minutes before firing, and group related alerts so one outage is one page. Alerting on SLO burn rate is the mature version (see <a href="#reliability">reliability</a>). And watch the watcher: an always-firing "heartbeat" alert whose <i>absence</i> pages someone tells you the monitoring pipeline itself is down.</p>
  <h3>Trade-offs</h3>
  <ul>
    <li><b>Pull (scraping)</b> gives you an automatic "is this target up?" signal and central control of rate at the cost of needing to reach every target; <b>push</b> works through firewalls and for short-lived jobs at the cost of clients being able to flood you. Choose pull inside your own network, push for edge devices and batch jobs.</li>
    <li><b>Full-text indexed logs</b> give you fast arbitrary search at the cost of large index storage; choose them for security and audit logs, label-only indexing for high-volume app logs.</li>
  </ul>
  <h3>Deep-dive questions</h3>
  <p><b>"One team's deploy suddenly creates 3 million new series. What happens?"</b> Ingesters enforce per-tenant limits on active series and new series per minute; over the limit, new series are rejected with an error that names the offending metric and label, so the rest of the company keeps its monitoring.</p>
  <p><b>"Why is a dashboard over 30 days slow?"</b> It's reading raw 10 s data: 259,200 points per series. Route long-range queries to the 1-minute or 1-hour rollups automatically, and cache query results for recent fixed time ranges.</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"Ten million series at one sample per 10 seconds is a million writes a second, about 1.4 TB a day raw but ~120 GB with delta compression. Ingesters are sharded by series and buffered behind Kafka; recent data in memory, old blocks in object storage, rollups at 1 minute and 1 hour with min, max, sum and count, and histograms for percentiles. The scaling risk isn't samples, it's cardinality, so I'd enforce bounded labels and per-tenant series limits."</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Storing metrics as rows in a general-purpose database (<code>INSERT INTO metrics(name, tags, ts, value)</code>), one row per sample. A million inserts a second with indexes, no compression and no rollups will cost 10–20× more storage and fall over. Name a time-series store and say why: append-only, compressed, time-partitioned.</p></div>
  <div data-videos="arch-metrics"></div>

  <h2>12. B8 · Code execution sandbox (online judge)</h2>
  <p><b>Essence.</b> Run code written by strangers on your machines, safely, fairly and fast. Every submission should be treated as an attack, because some of them will be.</p>
  <p>This is the archetype behind LeetCode, HackerRank, CodeSignal, Replit, Jupyter-style notebooks, AI agents that run code, and your own CollabSignal.</p>
  <h3>Requirements that matter</h3>
  <ul>
    <li>Users click <b>Run</b> (a few sample tests, wants an answer in ~1–2 s) or <b>Submit</b> (all hidden tests, a few seconds is fine). Several languages.</li>
    <li>Results stream back test by test. Verdicts are fair: the same code gets the same verdict.</li>
    <li>No submission can read another user's code, reach the network, harm the host or run forever.</li>
  </ul>
  <h3>Numbers</h3>
  <div class="trace">
    <ol>
      <li><b>A contest.</b> 20,000 people in a 90-minute contest, each pressing Run or Submit about every 2 minutes at the peak: 20,000 / 120 ≈ <b>170 executions/s</b>.</li>
      <li><b>CPU per execution.</b> Compile plus ~30 tests ≈ 2–3 CPU-seconds. 170/s × 2.5 s ≈ <b>~425 cores busy</b> at peak. With 64-core hosts and headroom: ~10 hosts. Small fleet, as long as you can add more for contests.</li>
      <li><b>Memory.</b> Cap each run at 256 MB; a microVM adds only a few MB of overhead on top. 64 concurrent runs per host ≈ 16 GB. CPU is the binding limit, not memory.</li>
      <li><b>Startup.</b> A fresh container takes roughly hundreds of ms to start; a Firecracker microVM boots in roughly 125 ms; a pre-booted warm pool hands out a sandbox in a few ms. At 170/s, startup time is a big part of perceived latency, so keep a warm pool.</li>
    </ol>
  </div>

  <h3>The nuances</h3>
  <p><b>1. Isolation strength.</b> Layers, weakest to strongest:</p>
  <ul>
    <li><b>Language-level sandboxes</b> (restricting <code>import os</code>): easy to escape. Not a security boundary.</li>
    <li><b>Containers</b> (Linux namespaces + cgroups + seccomp syscall filters): processes see their own filesystem and process list, but every container shares the host's kernel. A kernel bug can let code escape. Fine for your own trusted code; risky for strangers' code.</li>
    <li><b>gVisor</b> (Google): a user-space kernel that intercepts the sandboxed program's system calls, so it barely touches the real kernel. Stronger, with some performance cost.</li>
    <li><b>MicroVMs</b> like <b>Firecracker</b> (built by AWS; it runs Lambda): each run gets its own tiny virtual machine with its own kernel, protected by hardware virtualization, yet boots in ~125 ms with a few MB of overhead. The standard choice for multi-tenant untrusted code today.</li>
  </ul>
  <p><b>2. Limits for every resource.</b> CPU time (2 s) <i>and</i> wall-clock time (10 s), because <code>sleep(1000)</code> uses no CPU; memory (256 MB); process count (a fork bomb spawns processes until the machine dies; cap at ~64); disk (a small temporary filesystem); output size (a 1 MB cap stops <code>while(true) print</code>); no network, or egress only through an allowlisting proxy (for package installs); a read-only root filesystem; a non-root user. Then <b>never reuse a sandbox</b> across users: destroy it, or restore it from a clean snapshot.</p>
  <p><b>3. Fair verdicts.</b> Measure CPU time, not wall time, so a busy neighbour doesn't make your solution "too slow"; pin runs to dedicated cores; re-run submissions that land within ~10% of the time limit. Compare outputs with a checker that tolerates trailing whitespace and floating-point error where appropriate.</p>
  <p><b>4. Queueing and streaming.</b> Two priorities: interactive Run ahead of Submit, and per-user rate limits so one person spamming Submit can't starve a contest. As each test completes the sandbox publishes a result to a pub/sub channel keyed by submission ID; the browser is subscribed via SSE or WebSocket (the same "job runs independently, client subscribes" shape as A8).</p>
  <p><b>5. Abuse.</b> Crypto mining (CPU limits, wall-clock limits, anomaly detection on accounts), attacks launched from your IPs (no network), reading test cases (hidden tests are mounted only for the run, and the output channel is capped), and resource exhaustion through many accounts (signup friction, per-IP limits).</p>
  <h3>Trade-offs</h3>
  <ul>
    <li><b>Containers</b> give you the fastest start and highest density at the cost of a shared kernel; choose them when the code is your own (CI for your repo). <b>MicroVMs</b> give you VM-grade isolation at the cost of a little more overhead and operational complexity; choose them for strangers' code.</li>
    <li>A <b>warm pool</b> gives you millisecond starts at the cost of paying for idle sandboxes; size it from the queue length and grow it before scheduled contests.</li>
  </ul>
  <h3>Deep-dive questions</h3>
  <p><b>"How is Replit (or a live interview IDE) different from LeetCode?"</b> Sessions are long-lived and stateful: a sandbox per session with a persistent workspace, a terminal over WebSocket, an idle timeout that snapshots the filesystem to object storage and destroys the VM, and a restore on return. Isolation and limits stay the same; the scheduling becomes "place and keep a VM" instead of "run and destroy".</p>
  <p><b>"A submission is stuck in an infinite loop."</b> The wall-clock timer outside the sandbox kills the whole VM, not just the process, records "Time Limit Exceeded", and the dispatcher replaces it in the warm pool.</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"Every submission is hostile, so each run gets a fresh Firecracker microVM from a warm pool: its own kernel, no network, read-only root, 256 MB, 64 processes, 2 seconds of CPU and 10 of wall clock, capped output, destroyed afterwards. Runs go through a queue with interactive runs ahead of full submissions and per-user rate limits; results stream back per test over pub/sub and SSE. Contest peaks are a few hundred cores, so I'd pre-scale the pool before scheduled contests."</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>"We'll run it in a Docker container" as the whole security story. Containers share the host kernel, and a default container still has network access and no process or output limits. Name the isolation boundary (microVM or gVisor) and list the limits; the interviewer is checking whether you think like an attacker.</p></div>

  <h2>13. B9 · Distributed key-value store (Dynamo-style)</h2>
  <p><b>Essence.</b> Build the storage system itself: <code>get(key)</code> and <code>put(key, value)</code> across hundreds of machines, staying available when some of them fail, with tunable consistency. This is the "design Dynamo / Cassandra / a distributed cache" question, and it ties together the Part 2 and Part 3 lessons on <a href="#storage">storage</a> and <a href="#consensus">quorums</a>.</p>
  <h3>Requirements that matter</h3>
  <ul>
    <li>Values up to ~1 MB; single-key operations only (no joins, no multi-key transactions).</li>
    <li>Always writable, even during network partitions (an "add to cart" must never fail), so: choose availability, accept eventual consistency, and resolve conflicts.</li>
    <li>Add and remove nodes without downtime; low, predictable latency (single-digit ms).</li>
  </ul>
  <h3>Numbers</h3>
  <div class="trace">
    <ol>
      <li><b>Data.</b> 100 TB of data × 3 replicas = 300 TB stored.</li>
      <li><b>Nodes for storage.</b> At ~2 TB usable per node (leave room for compaction): 300 / 2 = <b>150 nodes</b>.</li>
      <li><b>Nodes for traffic.</b> 1 million ops/s, and each op touches 2 replicas with a quorum of 2: ~2 M replica-ops/s across 150 nodes ≈ <b>13,000 ops/s per node</b>, comfortable for SSD-backed nodes. Here storage, not traffic, sets the node count.</li>
      <li><b>Membership.</b> With 150 nodes and a typical failure rate, something is broken every week or so. Failure handling is the normal case, not the exception.</li>
    </ol>
  </div>
