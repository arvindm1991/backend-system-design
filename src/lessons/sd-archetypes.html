    <text x="330" y="169" text-anchor="start" font-size="12.5" fill="currentColor">4. W = 2: ack once B and C have it.</text>
    <text x="330" y="194" text-anchor="start" font-size="12.5" fill="currentColor">5. D comes back (gossip notices);</text>
    <text x="346" y="219" text-anchor="start" font-size="12.5" fill="currentColor">E hands the write off, drops hint.</text>
    <text x="330" y="244" text-anchor="start" font-size="12.5" fill="currentColor">6. Read with R = 2: R + W &gt; N, so at</text>
    <text x="346" y="269" text-anchor="start" font-size="12.5" fill="currentColor">least one replica has the latest.</text>
    </svg>
    <figcaption>Consistent hashing places nodes and keys on a ring; a key's replicas are the next N distinct nodes clockwise. When one is down, a neighbour takes the write with a hint and hands it back later.</figcaption>
  </figure>
  <h3>The nuances</h3>
  <p><b>1. Partitioning with consistent hashing.</b> Hash keys and nodes onto a ring; a key belongs to the first node clockwise. Adding a node moves only the keys in its new arc (about 1/N of the data), unlike <code>hash(key) mod N</code>, which reshuffles almost everything. Each physical node takes many <b>virtual nodes</b> (points on the ring) so load is even and a joining node takes data from many peers at once.</p>
  <p><b>2. Replication and quorums.</b> Each key lives on N nodes (the next N distinct nodes clockwise). Any node can coordinate a request. With N = 3, writes wait for W acks and reads for R replies; if <b>R + W &gt; N</b> (e.g. 2 + 2 &gt; 3), every read overlaps the latest write on at least one replica. Lower W or R trade consistency for latency, per request.</p>
  <p><b>3. Conflicts happen; resolve them.</b> During a partition, two clients can write the same key on different replicas. Options:</p>
  <ul>
    <li><b>Last-write-wins</b> by timestamp (Cassandra's default): simple, but clocks drift, so a "later" write can silently lose. Fine when values are overwritten wholesale and an occasional lost update is acceptable.</li>
    <li><b>Version vectors / vector clocks</b> (Amazon's Dynamo paper, Riak): detect that two versions are concurrent and return both ("siblings") to the application, which merges them. Dynamo's example: two shopping-cart versions are merged by taking the union of items (which is why a deleted item can occasionally reappear).</li>
    <li><b>CRDTs</b>: data types that merge automatically (counters, sets), the A10 idea applied to storage.</li>
  </ul>
  <p><b>4. Staying writable when nodes fail.</b> <b>Sloppy quorum and hinted handoff</b>: if a replica is down, the write goes to the next healthy node on the ring with a hint ("this belongs to D"); when D returns, the hint is delivered. <b>Read repair</b> fixes stale replicas noticed during reads. <b>Anti-entropy</b> catches the rest: replicas compare <b>Merkle trees</b> (trees of hashes over key ranges), so two nodes holding 1 TB each can find the few differing keys by comparing a handful of hashes, top-down, instead of shipping all data.</p>
  <p><b>5. Gossip for membership.</b> There's no central coordinator. Every second, each node exchanges its view of the cluster (who's alive, heartbeat counters, ring positions) with a random peer. News spreads like a rumour: within a few seconds (roughly log N rounds) everyone knows. Failure detectors decide "D is probably dead" from missed heartbeats.</p>
  <p><b>6. On each node: an LSM tree.</b> Writes go to an append-only log (for durability) and an in-memory sorted table; when it fills, it's flushed as an immutable sorted file (SSTable); background <b>compaction</b> merges files. Reads check memory, then files, using per-file Bloom filters to skip files that can't contain the key. This makes writes very fast at the cost of some read and compaction work.</p>
  <h3>Trade-offs</h3>
  <ul>
    <li><b>Leaderless replication with quorums</b> gives you availability during partitions and no failover pause at the cost of conflicts you must resolve; choose it when "always writable" matters (carts, sessions, device state). <b>Leader-based replication with consensus</b> (Raft, as in etcd or CockroachDB) gives you linearizable reads and writes at the cost of unavailability for a minority partition; choose it for metadata, locks and money.</li>
    <li>A <b>cache</b> (Memcached-style) drops replication and durability entirely: client-side consistent hashing, a miss is just a miss. Choose it when the data can be recomputed.</li>
  </ul>
  <h3>Deep-dive questions</h3>
  <p><b>"A node dies permanently. What happens?"</b> Gossip marks it down; its keys still have N−1 live replicas, so reads and writes continue (writes to its ranges go to neighbours via hinted handoff). An operator or automation removes it from the ring, and its ranges are re-replicated from surviving replicas, streamed from many nodes in parallel thanks to virtual nodes.</p>
  <p><b>"Can you give me strong consistency?"</b> Per request: W = N (or R + W &gt; N with careful conflict handling) gets close, but sloppy quorums and clock-based conflict resolution still leave edge cases. For real linearizability, use a consensus protocol per key range (each range is a small Raft group), which is what systems like CockroachDB and TiKV do.</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"Keys are placed on a consistent-hash ring with virtual nodes and replicated to the next three distinct nodes. Any node coordinates; with N = 3, W = 2 and R = 2, reads overlap the latest write. To stay writable during failures I'd use sloppy quorums with hinted handoff, plus read repair and Merkle-tree anti-entropy. Concurrent writes are detected with version vectors and merged by the application, or last-write-wins where losing an update is acceptable. Membership spreads by gossip, and each node stores data in an LSM tree."</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Partitioning with <code>hash(key) % number_of_nodes</code>. Going from 150 to 151 nodes changes the home of almost every key, which means moving nearly 100 TB. Consistent hashing exists exactly to make that ~1/151 of the data.</p></div>

  <h2>14. B10 · Full-text search</h2>
  <p><b>Essence.</b> Given a few words, find the most relevant documents among millions or billions, in about 100 ms, and keep the index fresh as documents change. The data structure that makes it possible is the <b>inverted index</b>.</p>
  <h3>Requirements that matter</h3>
  <ul>
    <li>Search a product catalogue (or tweets, or help articles) by words; results ranked by relevance plus business signals; filters (price, size, in stock).</li>
    <li>Latency around 100–200 ms; new or changed documents searchable within seconds (tweets) or minutes (products).</li>
    <li>Ask: how fresh? How big? Typo tolerance? Personalized ranking?</li>
  </ul>
  <h3>Numbers</h3>
  <div class="trace">
    <ol>
      <li><b>Corpus.</b> 100 million products × ~2 KB of searchable text = <b>200 GB</b>. The index is of a similar order (often 0.5–1.5× the source, depending on what's stored).</li>
      <li><b>Shards.</b> Elasticsearch guidance suggests shards of roughly 10–50 GB, so ~5–10 primary shards, each with 2 replicas for throughput and failover.</li>
      <li><b>Queries.</b> 5,000 searches/s at peak. Each query goes to every shard (see sharding below): 5,000 × 8 shards = <b>40,000 shard-queries/s</b>, spread across 3 copies of each shard.</li>
      <li><b>Updates.</b> Prices and stock change constantly: say 2,000 document updates/s. Twitter-style search is far more write-heavy: hundreds of millions of tweets/day, thousands per second, searchable within seconds.</li>
    </ol>
  </div>

  <p>Pipeline: the source of truth (a product database) emits changes via change data capture or an outbox → a queue → <b>indexers</b> that tokenize and write to the search cluster. The index is derived data: you can always rebuild it. Queries go to a coordinator that fans out to shards and merges.</p>
  <h3>The nuances</h3>
  <p><b>1. Tokenizing decides what matches.</b> "Running Shoes!" becomes <code>run</code>, <code>shoe</code> after lowercasing, splitting, removing punctuation and <b>stemming</b> (reducing words to a root). Add synonyms ("sneakers" ≈ "shoes"), language-specific rules, and edge n-grams if you want prefix matches. The same analysis must run on documents and queries, or "shoes" won't find "shoe".</p>
  <p><b>2. Ranking: TF-IDF and BM25, intuitively.</b> Score a document higher when a query term appears in it often (<b>term frequency</b>), when the term is rare across the whole corpus (<b>inverse document frequency</b>: matching "gore-tex", in 5,000 products, says more than matching "shoe", in 2 million), and when the field is short (a match in a 6-word title beats one buried in a 3,000-word description). <b>BM25</b>, the default in Lucene-based engines, refines TF-IDF with <b>saturation</b>: the 10th occurrence of "shoe" adds much less than the first, so keyword stuffing doesn't win. Then blend in business signals (sales, rating, stock), and often re-rank the top few hundred with a machine-learned model. Many modern systems also add vector (embedding) search for meaning and merge the two result lists (hybrid search).</p>
  <p><b>3. Freshness.</b> Lucene-based engines (Elasticsearch, OpenSearch, Solr) write new documents into small immutable <b>segments</b>; a periodic refresh (1 second by default in Elasticsearch) makes them searchable, which is why it's called "near real time". An update is really "mark old version deleted, add new"; background merges clean up. Give each change a version number so an older update arriving late can't overwrite a newer one. For a big schema change, build a new index alongside the old one and switch an alias atomically.</p>
  <p><b>4. Sharding: by document or by term.</b></p>
  <ul>
    <li><b>Document-partitioned</b> (what Elasticsearch does): each shard holds a complete mini-index for its subset of documents. A query goes to every shard; each returns its top 20; the coordinator merges. Writes touch one shard. Cost: every query hits every shard, so the slowest shard sets the latency (tail latency), which you fight with replicas and hedged requests.</li>
    <li><b>Term-partitioned</b>: each shard owns some terms and their full posting lists. A query touches only the shards for its terms, but multi-word queries must intersect lists across machines, a hot term ("iphone") makes a hot shard, and updating one document touches many shards. Rare in practice.</li>
  </ul>
  <h3>Trade-offs</h3>
  <ul>
    <li><b>Document partitioning</b> gives you simple writes and balanced load at the cost of fan-out on every query; choose it almost always.</li>
    <li><b>A shorter refresh interval</b> gives you fresher results at the cost of more small segments and more merge work; choose 1 s for tweets, 30 s or more for bulk catalogue indexing.</li>
    <li><b>A search engine next to your database</b> gives you relevance, typo tolerance and facets at the cost of a second system to keep in sync; for small data (under a few million rows), Postgres full-text search may be enough.</li>
  </ul>
  <h3>Deep-dive questions</h3>
  <p><b>"Why not <code>WHERE title LIKE '%shoe%'</code>?"</b> A leading wildcard can't use a normal index, so it scans every row; it has no stemming, no ranking and no typo tolerance. The inverted index makes lookup proportional to the matching documents, not the whole table.</p>
  <p><b>"How does Twitter-style search stay fresh at thousands of tweets a second?"</b> Partition by time as well as by document: the most recent tweets sit in an in-memory index that is written continuously and queried first; older time slices are on-disk, read-only and heavily cached. Most searches want recent results, so most queries never touch the old slices.</p>
  <p><b>"Typos?"</b> Fuzzy matching within an edit distance of 1–2 per term (Lucene does this efficiently with automata), plus a "did you mean" built from query logs, the same offline-precompute idea as A7.</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"Search is an inverted index: term to posting list. Documents and queries go through the same analyzer: lowercase, stem, synonyms. Ranking is BM25, rare terms matter more and repetition saturates, blended with business signals and an optional re-ranker. The index is derived from the database through change data capture with version numbers, refreshed about every second. I'd shard by document, about 30 GB per shard with two replicas, and scatter-gather the top results, watching tail latency."</p></div>
  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Making the search engine the source of truth. Search clusters can lose writes on failure and are rebuilt from scratch on schema changes; they're an index, not a database. Keep the truth in the database and feed the index from it, so you can always rebuild.</p></div>

  <h2>15. Archetype mixing: decomposing real prompts</h2>
  <p>Real interview prompts are products, and products combine archetypes. The skill is to decompose the prompt in the first five minutes, then spend your deep dive on the archetype that carries the product's biggest risk. Say the decomposition out loud: it shows you see the whole system, and it lets the interviewer pick where to go deep.</p>

  <h2>Recap</h2>
  <ul>
    <li>Most system design questions are about 20 archetypes in costumes. The standard 70% (load balancer, stateless servers, cache, queue, CDN) is shared; the archetype decides the 30% that earns the grade.</li>
    <li>Recognize it in two minutes with seven questions: read or write heavy, realtime, money or scarcity, fan-out, geospatial, untrusted input, bursty or scheduled. Then say the archetype out loud as a hypothesis.</li>
    <li>Each archetype has one or two signature nuances: celebrity fan-out (feed), atomic claims (booking, dispatch, job leases), streaming and resume (LLM chat), spatial cells and write volume (location), segments and CDN (video), accuracy matched to purpose (counting), double-entry and idempotency (payments), per-host politeness (crawler), at-least-once with idempotent runs (scheduler), cardinality (metrics), microVM isolation and limits (sandbox), quorums and hinted handoff (KV store), inverted index and BM25 (search).</li>
    <li>Several moves transfer everywhere: atomic conditional writes, idempotency keys, precomputing off the hot path, batching hot counters, "job runs independently and the client subscribes", and keeping derived data rebuildable from a source of truth.</li>
    <li>Real prompts mix two to four archetypes. Decompose out loud, find the scale hot spot and the correctness hot spot, and offer the interviewer a choice of deep dive.</li>
  </ul>
