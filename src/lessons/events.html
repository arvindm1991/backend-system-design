  <h1>Event-driven architecture</h1>
  <p class="lede">By the end of this lesson you will be able to explain the difference between commands and events, spot the dual-write bug in a code review and fix it with a transactional outbox, design a multi-step booking as a saga with compensations, explain why &quot;exactly-once&quot; really means &quot;at-least-once plus idempotency&quot;, and say when event sourcing is (and isn&#39;t) worth it.</p>

  <h2>1. The running example: SeatSwift checkout</h2>
  <p>SeatSwift sells concert tickets. Buying a ticket touches several services, each with its own database:</p>
  <ul>
    <li><b>Inventory</b>: holds and sells seats.</li>
    <li><b>Payments</b>: charges the card through a payment provider such as Stripe.</li>
    <li><b>Ticketing</b>: issues the ticket with the venue&#39;s access-control system (the barcode scanned at the door).</li>
    <li><b>Email</b>, <b>Loyalty points</b>, <b>Analytics</b>: want to know when a booking happens.</li>
  </ul>
  <p>In version 1, the booking service called each of these over HTTP in a row. Every new team that wanted to react to bookings (loyalty, then fraud, then analytics) had to get a line added to the booking code, and when Email was slow, checkout was slow. This lesson is about the alternative: <b>events</b>.</p>

  <h2>2. Commands vs events</h2>
  <p>Two kinds of messages flow between services, and mixing them up causes most confusion.</p>
  <table class="tbl">
    <thead><tr><th></th><th>Command</th><th>Event</th></tr></thead>
    <tbody>
      <tr><td>Meaning</td><td>&quot;Please do this&quot;</td><td>&quot;This happened&quot;</td></tr>
      <tr><td>Naming</td><td>Imperative: <code>ChargeCard</code>, <code>IssueTicket</code></td><td>Past tense: <code>BookingConfirmed</code>, <code>PaymentFailed</code></td></tr>
      <tr><td>Receivers</td><td>Exactly one handler that owns the action</td><td>Zero, one or many subscribers; the sender doesn&#39;t know who</td></tr>
      <tr><td>Can it be refused?</td><td>Yes (card declined)</td><td>No; it&#39;s a fact about the past</td></tr>
      <tr><td>Coupling</td><td>Sender depends on the receiver existing</td><td>Sender depends on nobody</td></tr>
    </tbody>
  </table>
  <p>With events, the booking service publishes <code>BookingConfirmed</code> once to a <b>topic</b> (a named channel), and anyone who cares <b>subscribes</b>. This is <b>publish/subscribe</b> (pub/sub). Common tools: Kafka, Amazon SNS + SQS, Google Pub/Sub, RabbitMQ. When the fraud team arrives, they subscribe; the booking code doesn&#39;t change. If Email is down for ten minutes, its messages wait in its queue and checkout is unaffected.</p>
  <p>Events give you decoupling and resilience at the cost of visibility (no single place shows the whole flow) and eventual consistency (Loyalty learns about the booking a moment later). Choose them for reactions that don&#39;t need to finish before you answer the user; keep a direct call when you need the answer right now (&quot;was the card approved?&quot;).</p>

  <h2>3. The dual-write problem</h2>
  <p>Here is the first version of the booking code. Read it and find the bug.</p>
  <pre><code class="lang-js">async function confirmBooking(booking) {
  await db.query('INSERT INTO bookings (id, seat_id, user_id, status) VALUES ($1, $2, $3, $4)',
                 [booking.id, booking.seatId, booking.userId, 'confirmed']);
  await kafka.publish('booking.confirmed', { bookingId: booking.id, seatId: booking.seatId });
}</code></pre>
  <p>It writes to two systems (the database and the broker) that can&#39;t share a transaction. That&#39;s a <b>dual write</b>, and the gap between the two lines is where things go wrong:</p>
  <div class="trace"><b>Trace: three ways a dual write breaks</b>
    <ol>
      <li><p><b>Crash between the lines.</b> The <code>INSERT</code> commits. The process is killed by a deploy 2&nbsp;ms later. <span class="no">Booking exists, no event.</span> Alice is charged, never gets her ticket email, and Loyalty never credits her points. Nothing logs an error.</p></li>
      <li><p><b>Broker unavailable.</b> Kafka is mid-failover and <code>publish</code> throws. The booking is already committed. Do you retry for how long? Return an error to Alice for a booking that succeeded?</p></li>
      <li><p><b>Swap the order</b> (publish first, then insert). The event goes out, then the <code>INSERT</code> fails on a constraint. <span class="no">Email sends a ticket for a booking that doesn&#39;t exist.</span></p></li>
    </ol>
  </div>
  <p>At SeatSwift volume (say 2 million bookings a month), even a 1-in-100,000 crash window is 20 lost events a month, and you&#39;ll only find out from angry customers.</p>

  <h2>4. The fix: the transactional outbox</h2>
  <p>Don&#39;t write to two systems. Write to <b>one</b> system, the database, in <b>one</b> transaction: the booking row <i>and</i> a row in an <code>outbox</code> table describing the event. A separate process, the <b>relay</b>, reads the outbox and publishes to the broker.</p>

  <p>Instead of polling, the relay can use <b>change data capture</b> (CDC): a tool like Debezium reads the database&#39;s write-ahead log (the log every committed change is written to) and streams new outbox rows to Kafka. CDC gives lower latency and no polling load at the cost of running another piece of infrastructure.</p>

  <h2>5. Exactly-once is effectively-once</h2>
  <p>Every real message system can deliver a message more than once: a relay crash, a consumer that processes a message and crashes before acknowledging it, a network retry. You cannot get <b>exactly-once delivery</b> across a network. You can get <b>exactly-once effect</b> (people say &quot;effectively-once&quot;) by making consumers <b>idempotent</b>: processing the same event twice has the same result as once.</p>
  <p>The standard trick: record the event id in the same transaction as the side effect, with a unique constraint.</p>
  <pre><code class="lang-sql">-- Loyalty service, handling evt_b_901 (+890 points)
BEGIN;
INSERT INTO processed_events (event_id) VALUES ('evt_b_901');  -- PRIMARY KEY
-- if this fails with a unique violation: already handled, ROLLBACK and ack
UPDATE loyalty_accounts SET points = points + 890 WHERE user_id = 'u_alice';
COMMIT;</code></pre>
  <p>For side effects outside your database (sending an email, charging a card), pass the event id as an <b>idempotency key</b> to the provider (Stripe and most email APIs accept one), or check-and-record before sending and accept that a crash in the tiny window may still double-send a low-stakes email.</p>
  <p>Kafka does offer &quot;exactly-once semantics&quot;, and it&#39;s real, but it covers reading from Kafka, processing, and writing back to Kafka in one Kafka transaction. The moment your consumer touches anything outside Kafka (Postgres, an email API), you&#39;re back to idempotency.</p>

  <h2>6. Sagas: multi-step workflows without a distributed transaction</h2>
  <p>A booking is three steps in three services: hold the seat, charge the card, issue the ticket. On one database you&#39;d wrap them in a transaction and roll back on failure. Across services you can&#39;t, at least not practically.</p>
  <p>The textbook tool is <b>two-phase commit</b> (2PC): a coordinator asks every participant &quot;can you commit?&quot;, then tells all of them &quot;commit&quot;. It works inside some databases, but across services it holds locks while waiting on the slowest participant, blocks everyone if the coordinator dies at the wrong moment, and third-party APIs like a payment provider don&#39;t take part in it at all.</p>
  <p>A <b>saga</b> is the alternative: a sequence of <b>local transactions</b>, one per service, each committed on its own. If a later step fails, you run <b>compensating actions</b> for the earlier steps, in reverse order. A compensation is a <i>semantic undo</i>: you can&#39;t un-charge a card, but you can refund it.</p>

  <p>Notice what a saga does <i>not</i> give you: <b>isolation</b>. Between 19:30:01.9 and 19:30:02.3, Alice&#39;s card shows a charge for a booking that will be reversed. Sagas trade isolation for availability, and you design around it: holds that expire, &quot;pending&quot; statuses in the UI, and ordering steps so the hardest-to-undo step (the <b>pivot</b>, here issuing the ticket) is as late as possible, or comes first if it is the most likely to fail.</p>
  <table class="tbl">
    <thead><tr><th></th><th>Orchestration</th><th>Choreography</th></tr></thead>
    <tbody>
      <tr><td>How</td><td>A central orchestrator sends commands and tracks state</td><td>Each service reacts to the previous service&#39;s events</td></tr>
      <tr><td>Gives you</td><td>One place to see and debug the flow; easy timeouts and compensations</td><td>No central component; services fully decoupled</td></tr>
      <tr><td>Costs you</td><td>Another service to run; orchestrator knows every step</td><td>The flow is implicit, spread across services; hard to change and debug past ~3 steps</td></tr>
      <tr><td>Choose when</td><td>Multi-step business flows with compensations (bookings, orders)</td><td>Simple fan-out reactions (email and loyalty on <code>BookingConfirmed</code>)</td></tr>
    </tbody>
  </table>
  <p>Workflow engines like Temporal, AWS Step Functions or Camunda are orchestrators-as-a-service: they persist saga state, retry steps and run compensations for you.</p>
  <div class="callout"><span class="callout-label">Say it in the interview</span><p>&quot;Checkout spans inventory, payments and ticketing, so there&#39;s no single transaction. I&#39;d run it as an orchestrated saga: hold the seat with an expiry, charge with the booking id as an idempotency key, issue the ticket, and on failure run compensations in reverse: refund, then release. Every step and compensation is idempotent and retried, saga state is persisted so a crash resumes, and each service publishes its events through an outbox so nothing is lost between the database and the broker.&quot;</p></div>

  <h2>7. Ordering</h2>
  <p>Brokers like Kafka only guarantee order <b>within a partition</b> (a single ordered log; a topic is split into many for parallelism). If <code>BookingConfirmed</code> and <code>BookingCancelled</code> for <code>b_901</code> land on different partitions, a consumer can see the cancel first. The fix: choose a <b>partition key</b> so all events about one thing go to one partition, e.g. key = booking id. You get order per booking (which is what you need) and parallelism across bookings.</p>

  <h2>8. Event sourcing, briefly</h2>
  <p>So far the database holds current state and events are notifications. <b>Event sourcing</b> flips it: the <b>events are the source of truth</b>, and current state is computed by replaying them.</p>
  <pre><code class="lang-js">// Seat 14C's stored history (append-only):
// 1 SeatHeld      { by: 'u_alice', until: '19:40' }
// 2 HoldExpired   {}
// 3 SeatHeld      { by: 'u_bob', until: '19:52' }
// 4 SeatSold      { to: 'u_bob', bookingId: 'b_917' }
const state = events.reduce(applyEvent, { status: 'available' });
// =&gt; { status: 'sold', holder: 'u_bob' }</code></pre>
  <p>Read models (&quot;projections&quot;) like &quot;available seats for event 42&quot; are built by consumers of this stream, and you can rebuild a new one from history at any time. Event sourcing gives you a perfect audit trail, time travel (&quot;what did the seat map look like at 19:35?&quot;) and new projections for free, at the cost of real complexity: event schemas you can never change (only version), eventually consistent read models, and snapshots to keep replays fast. Choose it for domains where history <i>is</i> the product (ledgers, audit-heavy workflows); don&#39;t default to it for CRUD.</p>

  <p>Write the booking and its event in one transaction, then build a relay that publishes in order, survives a broker outage, and redelivers (with the same id) after a crash.</p>

  <h2>Recap</h2>
  <ul>
    <li>Commands ask one handler to do something (and can be refused); events announce facts to any number of subscribers. Events decouple teams at the cost of visibility and eventual consistency.</li>
    <li>Writing to a database and a broker separately is a dual write and will lose or invent events. Use a transactional outbox (relay or CDC).</li>
    <li>Delivery is at-least-once; get effectively-once with idempotent consumers (dedupe on event id in the same transaction, idempotency keys for external calls).</li>
    <li>Multi-service workflows are sagas: local transactions plus idempotent compensations in reverse. Orchestrate complex flows; choreograph simple reactions. Sagas give up isolation, so design around it.</li>
    <li>Order holds only within a partition, so key by the entity. Event sourcing makes events the source of truth: great for audit-heavy domains, overkill for most CRUD.</li>
