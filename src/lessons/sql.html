  <h1>Data modeling and SQL</h1>
  <p class="lede">Most backend problems are data problems wearing a disguise. This lesson builds PageTurn's schema from scratch: tables and keys, one-to-many and many-to-many, when to copy data on purpose, joins, why an index turns 50 million rows into 4 page reads, how two devices can silently lose an update, the N+1 query that makes dashboards slow, and how to change a schema without downtime.</p>

  <h2>1. The running example: what PageTurn stores</h2>
  <p>Start from the product, not the database. A <b>district</b> has <b>schools</b>. A school has <b>classes</b>. <b>Students</b> are enrolled in classes (a 4th grader might be in a homeroom and a reading group). Teachers create <b>assignments</b> for a class, each pointing at a <b>book</b>. Every time a student reads, the app saves a <b>reading session</b>: who, which book, how many minutes, when.</p>
  <p>Rough sizes, because they drive every decision: 300 districts, 6,000 schools, 2 million students, 80,000 books, and about <b>6 million reading sessions a school day</b>, so roughly a billion a year.</p>

  <h2>2. Tables, rows and keys</h2>
  <p>A relational database stores data in <b>tables</b>: rows with the same named, typed columns. Each table has a <b>primary key</b>, a column (or set of columns) that uniquely identifies a row and never changes. A <b>foreign key</b> is a column that holds another table's primary key, and the database enforces that it points at something real.</p>
  <pre><code class="lang-sql">CREATE TABLE classes (
  id          TEXT PRIMARY KEY,                       -- 'c1'
  school_id   TEXT NOT NULL REFERENCES schools(id),
  district_id TEXT NOT NULL REFERENCES districts(id), -- copied on purpose, see section 4
  name        TEXT NOT NULL,                          -- '4B Reading'
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
);

CREATE TABLE reading_sessions (
  id          TEXT PRIMARY KEY,
  student_id  TEXT NOT NULL REFERENCES students(id),
  book_id     TEXT NOT NULL REFERENCES books(id),
  class_id    TEXT NOT NULL REFERENCES classes(id),
  minutes     INT  NOT NULL CHECK (minutes BETWEEN 1 AND 240),
  finished    BOOLEAN NOT NULL DEFAULT false,
  created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
);</code></pre>
  <p>Notice how much the schema enforces for you: <code>NOT NULL</code>, <code>REFERENCES</code> (no session for a student who doesn't exist), <code>CHECK</code> (no 9,000-minute sessions from a buggy client). Constraints are free bug-catchers. Application code has many entry points and gets rewritten; the database sees every write.</p>

  <h2>3. Relationships: one-to-many and many-to-many</h2>
  <p><b>One-to-many</b> (1–N): one class has many assignments; each assignment belongs to exactly one class. The "many" side holds the foreign key: <code>assignments.class_id</code>.</p>
  <p><b>Many-to-many</b> (N–N): a student is in several classes, and a class has many students. Neither table can hold "the" foreign key, so you add a <b>join table</b> whose rows are the pairs:</p>
  <pre><code class="lang-sql">CREATE TABLE enrollments (
  class_id   TEXT NOT NULL REFERENCES classes(id),
  student_id TEXT NOT NULL REFERENCES students(id),
  role       TEXT NOT NULL DEFAULT 'student',
  joined_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
  PRIMARY KEY (class_id, student_id)          -- the pair is unique
);</code></pre>
  <p>Join tables often grow their own data (here <code>joined_at</code>), which is a hint that the relationship is a real thing in the product. "Ana joined 4B on Sept 3" is a fact about the enrollment, not about Ana or 4B.</p>

  <h2>4. Normalization, and copying data on purpose</h2>
  <p><b>Normalization</b> means each fact lives in exactly one place. A book's title lives in <code>books</code>, not repeated in every reading session. If a publisher fixes a typo in a title, you change one row, and everything that joins to it is correct.</p>
  <p>The opposite, <b>denormalization</b>, means deliberately copying a fact somewhere else to make reads cheaper. Two copies PageTurn makes on purpose:</p>
  <ul>
    <li><b><code>classes.district_id</code></b>. You could get it by joining through <code>schools</code>, but nearly every query and every permission check filters by district (that's the tenant). One copied column saves a join everywhere, and a school never changes district, so the copy can't go stale.</li>
    <li><b><code>student_stats.minutes_this_week</code></b>. The teacher dashboard shows weekly minutes for 28 students, thousands of times each morning. Summing millions of session rows each time is wasteful, so a counter is updated whenever a session is saved.</li>
  </ul>
  <p>The price of a copy is keeping it in sync. If saving a session and bumping the counter aren't in the same transaction, a crash between them leaves the counter wrong forever. Normalization gives you one source of truth at the cost of joins at read time; denormalization gives you fast reads at the cost of extra writes and a sync bug waiting to happen. Normalize by default; copy when a read is hot, measured, and the copy has a clear owner that updates it.</p>

  <h2>5. Joins, with actual rows</h2>
  <p>A <b>join</b> combines rows from two tables where a condition matches. Take tiny versions of two tables:</p>
  <table class="tbl">
    <thead><tr><th>enrollments (class_id, student_id)</th><th>reading_sessions this week (student_id, minutes)</th></tr></thead>
    <tbody>
      <tr><td>(c1, ana), (c1, ben), (c1, cai)</td><td>(ana, 20), (ana, 15), (cai, 30), (dev, 25)</td></tr>
    </tbody>
  </table>
  <div class="trace">
    <b>Trace · INNER JOIN versus LEFT JOIN</b>
    <ol>
      <li><p><code>FROM enrollments e JOIN reading_sessions r ON r.student_id = e.student_id WHERE e.class_id = 'c1'</code> keeps only pairs that match: <b>(ana, 20), (ana, 15), (cai, 30)</b>. Ben read nothing this week, so <span class="no">Ben disappears</span>. Dev isn't in c1, so he's not there either.</p></li>
      <li><p>Add <code>GROUP BY e.student_id</code> with <code>SUM(r.minutes)</code>: ana 35, cai 30. The dashboard would show 2 students in a class of 3.</p></li>
      <li><p>Switch to <code>LEFT JOIN</code>: keep every row from the left table even with no match, filling the right side with <code>NULL</code>: (ana, 20), (ana, 15), <b>(ben, NULL)</b>, (cai, 30).</p></li>
      <li><p><code>COALESCE(SUM(r.minutes), 0)</code> turns Ben's NULL into 0. Result: <span class="yes">ana 35, ben 0, cai 30</span>. That's the teacher's question: "who hasn't read?" Ben is the most important row.</p></li>
    </ol>
  </div>
  <p>Rule of thumb: <b>INNER JOIN</b> when you only want rows that have a partner; <b>LEFT JOIN</b> when the left side is the list you must show in full.</p>

  <h2>6. Indexes: why lookups are fast</h2>
  <p>Ms. Lee clicks Ana's name. The app runs:</p>
  <pre><code class="lang-sql">SELECT * FROM reading_sessions
 WHERE student_id = 'ana'
 ORDER BY created_at DESC
 LIMIT 50;</code></pre>
  <p>Without help, the database has one way to answer: read every row in the table and keep the ones where <code>student_id = 'ana'</code>. That's a <b>sequential scan</b> (or full table scan). With 500 million rows (one school year), that's tens of gigabytes read to find about 250 rows. Seconds to minutes, per click.</p>
  <p>An <b>index</b> is a separate, sorted structure: the values of one or more columns, each with a pointer to its row. Sorted means you can find a value by repeatedly halving the search space, like finding a name in a phone book. Real databases use a <b>B-tree</b>: a short, wide tree where each node is one disk page holding a few hundred sorted keys.</p>

  <p>Because each page fans out to hundreds of children, a B-tree over hundreds of millions of rows is only 3–4 levels deep, and the top levels are almost always in memory. So the lookup costs a handful of page reads plus reading Ana's ~250 rows. Milliseconds.</p>
  <pre><code class="lang-sql">CREATE INDEX reading_sessions_student_created
    ON reading_sessions (student_id, created_at DESC);</code></pre>
  <p>Three things to know about indexes:</p>
  <ul>
    <li><b>Column order matters.</b> An index on <code>(student_id, created_at)</code> is sorted by student, then by time within each student, like a phone book sorted by last name then first name. It serves "Ana's sessions, newest first" perfectly. It does <i>not</i> help "all sessions since Monday" across students, just as a phone book doesn't help you find everyone named Ana.</li>
    <li><b>Indexes cost writes.</b> Every insert must also update every index on the table. Six indexes on <code>reading_sessions</code> means seven structures touched per save, at 6 million saves a day.</li>
    <li><b>Check with <code>EXPLAIN</code>.</b> It shows the plan the database chose: <code>Seq Scan</code> or <code>Index Scan</code>, and estimated rows. Read it before and after adding an index.</li>
  </ul>

  <h2>7. Transactions, and the lost update</h2>
  <p>A <b>transaction</b> groups statements so they succeed or fail together. That's the "A" in <b>ACID</b>: <b>Atomic</b> (all or nothing), <b>Consistent</b> (constraints hold afterwards), <b>Isolated</b> (concurrent transactions don't see each other's half-done work, to a degree you choose), <b>Durable</b> (once committed, it survives a crash).</p>
  <p>"To a degree you choose" is where real bugs live. Ana reads on the school iPad and on her phone at home, and both finish a book at nearly the same moment. Each device's request does a read-modify-write on her counter:</p>
  <div class="trace">
    <b>Trace · two requests, one counter (Postgres default isolation, Read Committed)</b>
    <ol>
      <li><p>Request A: <code>SELECT books_finished FROM student_stats WHERE student_id='ana'</code> → <b>4</b>.</p></li>
      <li><p>Request B (2ms later): same SELECT → <b>4</b>. A hasn't written yet.</p></li>
      <li><p>A computes 4 + 1 and runs <code>UPDATE … SET books_finished = 5</code>. Commits.</p></li>
      <li><p>B computes 4 + 1 and runs <code>UPDATE … SET books_finished = 5</code>. Commits.</p></li>
      <li><p>Ana finished two books; the counter says 5, not 6. <span class="no">Lost update.</span> No error, no log line. A teacher's report is just quietly wrong.</p></li>
    </ol>
  </div>
  <p>Three standard fixes, from simplest to most general:</p>
  <ul>
    <li><b>Let the database do the math</b>: <code>UPDATE student_stats SET books_finished = books_finished + 1 WHERE student_id = 'ana'</code>. The database locks the row for the update, so B's increment applies on top of A's. Result 6. Use this whenever you can.</li>
    <li><b>Lock the row when you read it</b>: <code>SELECT … FOR UPDATE</code> inside a transaction. B waits at step 2 until A commits, then reads 5. Use it when the new value needs app logic (e.g. "award a badge if this is the 10th book").</li>
    <li><b>Optimistic concurrency</b>: add a <code>version</code> column. <code>UPDATE … SET books_finished = 5, version = 8 WHERE student_id = 'ana' AND version = 7</code>. If zero rows changed, someone else won; re-read and retry. Use it when conflicts are rare and you don't want to hold locks, such as a teacher editing an assignment in two tabs (that's how you return a <code>409 Conflict</code>).</li>
  </ul>
  <table class="tbl">
    <thead><tr><th>Isolation level</th><th>Plain words</th><th>Lost update above?</th></tr></thead>
    <tbody>
      <tr><td>Read Committed (Postgres default)</td><td>Each statement sees data committed before it started</td><td>Happens</td></tr>
      <tr><td>Repeatable Read</td><td>The whole transaction sees one snapshot</td><td>Postgres aborts B with a serialization error; you retry</td></tr>
      <tr><td>Serializable</td><td>Result is as if transactions ran one at a time</td><td>Prevented (with retries); more aborts under load</td></tr>
    </tbody>
  </table>
  <p>Stronger isolation gives you fewer anomalies at the cost of more aborted transactions you must retry. Most teams stay on Read Committed and use atomic updates or row locks at the few places that need them.</p>

  <h2>8. The N+1 query</h2>
  <p>The teacher dashboard lists 28 students with their minutes this week. A natural first version, especially with an ORM:</p>
  <pre><code class="lang-js">const students = await db.query('SELECT id, name FROM students s JOIN enrollments e ON e.student_id = s.id WHERE e.class_id = $1', [classId]); // 1 query
for (const s of students) {
  s.minutes = await db.one('SELECT COALESCE(SUM(minutes),0) FROM reading_sessions WHERE student_id = $1 AND created_at &gt;= $2', [s.id, weekStart]); // +28 queries
}</code></pre>
  <p>That's <b>1 + N</b> queries: 29 round trips to the database. At about 1–2ms each, that's 30–60ms of mostly waiting, for one page. At 8:05am with 3,000 teachers loading dashboards, it's 87,000 queries instead of 3,000. Fix it by asking once:</p>
  <pre><code class="lang-sql">SELECT s.id, s.name, COALESCE(SUM(r.minutes), 0) AS minutes
  FROM enrollments e
  JOIN students s ON s.id = e.student_id
  LEFT JOIN reading_sessions r ON r.student_id = s.id AND r.created_at &gt;= $2
 WHERE e.class_id = $1
 GROUP BY s.id, s.name;</code></pre>
  <p>Or, when you must load things separately, batch them: one query with <code>WHERE student_id = ANY($1)</code> for all 28 IDs. GraphQL servers do this with a "DataLoader" that collects IDs requested in the same tick. N+1 is the most common cause of slow endpoints in apps built on ORMs; look for queries inside loops.</p>

  <h2>9. Migrations: changing the schema without downtime</h2>
  <p>A <b>migration</b> is a versioned script that changes the schema (<code>001_create_classes.sql</code>, <code>002_add_lexile.sql</code>), run in order by a tool and checked into git. The hard part isn't writing them; it's that during a deploy, <b>old and new app code run at the same time</b> against the same database.</p>
  <p>Say you want to rename <code>students.grade</code> to <code>grade_level</code>. Rename it in one step and every old server still running crashes on its next query. The safe pattern is <b>expand, migrate, contract</b>:</p>
  <div class="trace">
    <b>Trace · renaming a column with zero downtime</b>
    <ol>
      <li><p><b>Expand.</b> Migration adds <code>grade_level</code> (nullable). Deploy code that writes <b>both</b> columns and still reads <code>grade</code>. Old and new code both work.</p></li>
      <li><p><b>Backfill.</b> A background job copies <code>grade</code> into <code>grade_level</code> in batches of 5,000 rows, so it never locks the table for long.</p></li>
      <li><p><b>Switch reads.</b> Deploy code that reads <code>grade_level</code>. Still writes both, so you can roll back.</p></li>
      <li><p><b>Contract.</b> A week later, stop writing <code>grade</code>, then drop it in a final migration.</p></li>
    </ol>
  </div>
  <p>Two Postgres specifics worth knowing: adding a column with a constant default is fast on modern versions, and <code>CREATE INDEX CONCURRENTLY</code> builds an index without blocking writes (a plain <code>CREATE INDEX</code> on a big, busy table blocks inserts until it finishes, which at 8am means an outage).</p>

  <div class="callout key"><span class="callout-label">Say it in the interview</span><p>"The core tables are classes, students, an enrollments join table for the many-to-many, and reading_sessions, which is the big one: about 6 million rows a day. Every table carries district_id because it's the tenant key. The teacher dashboard query is served by an index on (class_id, created_at), and I'd keep a per-student weekly counter updated in the same transaction as the insert, using an atomic increment so concurrent devices can't lose updates. Schema changes go out as expand-and-contract migrations, and indexes are built concurrently."</p></div>

  <div class="callout warn"><span class="callout-label">Common mistake</span><p><b>Read-modify-write in application code.</b> <code>const s = await get(); s.count += 1; await save(s);</code> looks fine in testing because tests run one request at a time. In production, two requests interleave and one update vanishes, with no error. Whenever you update a value based on its current value, use an atomic <code>SET x = x + 1</code>, a row lock, or a version check.</p></div>

  <h2>Recap</h2>
  <ul>
    <li>Tables have <b>primary keys</b>; relationships are <b>foreign keys</b> on the "many" side; many-to-many needs a <b>join table</b>. Let constraints catch bugs.</li>
    <li><b>Normalize</b> by default (one fact, one place). <b>Denormalize</b> on purpose for hot reads, and update the copy in the same transaction.</li>
    <li><b>INNER JOIN</b> keeps matched rows only; <b>LEFT JOIN</b> keeps the whole left list. "Who didn't read?" needs LEFT JOIN.</li>
    <li>A <b>B-tree index</b> finds rows in 3–4 page reads instead of a full scan; column order decides which queries it serves, and every index slows writes.</li>
    <li><b>Lost updates</b> happen silently on read-modify-write; fix with atomic updates, <code>FOR UPDATE</code>, or version checks.</li>
    <li>Kill <b>N+1</b> queries with joins or batching; change schemas with <b>expand → migrate → contract</b>.</li>
  </ul>
