  <h1>Case study: A Claude.ai-style LLM chat product</h1>
  <p class="lede">An LLM chat app breaks the usual web assumptions: one request can stream for 30 seconds, the expensive part runs on GPUs you may not own, the cost of a message grows as the conversation gets longer, and "regenerate" turns a list of messages into a tree. After this lesson you can design the full backend: streaming over SSE that survives disconnects, conversation storage with branching, context-window management, prompt caching, per-user and per-org limits, and cost tracking.</p>

  <h2>1. Clarify requirements</h2>
  <p>Running example: a Claude.ai-like product. Dana, a teacher, pastes a 20-page curriculum PDF, asks for a week of lesson plans, watches the answer stream in, edits her second message, and regenerates. Her school pays for an organization plan.</p>
  <p><b>Functional</b></p>
  <ul>
    <li>Send a message and stream the reply token by token; stop generation mid-stream.</li>
    <li>Conversation list and history; edit a previous message or regenerate a reply (creating branches).</li>
    <li>Attachments (PDFs, images); a choice of models.</li>
    <li>Usage limits per plan; org admins see usage.</li>
  </ul>
  <p><b>Non-functional</b></p>
  <ul>
    <li>Time to first token (TTFT) small: the user should see text start within ~1–2 s (the model's own latency is most of it).</li>
    <li>No lost replies: if the browser tab sleeps or Wi-Fi blips, the reply continues and can be resumed.</li>
    <li>Cost-aware: per-message cost is tracked; abusive usage is capped.</li>
    <li>Safety checks on inputs and outputs; privacy controls (delete conversations).</li>
  </ul>
  <p><b>Out of scope:</b> training the model, the inference server internals (batching, KV cache on GPUs), billing UI.</p>

  <h2>2. Estimates</h2>
  <div class="trace">
    <ol>
      <li><b>Messages.</b> 10 million DAU × 15 messages/day = 150 M/day ≈ <b>1,700 messages/second</b>, peaking ~5,000.</li>
      <li><b>Stream duration.</b> Average reply ~500 output tokens. At roughly 50 tokens/second (varies a lot by model and load), that's ~10 s of streaming.</li>
      <li><b>Concurrent streams (Little's Law).</b> Things in the system = arrival rate × time each spends there. 1,700/s × 10 s ≈ <b>17,000 open streams</b> on average; at peak 5,000/s × 10–15 s ≈ <b>50,000–75,000</b>. Each is a held HTTP connection, so the API tier must be built for many long-lived connections, not short requests.</li>
      <li><b>Tokens.</b> Each request re-sends the conversation as context. Average input ~4,000 tokens (system prompt + history + new message) → 150 M × 4,000 = <b>600 billion input tokens/day</b>, versus 150 M × 500 = 75 billion output tokens. Input volume dominates, which is why prompt caching matters.</li>
      <li><b>Cost illustration.</b> At a hypothetical $3 per million input tokens, 600 B input tokens is ~$1.8 M/day before caching. If 70% of input tokens are a repeated prefix served from a prompt cache at a fraction of the price, the input bill drops by more than half. (Use your provider's real prices; the point is the shape.)</li>
      <li><b>Storage.</b> ~3 KB of text per message (a 500-token reply is ~2 KB) → 450 GB/day ≈ 165 TB/year, plus attachments in object storage.</li>
    </ol>
  </div>

  <h2>3. API</h2>
  <pre><code class="lang-http">POST /v1/conversations/c_5/messages
Accept: text/event-stream
Idempotency-Key: 0b9e...
{ "parent_message_id": "m_41", "content": [ { "type": "text", "text": "Make Wednesday a lab day" } ],
  "model": "large", "attachments": [ "f_77" ] }

200 (Content-Type: text/event-stream)
id: 1
event: message_start
data: {"user_message_id":"m_42","assistant_message_id":"m_43"}

id: 2
event: delta
data: {"text":"Here is a revised "}
...
id: 311
event: message_end
data: {"stop_reason":"end_turn","usage":{"input_tokens":5120,"cached_input_tokens":4800,"output_tokens":612}}

GET  /v1/messages/m_43/stream        Last-Event-ID: 57   -- resume after a disconnect
POST /v1/messages/m_43/stop                                -- user pressed Stop
GET  /v1/conversations?cursor=...                          -- sidebar list</code></pre>
  <p>SSE (Server-Sent Events) is a one-way stream over plain HTTP: the server writes <code>event:</code>/<code>data:</code> lines and the browser's <code>EventSource</code> (or a fetch reader) consumes them. It's a good fit because the client only needs to receive, it works through most proxies, and the numbered <code>id:</code> lines make resume possible.</p>

  <h2>4. Data model</h2>
  <pre><code class="lang-sql">conversations (conversation_id PK, user_id, org_id, title, model,
               current_leaf_id,                 -- which branch the UI shows
               created_at, updated_at)
messages      (message_id PK, conversation_id, parent_id,   -- a tree: edits and regenerations branch
               role,                            -- user | assistant
               content JSONB,                   -- blocks: text, image ref, tool use...
               status,                          -- streaming | complete | stopped | error
               model, input_tokens, cached_input_tokens, output_tokens,
               created_at)
attachments   (file_id PK, conversation_id, storage_key, mime, extracted_text_key, token_count)
usage_ledger  (org_id, user_id, ts, message_id, model,
               input_tokens, cached_input_tokens, output_tokens, cost_micros)</code></pre>
  <p><b>Why a tree?</b> Dana edits message 2. You can't overwrite it: the old branch still exists and the UI lets her flip between versions ("2 / 2"). So each message points to its parent, and the conversation remembers the current leaf. The context for the next reply is the path from the root to that leaf.</p>

  <h2>6. Deep dive: streaming that survives disconnects</h2>
  <p>The naive design ties generation to the HTTP connection: browser → server → model, tokens flow back through the same pipe. When Dana's laptop sleeps for 5 seconds, the connection drops, the server cancels the model call, and the reply is lost, after you already paid for half of it.</p>
  <p>Decouple them:</p>
  <ul>
    <li><b>Generation runs on its own.</b> The gateway's work isn't tied to the client connection. It writes tokens into a short-lived, per-reply buffer (e.g. a Redis Stream keyed by <code>m_43</code> with a TTL of ~10 minutes), and flushes the accumulated text to the database every second or so and at the end.</li>
    <li><b>Clients are readers.</b> The SSE handler replays the buffer from the client's last event ID and then tails it. On reconnect, the browser sends <code>Last-Event-ID: 57</code>; the server replays from 58 and continues. A second tab can watch the same reply.</li>
    <li><b>Stop is explicit.</b> Pressing Stop calls <code>POST /stop</code>, which cancels the model call, saves the partial text with status <code>stopped</code>, and bills the tokens actually generated. A dropped connection is not a stop.</li>
    <li><b>Long-lived connections.</b> 50,000–75,000 concurrent streams at peak means async I/O servers (Node, Go, async Python), generous idle timeouts on load balancers, and SSE comment lines every ~15 s as keep-alives so proxies don't close quiet streams.</li>
  </ul>

  <h2>7. Deep dive: context windows, prompt caching, and cost</h2>
  <p>Every turn re-sends the conversation. Turn 30 of a long chat might carry 60,000 tokens of history to produce a 300-token answer. Three levers:</p>
  <ol>
    <li><b>Prompt caching.</b> Providers can cache the processed form of a prompt prefix so a repeated prefix is cheaper and faster on the next call (cached input is billed at a fraction of normal input, for a limited time window). To get hits, keep the prefix byte-for-byte stable: system prompt first, then attachments, then history in order, and append only. Putting the current time or a random ID at the top of the system prompt silently destroys your cache hit rate.</li>
    <li><b>Token budget and trimming.</b> Set a context budget per model and plan, below the model's hard limit. When the conversation exceeds it: drop or summarize the oldest turns (store the summary so you compute it once), and for big documents retrieve only relevant chunks (retrieval-augmented generation, RAG) instead of pasting all 200 pages.</li>
    <li><b>Model routing.</b> Titles, summaries, and safety classification go to small, cheap models. The user's chosen model handles the actual reply.</li>
  </ol>
  <p>Record <code>input_tokens</code>, <code>cached_input_tokens</code> and <code>output_tokens</code> per message. Cost per active user per day becomes a dashboard number, and a regression (like a prompt change that broke caching) shows up the next morning instead of on the monthly invoice.</p>

  <h2>8. Deep dive: limits, capacity, and failure</h2>
  <ul>
    <li><b>Per-user limits by plan.</b> A rolling window (e.g. N messages per several hours, weighted by model size and context length) implemented as a token bucket where a message's cost reflects its tokens.</li>
    <li><b>Per-org budgets.</b> Monthly or per-minute token budgets per organization; reserve an estimate before the call, reconcile with actual usage after.</li>
    <li><b>Concurrency caps.</b> 1–3 simultaneous generations per user. Stops runaway scripts and keeps GPU capacity fair.</li>
    <li><b>Admission control.</b> GPU capacity is finite and can't autoscale in seconds. When the gateway sees inference saturated (queue time rising, overload errors), it queues briefly, then degrades: free tier gets a smaller model or a "high demand" message; paid tiers keep priority.</li>
    <li><b>Gateway resilience.</b> Timeout on time-to-first-token (not just total time), retry overloaded calls with backoff on another region or endpoint, but only before any tokens have streamed (once text is on screen, a silent retry would produce a different answer).</li>
    <li><b>Safety.</b> A fast classifier on input before calling the model; output checks on the stream, which may need to cut a reply mid-stream. Log flagged content to a restricted review queue with its own retention policy.</li>
  </ul>

  <h2>10. Follow-up questions and strong answers</h2>
  <h3>"How do you store 165 TB/year of messages?"</h3>
  <p>Partition by conversation (most reads are "load this conversation") and keep recent conversations in the primary store; older content can move to cheaper storage and be rehydrated on open. Postgres with partitioning works for a long time; a wide-column store fits when write volume outgrows it. Deletion requests must cascade to attachments, caches, search indexes and analytics copies.</p>
  <h3>"How would you add conversation search?"</h3>
  <p>Index titles and message text into a search engine, partitioned by user (or org) so queries never scan others' data and permissions are enforced by the index key. Update asynchronously from message-complete events.</p>
  <h3>"How do you know a prompt change made answers better?"</h3>
  <p>Offline evals: a fixed set of representative conversations scored by rubric or by a grader model, run before shipping. Online: thumbs up/down, regenerate rate, conversation length, and A/B tests behind flags.</p>
  <h3>"A school district asks: where does our data go?"</h3>
  <p>Org-level settings: data retention period, whether conversations can be used for improvement (off by default for education), region pinning if required, admin export and deletion. Log access to conversation content by staff.</p>

  <div class="callout"><span class="callout-label">Say it in the interview</span><p>"Little's Law says 1,700 messages a second times 10 seconds of streaming is about 17,000 open streams, peaking near 70,000, so the API tier is built for long-lived SSE connections. I'd decouple generation from the connection: tokens go into a per-reply buffer with event IDs, so a dropped tab resumes with Last-Event-ID instead of losing a paid-for reply. Messages form a tree for edits and regenerations. Input tokens dominate cost because history is resent every turn, so I keep the prompt prefix stable for caching, trim or summarize old turns, and meter cached and uncached tokens per message."</p></div>

  <div class="callout warn"><span class="callout-label">Common mistake</span><p>Designing it like a normal request/response API: "the client POSTs, the server calls the model, returns the answer." That ignores 10–30 second responses, streaming, disconnects mid-reply, GPU capacity limits that can't autoscale instantly, and costs that grow with conversation length. Say "streaming", "resume", "admission control", and "tokens per message" early.</p></div>

  <h2>11. Your turn</h2>
  <p>Add an <b>agent mode</b>: the assistant can run for up to 10 minutes, calling tools (web search, code execution, reading the user's files), while the user may close the tab and come back.</p>
  <details>
    <summary>Show a model answer</summary>
    <p><b>It's a job, not a request.</b> <code>POST /v1/agent-runs</code> creates a run row and enqueues it; returns <code>run_id</code> immediately. Workers execute the loop: call model → maybe call a tool → append result → call model again.</p>
    <p><b>Durable state.</b> After every step, checkpoint the run (messages so far, tool results, step count) to the database. If a worker dies, another resumes from the last checkpoint. Tool calls with side effects get idempotency keys (<code>run_id:step</code>) so a resumed step doesn't, say, send an email twice.</p>
    <p><b>Progress.</b> Each step emits events to the run's event log; the UI subscribes via SSE with <code>Last-Event-ID</code>, exactly like replies. Closed tab? On return, replay the log. Long runs also trigger a notification when finished.</p>
    <p><b>Budgets and safety.</b> Max steps, max tokens, max wall-clock time, and per-org concurrency caps on runs. Tools run sandboxed with least privilege; reads of user files are permission-checked per call. User can cancel at any step.</p>
    <p><b>Trade-off:</b> durable step-by-step execution gives crash recovery and resumability at the cost of a write per step and more complex state; obviously worth it when a run costs minutes of GPU time.</p>
  </details>

  <h2>Recap</h2>
  <ul>
    <li>Little's Law sizes the streaming tier: tens of thousands of concurrent SSE connections.</li>
    <li>Generation is decoupled from the connection via a per-reply buffer with event IDs: resume, multi-tab, explicit Stop.</li>
    <li>Messages form a tree; context is the root-to-leaf path, trimmed or summarized to a token budget.</li>
