<body>
<header class="top">
  <button class="icon-btn" id="sideToggle" aria-controls="side" aria-expanded="true" title="Show or hide lessons">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="#start" aria-label="Backend &amp; System Design: start page">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" rx="8" fill="var(--accent)"/>
      <rect x="8" y="8" width="16" height="5" rx="1.5" fill="var(--accent-ink)"/>
      <rect x="8" y="15" width="16" height="5" rx="1.5" fill="var(--accent-ink)" opacity=".75"/>
      <rect x="8" y="22" width="16" height="3" rx="1.5" fill="var(--accent-ink)" opacity=".5"/>
    </svg>
    <span class="brand-name">Backend &amp; System Design</span>
  </a>
  <div class="top-progress" title="Your progress is saved in this browser">
    <span id="progText">0 read</span>
    <div class="bar" aria-hidden="true"><i id="progFill"></i></div>
  </div>
  <button class="icon-btn theme-btn" id="themeBtn" title="Switch light / dark" aria-label="Switch light or dark theme">
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Lessons"></nav>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"><article class="lesson" id="lesson"></article></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
