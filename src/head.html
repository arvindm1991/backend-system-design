<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backend &amp; System Design</title>
<meta name="description" content="A hands-on course in backend engineering, distributed systems and system design for full-stack builders.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
/* apply the saved theme before first paint (no flash) */
try { var t = JSON.parse(localStorage.getItem('bsd:theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
/* ============ Tokens ============
   Diagrams in lessons use currentColor plus --accent, --line, --muted, --surface (and --ink, --ok, --warn, --accent-soft).
   Everything below is redefined for dark mode, so SVGs that use these tokens work in both themes. */
:root {
  --bg: #F4F5F8;
  --surface: #FFFFFF;
  --surface-2: #ECEEF3;
  --ink: #131A26;
  --muted: #5A6377;
  --line: #D8DCE5;
  --accent: #2F55D4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7ECFC;
  --ok: #1B7A47;
  --ok-soft: #E1F2E8;
  --warn: #965800;
  --warn-soft: #FFF0D4;
  --bad: #C42B4E;
  --bad-soft: #FBE6EB;
  --code-bg: #E9ECF2;
  --code-ink: #1D2433;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 16px rgba(16, 24, 40, .04);
  --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --top-h: 56px;
  --side-w: 288px;

  /* code surfaces are dark in both themes */
  --ide-bg: #0D1322;
  --ide-panel: #121A2C;
  --ide-panel-2: #172036;
  --ide-raised: #1E2942;
  --ide-line: #24304B;
  --ide-text: #D5DCEA;
  --ide-muted: #8390AA;
  --ide-green: #2FB67C;
  --ide-red: #FF6B6B;
  --ide-amber: #F2B441;
  --ide-blue: #5B8CFF;
  --syn-kw: #C792EA;
  --syn-str: #C3E88D;
  --syn-num: #F78C6C;
  --syn-fn: #82AAFF;
  --syn-com: #6A7A9C;
  --syn-prop: #89DDFF;
  --syn-tag: #F07178;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1118; --surface: #161A24; --surface-2: #1E2331; --ink: #E6E9F0; --muted: #9AA3B6;
    --line: #2B3142; --accent: #8FA5FF; --accent-ink: #0B1030; --accent-soft: #1F2747;
    --ok: #4CC487; --ok-soft: #13301F; --warn: #F2B441; --warn-soft: #33270D; --bad: #FF7A93; --bad-soft: #3A1823;
    --code-bg: #1E2433; --code-ink: #DCE2EE; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1118; --surface: #161A24; --surface-2: #1E2331; --ink: #E6E9F0; --muted: #9AA3B6;
  --line: #2B3142; --accent: #8FA5FF; --accent-ink: #0B1030; --accent-soft: #1F2747;
  --ok: #4CC487; --ok-soft: #13301F; --warn: #F2B441; --warn-soft: #33270D; --bad: #FF7A93; --bad-soft: #3A1823;
  --code-bg: #1E2433; --code-ink: #DCE2EE; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--top-h) + 16px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16.5px; line-height: 1.65; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
[data-go] { cursor: pointer; }
.lesson a[data-go]:not(.pager a):not(.days a) { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ============ Top bar ============ */
.top {
  position: sticky; top: 0; z-index: 40; height: var(--top-h);
  display: flex; align-items: center; gap: 14px; padding: 0 20px 0 12px;
  padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0;
  border-radius: 9px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.brand-mark { width: 28px; height: 28px; flex-shrink: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-progress { margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.bar { width: 120px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .4s; }
.theme-btn .i-sun { display: none; }
:root[data-theme="dark"] .theme-btn .i-sun { display: block; }
:root[data-theme="dark"] .theme-btn .i-moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-btn .i-sun { display: block; }
  :root:not([data-theme="light"]) .theme-btn .i-moon { display: none; }
}

/* ============ Layout ============ */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
@media (min-width: 901px) {
  body.side-collapsed .layout { grid-template-columns: minmax(0, 1fr); }
  body.side-collapsed .side { display: none; }
}
.side {
  position: sticky; top: var(--top-h); align-self: start; height: calc(100vh - var(--top-h));
  overflow-y: auto; overscroll-behavior: contain; padding: 18px 12px 40px; border-right: 1px solid var(--line);
  background: var(--bg); scrollbar-width: thin;
}
.side-part { margin: 20px 0 6px; padding: 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.side-part:first-child { margin-top: 0; }
.side-part span:last-child { font-family: var(--font-mono); letter-spacing: 0; font-weight: 400; }
.side-link {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.35;
}
.side-link:hover { background: var(--surface-2); }
.side-link.is-current { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); font-weight: 600; }
.side-num { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.side-marks { display: flex; gap: 5px; align-items: center; }
.side-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); }
.side-link.is-read .side-dot { background: var(--ok); border-color: var(--ok); }
.side-lab { font-family: var(--font-mono); font-size: 10px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); line-height: 16px; }
.side-lab.is-pass { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.side-reset { margin: 26px 10px 0; padding: 0; border: 0; background: none; color: var(--muted); font-size: 12.5px; text-decoration: underline; cursor: pointer; }
.scrim { display: none; }

.main { min-width: 0; padding: 40px 48px 120px; }
.lesson { max-width: 760px; margin: 0 auto; }

/* ============ Lesson typography ============ */
.eyebrow { margin: 0 0 8px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.lesson h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 4.2vw, 44px); line-height: 1.07; letter-spacing: -0.022em; margin: 0 0 16px; text-wrap: balance; }
.lesson .lede { font-size: 19px; line-height: 1.55; color: var(--muted); margin: 0 0 30px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin: -12px 0 32px; }
.chip { font-family: var(--font-mono); font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.is-ok { background: var(--ok-soft); color: var(--ok); }
.lesson h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.2; letter-spacing: -0.012em; margin: 52px 0 12px; text-wrap: balance; }
.lesson h3 { font-size: 18px; font-weight: 600; margin: 32px 0 6px; }
.lesson h4 { font-size: 15px; font-weight: 600; margin: 22px 0 4px; }
.lesson p { margin: 0 0 14px; }
.lesson ul, .lesson ol { padding-left: 24px; margin: 0 0 16px; }
.lesson li + li { margin-top: 5px; }
.lesson strong, .lesson b { font-weight: 600; }
.lesson hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
.lesson :not(pre) > code { font-family: var(--font-mono); font-size: .85em; background: var(--code-bg); color: var(--code-ink); padding: 1.5px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.lesson blockquote { margin: 18px 0; padding: 4px 18px; border-left: 3px solid var(--accent); color: var(--muted); }
.lesson details { margin: 16px 0; padding: 0 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.lesson details > summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
.lesson details[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.lesson kbd { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); }
.lesson img { max-width: 100%; }

/* code blocks */
.code { margin: 16px 0 22px; border-radius: 11px; overflow: hidden; background: var(--ide-panel); border: 1px solid var(--ide-line); }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px 5px 14px; font-family: var(--font-mono); font-size: 11px; color: var(--ide-muted); border-bottom: 1px solid var(--ide-line); text-transform: uppercase; letter-spacing: .05em; }
.code-bar button { border: 0; background: none; color: var(--ide-muted); cursor: pointer; font: 11px var(--font-mono); padding: 3px 7px; border-radius: 5px; }
.code-bar button:hover { color: var(--ide-text); background: var(--ide-raised); }
.code pre, .lesson pre { margin: 0; }
.code pre { padding: 13px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 13px; line-height: 1.62; color: var(--ide-text); tab-size: 2; }
.code pre code { font: inherit; background: none; color: inherit; padding: 0; }
.t-kw { color: var(--syn-kw); } .t-str { color: var(--syn-str); } .t-num { color: var(--syn-num); } .t-fn { color: var(--syn-fn); }
.t-com { color: var(--syn-com); font-style: italic; } .t-prop { color: var(--syn-prop); } .t-tag { color: var(--syn-tag); }
.t-hl { background: rgba(91, 140, 255, .18); border-radius: 3px; }

/* callouts */
.callout { margin: 22px 0; padding: 14px 18px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); }
.callout-label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.callout p:last-child, .callout ul:last-child, .callout ol:last-child { margin-bottom: 0; }
.callout.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn-soft) 55%, var(--surface)); }
.callout.warn .callout-label { color: var(--warn); }
.callout.ok, .callout.tip { border-left-color: var(--ok); }
.callout.ok .callout-label, .callout.tip .callout-label { color: var(--ok); }
.callout.key { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); border-left-color: var(--accent); }

/* diagrams */
.diagram { margin: 24px 0 26px; padding: 18px 16px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.diagram-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.diagram svg { display: block; max-width: 100%; height: auto; margin: 0 auto; color: var(--ink); overflow: visible; }
.diagram svg text { font-family: var(--font-body); }
.diagram svg .mono, .diagram svg text.mono { font-family: var(--font-mono); }
.diagram figcaption { margin-top: 12px; font-size: 14px; color: var(--muted); text-align: center; text-wrap: balance; }
.diagram-hint { display: none; font-size: 12px; color: var(--muted); text-align: right; margin: 0 0 6px; }

/* traces */
.trace { margin: 22px 0; padding: 16px 18px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.trace > b:first-child, .trace > .trace-title, .trace > h4:first-child { display: block; margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.trace ol { list-style: none; counter-reset: step; padding: 0; margin: 0; }
.trace ol > li { counter-increment: step; position: relative; padding: 0 0 12px 40px; margin: 0; }
.trace ol > li + li { margin-top: 0; }
.trace ol > li::before {
  content: counter(step); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; font: 600 12px var(--font-mono); background: var(--accent-soft); color: var(--accent);
}
.trace ol > li:not(:last-child)::after { content: ''; position: absolute; left: 12.5px; top: 30px; bottom: 2px; width: 1px; background: var(--line); }
.trace ol > li > p:last-child { margin-bottom: 0; }
.trace pre, .trace .code { margin: 8px 0 4px; }
.trace .yes, .trace .ok { color: var(--ok); font-weight: 600; }
.trace .no, .trace .bad { color: var(--bad); font-weight: 600; }
.trace code { white-space: normal; }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 18px 0 24px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.5; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tbl th { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child { font-weight: 500; }
.tbl caption { caption-side: bottom; padding: 8px 14px; font-size: 13px; color: var(--muted); text-align: left; }

/* quiz */
.quiz { margin: 32px 0; display: grid; gap: 12px; }
.quiz-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.quiz-head h3 { margin: 0; font-family: var(--font-display); font-size: 21px; }
.quiz-score { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.q { padding: 16px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.q-text { margin: 0 0 12px !important; font-weight: 500; }
.q-text .q-n { font-family: var(--font-mono); font-size: 12px; color: var(--accent); margin-right: 6px; }
.q-opts { display: grid; gap: 7px; }
.q-opt {
  display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; text-align: left;
  padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg);
  cursor: pointer; font-size: 15px; line-height: 1.45;
}
.q-opt:hover:not(:disabled) { border-color: var(--accent); }
.q-opt:disabled { cursor: default; }
.q-key { font: 600 12px/21px var(--font-mono); color: var(--muted); }
.q-opt.is-right { border-color: var(--ok); background: var(--ok-soft); }
.q-opt.is-right .q-key { color: var(--ok); }
.q-opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.q-opt.is-wrong .q-key { color: var(--bad); }
.q-opt.is-dim { opacity: .6; }
.q-opt code { font-family: var(--font-mono); font-size: .86em; }
.q-why { margin: 12px 0 0 !important; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 14.5px; }
.q-why b.is-right { color: var(--ok); } .q-why b.is-wrong { color: var(--bad); }
.link-btn { justify-self: start; border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }

/* labs */
.lab { margin: 34px 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.lab-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.lab-badge { flex-shrink: 0; font: 600 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); }
.lab-head h3 { margin: 0 !important; font-family: var(--font-display); font-size: 19px; line-height: 1.25; }
.lab-mins { margin-left: auto; font: 12px var(--font-mono); color: var(--muted); white-space: nowrap; }
.lab-status { font: 600 12px var(--font-mono); color: var(--ok); white-space: nowrap; }
.lab-prompt { padding: 16px 18px 4px; font-size: 15.5px; }
.lab-prompt pre { margin: 8px 0 14px; padding: 10px 12px; border-radius: 8px; background: var(--ide-panel); color: var(--ide-text); font: 12.5px/1.6 var(--font-mono); overflow-x: auto; }
.lab-prompt pre code { background: none !important; color: inherit !important; padding: 0 !important; }
.lab-editor { position: relative; margin: 6px 18px 0; height: 260px; min-height: 140px; border-radius: 10px; overflow: hidden; border: 1px solid var(--ide-line); background: var(--ide-bg); color: var(--ide-text); }
.lab-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 18px; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { opacity: .9; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.lab-bar .spacer { flex: 1; }
.lab-kbd { font-size: 12px; color: var(--muted); }
.lab-out { padding: 0 18px 18px; display: grid; gap: 10px; }
.lab-summary { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.lab-summary.is-ok { color: var(--ok); } .lab-summary.is-bad { color: var(--bad); }
.lab-tests { list-style: none; margin: 0 !important; padding: 0 !important; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lab-tests li { margin: 0 !important; padding: 9px 12px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 14.5px; }
.lab-tests li:last-child { border-bottom: 0; }
.lab-tests .ic { font-weight: 700; }
.lab-tests .pass .ic { color: var(--ok); } .lab-tests .fail .ic { color: var(--bad); }
.lab-tests .msg { grid-column: 2; margin-top: 3px; font: 12.5px/1.55 var(--font-mono); color: var(--bad); white-space: pre-wrap; overflow-wrap: anywhere; }
.lab-tests .logs { grid-column: 2; margin-top: 4px; padding: 6px 8px; border-radius: 6px; background: var(--ide-panel); color: var(--ide-text); font: 12px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow: auto; }
.lesson .lab-tests details { grid-column: 2; margin: 4px 0 0; padding: 0; border: 0; background: none; border-radius: 0; }
.lesson .lab-tests details > summary { padding: 0; font-weight: 400; }
.lesson .lab-tests details[open] > summary { border: 0; margin-bottom: 4px; }
.lab-tests summary { font-size: 12.5px; color: var(--muted); cursor: pointer; }
.lab-pystatus { margin: 8px 18px 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.lab-pystatus.is-ready { color: var(--ok); }
.lab-pystatus.is-error { color: var(--bad); }
.spin { width: 13px; height: 13px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
